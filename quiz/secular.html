  function fillChoices(id, name, opts, current) {
    const box = document.getElementById(id);
    box.innerHTML = "";
    opts.forEach(function (opt) {
      const label = document.createElement("label");
      label.className = "choicecard";
      const input = document.createElement("input");

      input.name = name;
      input.value = opt.key;
      if (current === opt.key) input.checked = true;
      const mark = document.createElement("span");
      mark.className = "choicecard__mark";
      const text = document.createElement("span");
      text.className = "choicecard__text";
      text.textContent = opt.text;
      label.appendChild(input);
      label.appendChild(mark);
      label.appendChild(text);
      label.addEventListener("click", function () {
        quiz[name] = opt.key;
        const order = sequence();
        const i = order.indexOf(stepName);
        if (i < order.length - 1) { stepName = order[i + 1]; render(); }
      });
      box.appendChild(label);
    });
  }

    const bibleQuiz = preset.key === "bible";
    const qq = bibleQuiz
      ? [l.q1, l.q2, l.q3]
      : [l.g1, l.g2, l.g3];
    document.getElementById("q1-title").textContent = qq[0].title;
    document.getElementById("q2-title").textContent = qq[1].title;
    document.getElementById("q3-title").textContent = qq[2].title;
    fillChoices("q1-opts", "q1", qq[0].opts, quiz.q1);
    fillChoices("q2-opts", "q2", qq[1].opts, quiz.q2);
    fillChoices("q3-opts", "q3", qq[2].opts, quiz.q3);

    document.getElementById("s2-title").textContent = l.s2.title;
    document.getElementById("s2-sub").textContent = l.s2.sub;
    document.getElementById("lbl-fname").textContent = l.s2.fname;
    document.getElementById("lbl-email").textContent = l.s2.email;
    document.getElementById("lbl-channel").textContent = l.s2.channel;
    document.getElementById("email-soon").textContent = l.s2.emailSoon;
    document.getElementById("reg-fname").placeholder = l.s2.fnamePh;
    document.getElementById("reg-email").placeholder = l.s2.emailPh;
    document.getElementById("s2-consent").textContent = l.s2.consent;
    document.getElementById("s2-disclaimer").innerHTML = l.s2.disclaimer;
    document.getElementById("btn-back").textContent = l.back;
    document.getElementById("btn-back").hidden = index === 0;
    document.getElementById("pay-title").textContent = l.pay.title;
    document.getElementById("pay-sub").textContent = l.pay.sub;
    document.getElementById("pay-soon").textContent = l.pay.soon;
    document.getElementById("pay-back").textContent = l.back;
    document.getElementById("pay-back").hidden = index === 0;
    const checkout = document.getElementById("pay-checkout");
    const checkoutHref = publicCheckoutUrl();
    checkout.textContent = l.pay.button;
    if (checkoutHref) {
      checkout.href = checkoutHref;
      checkout.hidden = false;
      document.getElementById("pay-soon").hidden = true;
    } else {
      checkout.hidden = true;
      document.getElementById("pay-soon").hidden = false;
    }
    const submit = document.getElementById("btn-register");
    submit.textContent = l.next;
    if (!RELIGION_OPEN) {
      submit.disabled = true;
      showError(l.paused);
    }
    document.getElementById("link-imp").textContent = l.legal.imp;
    document.getElementById("link-dat").textContent = l.legal.dat;
    document.getElementById("link-agb").textContent = l.legal.agb;
    document.getElementById("link-cook").textContent = l.legal.cook;
  }

  document.getElementById("btn-back").addEventListener("click", function () {
    const order = sequence();
    const i = order.indexOf(stepName);
    if (i > 0) { stepName = order[i - 1]; showError(""); render(); }
  });
  document.getElementById("pay-back").addEventListener("click", function () {
    const order = sequence();
    const i = order.indexOf("pay");
    if (i > 0) { stepName = order[i - 1]; showError(""); render(); }
  });

  function publicCheckoutUrl() {
    if (!/^[0-9]+$/.test(DIGISTORE_BIBLE_MONTHLY_PRODUCT_ID)) return "";
    const affKey = (params.get("aff") || "").toLowerCase();
    const affiliate = DIGISTORE_AFFILIATES[affKey] || "";
    if (/^[A-Za-z0-9_-]+$/.test(affiliate)) {
      return "https://www.digistore24.com/redir/" + DIGISTORE_BIBLE_MONTHLY_PRODUCT_ID + "/" + affiliate + "/";
    }
    return "https://www.checkout-ds24.com/product/" + DIGISTORE_BIBLE_MONTHLY_PRODUCT_ID;
  }

  function generateAccessCode() {
    const p1 = Math.random().toString(36).substring(2, 6).toUpperCase();
    const p2 = Math.random().toString(36).substring(2, 6).toUpperCase();
    return p1 + "-" + p2;
  }

  document.getElementById("btn-register").addEventListener("click", async function () {
    const l = L();
    const btn = document.getElementById("btn-register");
    if (!RELIGION_OPEN) { showError(l.paused); return; }
    if (!trialOk) { stepName = "pay"; render(); return; }
    const fname = document.getElementById("reg-fname").value.trim();
    const email = document.getElementById("reg-email").value.trim();
    const channelEl = document.querySelector('input[name="kanal"]:checked');
    const channel = channelEl ? channelEl.value : "";
    if (!chosen) { stepName = "program"; render(); return; }
    if (!fname || !email) { showError(l.s2.errFill); return; }
    if (channel !== "whatsapp" && channel !== "telegram") { showError(l.s2.errChannel); return; }
    const consentBox = document.getElementById("reg-consent");
    if (!consentBox || !consentBox.checked) { showError(l.s2.errConsent); return; }
    if (!window.supabase || !window.supabase.createClient) { showError(l.s2.errLib); return; }

    showError("");
    btn.disabled = true;
    btn.textContent = "…";

    const accessCode = generateAccessCode();
    let timezone = "Europe/Berlin";
    try {
      const detected = Intl.DateTimeFormat().resolvedOptions().timeZone;
      if (detected) timezone = detected;
    } catch (err) { /* keep Berlin if the browser can't name a zone */ }
    const bibleQuiz = chosen && chosen.key === "bible";
    const sets = bibleQuiz ? [l.q1, l.q2, l.q3] : [l.g1, l.g2, l.g3];
    const aim = sets[0].opts.find(function (o) { return o.key === quiz.q1; });
    const slip = sets[1].opts.find(function (o) { return o.key === quiz.q2; });
    const shape = sets[2].opts.find(function (o) { return o.key === quiz.q3; });
    const onboarding = {
      chosen_religion: chosen.key,
      root_problem: chosen.key,
      religion_consent: true,
      religion_consent_at: new Date().toISOString(),
      religion_consent_text: l.s2.consent,
      quiz_aim: quiz.q1,
      quiz_aim_text: aim ? aim.text : "",
      quiz_slip: quiz.q2,
      quiz_slip_text: slip ? slip.text : "",
      quiz_message: quiz.q3,
      quiz_message_text: shape ? shape.text : "",
      timezone: timezone,
      digistore_affiliate: (params.get("aff") || "").toLowerCase(),
      invite_token: trialOk ? inviteToken : ""
    };

    try {
      if (!supabaseClient) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const { error: rpcError } = await supabaseClient.rpc("register_lead", {
        p_email: email,
        p_first_name: fname,
        p_delivery_channel: channel,
        p_source: "religion_selector",
        p_language: lang,
        p_onboarding_data: onboarding,
        p_access_code: accessCode,
        p_chosen_path: chosen.key,
        p_flow_name: chosen.flow
      });
      if (rpcError) throw rpcError;

      const relName = l.rel[chosen.key].name;
      const baseMessage = l.botMsg.replace("{name}", relName);
      const accessLabel = accessLabels[lang] || accessLabels.de;
      const finalMessage = baseMessage + "\n\n" + accessLabel + " " + accessCode;
      const encodedMessage = encodeURIComponent(finalMessage);
      if (channel === "telegram") {
        window.location.href = "https://t.me/" + tgBotName + "?text=" + encodedMessage;
      } else {
        window.location.href = "https://wa.me/" + waNumber + "?text=" + encodedMessage;
      }
    } catch (e) {
      console.error(e);
      const detail = e && (e.message || e.details) ? " " + (e.message || e.details) : "";
      showError(l.s2.errServer + detail);
      btn.disabled = false;
      btn.textContent = l.next;
    }
  });

  render();
  if (inviteToken && window.supabase && window.supabase.createClient) {
    const inviteClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const invitePath = preset.key;
    inviteClient.rpc("trial_invite_valid", { p_token: inviteToken, p_path: invitePath }).then(function (res) {
      trialOk = !!(res && res.data === true && !res.error);
      if (trialOk && stepName === "pay") stepName = "form";
      if (!trialOk && stepName === "form") stepName = "pay";
      render();
    }).catch(function () {
      trialOk = false;
      if (stepName === "form") stepName = "pay";
      render();
    });
  }
</script>
<script src="/site.js"></script>
</body>
</html>
