      const accessCode = await window.smhRegisterLead(supabaseClient, {
        p_email: email,
        p_first_name: fname,
        p_delivery_channel: channel,
        p_source: "quiz_" + THEMA,
        p_language: lang,
        p_onboarding_data: onboarding,
        p_chosen_path: THEMA,
        p_flow_name: FLOW
      });
      const msg = u.botMsg.replace("$1", l.eyebrow) + "\n\n" + u.access + " " + accessCode;
      const encoded = encodeURIComponent(msg);
      channelDone = channel;
      if (channel === "telegram") chatHref = "https://t.me/" + tgBotName + "?text=" + encoded;
      else if (channel === "whatsapp") chatHref = "https://wa.me/" + waNumber + "?text=" + encoded;
      else chatHref = "";
      stepName = "done";
      btn.disabled = false;
      btn.textContent = label;
      render();
      document.getElementById("step-done").scrollIntoView({ block: "start" });
    } catch (e) {
      console.error(e);
      const detail = e && (e.message || e.details) ? " " + (e.message || e.details) : "";
      showError(u.errServer + detail);
      btn.disabled = false;
      btn.textContent = label;
    }
  });

  render();
</script>
<script src="/access-code.js"></script>
<script src="/site.js"></script>
</body>
</html>
