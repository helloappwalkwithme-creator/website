            /* Warm, grounding, and calming color palette */
            --dark: #1a1614; /* Deep warm charcoal/brown */

            --gray-active: #362e2b;
            --border: #423835;
            --gold: #d48a60; /* Soft Terracotta / Amber */
            --text: #f2efe9; /* Soft off-white */
            --error: #cf6666;
            --success: #7a9e7c;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            margin: 0; padding: 0; background-color: var(--dark); color: var(--text); 
            display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; 
        }
        
        .progress-container { width: 100%; height: 3px; background-color: #222; position: fixed; top: 0; left: 0; z-index: 100; display: block; }
        .progress-bar { height: 100%; background-color: var(--gold); width: 0%; transition: width 0.4s ease; }

        .app-header { width: 100%; max-width: 500px; margin: 0 auto; display: flex; justify-content: flex-end; padding: 20px 20px 0 20px; }
        .lang-switcher { background-color: var(--gray); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; outline: none; appearance: none; text-align: center; }
        .lang-switcher:focus { border-color: var(--gold); }

        main { flex: 1; padding: 20px 20px 100px 20px; max-width: 500px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; }
        
        .step { display: none; animation: fadeIn 0.4s ease forwards; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .flow-title { color: var(--gold); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }
        .h1-title { font-size: 26px; font-weight: 800; margin-top: 0; margin-bottom: 24px; color: var(--text); line-height: 1.35; }
        .subtitle { color: #aaaaaa; margin-bottom: 24px; font-size: 15px; line-height: 1.6; }

        .quiz-btn { background-color: var(--gray); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.25s ease; }
        .quiz-btn.selected { border-color: var(--gold); background-color: var(--gray-active); }
        .quiz-btn-text { color: var(--text); font-size: 15px; flex: 1; padding-right: 15px; line-height: 1.5; font-weight: 500; }
        .quiz-btn.selected .quiz-btn-text { color: var(--gold); font-weight: 700; }
        
        .radio-icon { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #555; display: flex; align-items: center; justify-content: center; }
        .quiz-btn.selected .radio-icon { border-color: var(--gold); }
        .radio-icon::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); display: none; }
        .quiz-btn.selected .radio-icon::after { display: block; }

        .check-icon { width: 22px; height: 22px; border-radius: 4px; border: 1px solid #555; display: flex; align-items: center; justify-content: center; color: transparent; font-weight: bold; font-size: 13px; }
        .quiz-btn.selected .check-icon { border-color: var(--gold); background: var(--gold); color: var(--dark); }

        .result-card { background-color: #241916; border: 2px solid var(--gold); border-radius: 12px; padding: 30px 20px; text-align: center; margin-bottom: 16px; }
        .result-score { color: var(--gold); font-size: 32px; font-weight: 800; line-height: 1.2; margin-bottom: 5px; }
        .result-level { color: #e8a5a5; font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; }
        
        .insight-card { background: var(--gray); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 12px; }
        .insight-title { color: #ccc; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        .insight-text { color: #b5b5b5; font-size: 14px; line-height: 1.6; }
        
        .info-card { background: #211c1a; border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 12px; border-left: 2px solid var(--gold); }

        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(26, 22, 20, 0.95); backdrop-filter: blur(8px); border-top: 1px solid var(--border); padding: 15px 20px 25px 20px; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .btn-gold { background-color: var(--gold); color: var(--dark); padding: 16px; border-radius: 8px; font-weight: 800; font-size: 14px; text-transform: uppercase; border: none; width: 100%; max-width: 460px; cursor: pointer; text-align: center; letter-spacing: 1.5px; }
        .btn-gold:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-back { background: none; border: none; color: #888; margin-top: 12px; padding: 8px 16px; cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }

        .input-field { background-color: #2b2522; border: 1px solid var(--border); color: #fff; padding: 16px; border-radius: 8px; font-size: 15px; margin-bottom: 16px; width: 100%; font-family: -apple-system, sans-serif; font-weight: 500;}
        .input-field:focus { border-color: var(--gold); outline: none; }
        
        .spinner { border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; width: 45px; height: 45px; animation: spin 1.2s linear infinite; margin: 60px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Legal Footer */
        .legal-footer { text-align: center; padding: 20px; margin-top: auto; border-top: 1px solid var(--border); font-size: 11px; padding-bottom: 120px; font-family: -apple-system, sans-serif;}
        .legal-footer a { color: #888; text-decoration: none; margin: 0 8px; transition: color 0.2s; }
        .legal-footer a:hover { color: var(--gold); }
    </style>
</head>

            const l = t[currentLang];
            document.documentElement.lang = currentLang;
            
            bNext.innerText = l.btn.next; document.getElementById('btnBack').innerText = l.btn.back;
            
            document.getElementById('s1-lbl').innerText = l.s1.lbl; document.getElementById('s1-title').innerText = l.s1.title;
            document.getElementById('s2-lbl').innerText = l.s2.lbl; document.getElementById('s2-title').innerText = l.s2.title;
            document.getElementById('s3-lbl').innerText = l.s3.lbl; document.getElementById('s3-title').innerText = l.s3.title;
            document.getElementById('s4-lbl').innerText = l.s4.lbl; document.getElementById('s4-title').innerText = l.s4.title;
            document.getElementById('s5-title').innerText = l.s5.title; document.getElementById('s5-sub').innerText = l.s5.sub;
            
            document.getElementById('s6-lbl').innerText = l.s6.lbl; 
            
            document.getElementById('s7-lbl').innerText = l.s7.lbl; 
            document.getElementById('s7-title').innerText = l.s7.title; 
            document.getElementById('s7-sub').innerText = l.s7.sub;
            
            document.getElementById('lbl-fname').innerText = l.s7.lblFname;
            document.getElementById('lbl-email').innerText = l.s7.lblEmail;
            document.getElementById('reg-fname').placeholder = l.s7.placeholders.fname;
            document.getElementById('reg-email').placeholder = l.s7.em; 
            document.getElementById('btn-register').innerText = l.btn.pay;

            document.getElementById('link-imp').innerText = l.legal.imp;
            document.getElementById('link-dat').innerText = l.legal.dat;
            document.getElementById('link-agb').innerText = l.legal.agb;
            document.getElementById('link-cook').innerText = l.legal.cook;
        }

        window.onload = () => { 
            document.getElementById('langSelect').value = currentLang;
            updateTexts(); buildOptions(); pBar.style.width = `${(1 / 6) * 100}%`; 
        };

        function selectLang(lang) { 
            currentLang = lang; localStorage.setItem('smh_language', lang);
            updateTexts(); buildOptions(); if (step === 6) renderResult(); 
        }

        function createOptionBtn(text, isSelected, isMulti, onClick) {
            const div = document.createElement('div'); div.className = `quiz-btn ${isSelected ? 'selected' : ''}`; div.onclick = onClick;
            const textDiv = document.createElement('div'); textDiv.className = 'quiz-btn-text'; textDiv.innerText = text;
            const iconDiv = document.createElement('div'); iconDiv.className = isMulti ? 'check-icon' : 'radio-icon';
            if (isMulti) iconDiv.innerText = '✓';
            div.appendChild(textDiv); div.appendChild(iconDiv); return div;
        }

        function buildOptions() {
            const l = t[currentLang], root = answers.root_problem;
            const build = (id, opts, key, multi) => {
                const el = document.getElementById(id); el.innerHTML = '';
                Object.entries(opts).forEach(([k, v]) => {
                    const isSelected = multi ? answers[key].includes(v) : answers[key] === k;
                    el.appendChild(createOptionBtn(v, isSelected, multi, () => {
                        if(multi) {
                            const idx = answers[key].indexOf(v);
                            if (idx > -1) answers[key].splice(idx, 1); else answers[key].push(v);
                            buildOptions(); checkNextState();
                        } else {
                            answers[key] = k; buildOptions(); checkNextState();
                            setTimeout(() => handleNext(), 350); // Micro-Delay for UX
                        }
                    }));
                });
            };
            build('s1-opts', l.s1.opts, 'root_problem', false);
            build('s2-opts', l.s2.opts[root], 'pain_point', true);
            build('s3-opts', l.s3.opts, 'tolerance', false);
            build('s4-opts', l.s4.opts, 'capacity', false);
        }

        function checkNextState() {
            bNext.disabled = (step === 2 && answers.pain_point.length === 0);
        }

        function renderResult() {
            let score = 75;
            if(answers.tolerance === 'high') score += 12; else if(answers.tolerance === 'med') score += 6;
            if(answers.capacity === 'high') score += 12; else if(answers.capacity === 'med') score += 6;
            
            const res = t[currentLang].s6;
            let lvl, col;
            
            if (score >= 90) { lvl = res.lvls.ext; col = '#cf6666'; }
            else if (score >= 85) { lvl = res.lvls.dan; col = '#cf6666'; }
            else if (score >= 80) { lvl = res.lvls.ala; col = '#d48a60'; }
            else { lvl = res.lvls.cri; col = '#d48a60'; }

            document.getElementById('s6-lbl').innerText = res.lbl;
            document.getElementById('res-score').innerText = lvl.t; 
            document.getElementById('res-score').style.color = col; 
            document.getElementById('res-level').innerText = lvl.d; 
            document.getElementById('res-level').style.color = col;
            document.getElementById('res-card').style.borderColor = col;
            
            document.getElementById('res-cost-lbl').innerText = res.costLbl; 
            document.getElementById('res-cost-lbl').style.color = col;
            document.getElementById('res-info-box').style.borderLeftColor = col; 
            
            document.getElementById('res-cost-val').innerText = res.costVal[answers.root_problem];
            document.getElementById('s6-msg').innerText = res.msg;
        }

        function handleNext() {
            document.getElementById(`step-${step}`).classList.remove('active'); step++;
            pCont.style.display = (step < 7 && step !== 5 && step !== 6) ? 'block' : 'none';
            pBar.style.width = `${((step - 1) / 6) * 100}%`;
            
            bBar.style.display = (step === 2 || step === 6) ? 'flex' : 'none';
            if(step === 6) bNext.innerText = t[currentLang].btn.next;
            checkNextState();
            
            document.getElementById(`step-${step}`).classList.add('active'); window.scrollTo(0,0);
            if(step === 5) setTimeout(() => { handleNext(); renderResult(); }, 2000);
        }

        function handleBack() {
            document.getElementById(`step-${step}`).classList.remove('active');
            step = Math.max(1, step === 6 ? 4 : step - 1);
            document.getElementById(`step-${step}`).classList.add('active');
            pCont.style.display = 'block';
            pBar.style.width = `${((step - 1) / 6) * 100}%`;
            bBar.style.display = (step === 2) ? 'flex' : 'none';
            checkNextState(); window.scrollTo(0,0);
        }

        async function handleRegistration() {
            const fname = document.getElementById('reg-fname').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const errEl = document.getElementById('reg-error');
            const btn = document.getElementById('btn-register'); 
            
            if(!email || !fname) { errEl.innerText = t[currentLang].s7.errFill; errEl.style.display = 'block'; return; }
            errEl.style.display = 'none'; btn.disabled = true; btn.innerText = "...";

            try {
                // Supabase wird erst hier aufgerufen, damit das UI vorher nie blockiert wird
                if (!supabaseClient) {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                }

                const { error } = await supabaseClient.from('leads').insert([
                    { 
                        email: email, 
                        first_name: fname, 
                        source: 'parent_in_peace',
                        marketing_consent: true,
                        onboarding_data: answers 
                    }
                ]);

                if (error) throw error;
                
                const digistoreBaseUrl = digistoreLinks[currentLang] || digistoreLinks['de'];
                window.location.href = `${digistoreBaseUrl}?custom=pip_flow&first_name=${encodeURIComponent(fname)}&email=${encodeURIComponent(email)}`;
            } catch(e) {
                console.error("Fehler beim Speichern:", e);
                errEl.innerText = "Ein Fehler ist aufgetreten. Bitte versuche es noch einmal."; 
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.innerText = t[currentLang].btn.pay;
            }
        }
    </script>
</body>
</html>
