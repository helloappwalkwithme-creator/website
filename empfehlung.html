<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Shift My Horizon – Empfehlung</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --dark:#000; --gray:#111; --gray-active:#1f1a0f; --border:#333;
    --gold:#d4af37; --gold-dim:#c6a233; --text:#fff; --muted:#9a9a9a;
    --success:#4caf50; --wa:#e7ded1;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { background:var(--dark); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.55; }
  img{max-width:100%;}
  .bar{height:4px;background:var(--gold);width:100%;}
  .wrap{max-width:660px;margin:0 auto;padding:0 20px 90px;}
  .lang{display:flex;justify-content:flex-end;padding:14px 0 0;}
  .lang select{background:var(--gray);color:var(--text);border:1px solid var(--border);
    padding:7px 11px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
  /* Partner-Bar */
  .partner{display:flex;align-items:center;gap:12px;background:#101010;border:1px solid #242424;
    border-radius:12px;padding:12px 16px;margin:16px 0 0;}
  .partner .pa{flex:0 0 44px;width:44px;height:44px;border-radius:50%;object-fit:cover;
    background:linear-gradient(135deg,#2a2a2a,#141414);border:2px solid var(--gold);
    display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:800;}
  .partner .pt{font-size:13.5px;color:#cfcfcf;} .partner .pt b{color:#fff;}
  .partner .pt span{color:var(--gold);font-weight:700;}
  section{padding:38px 0;border-top:1px solid #1b1b1b;}
  .hero{border-top:none;padding-top:26px;}
  .eyebrow{color:var(--gold);font-size:12px;font-weight:800;letter-spacing:1.6px;
    text-transform:uppercase;margin-bottom:14px;}
  h1{font-size:31px;line-height:1.15;font-weight:800;margin-bottom:16px;}
  h2{font-size:22px;font-weight:800;margin-bottom:18px;}
  .sub{color:#b7b7b7;font-size:16.5px;margin-bottom:24px;}
  .cta{display:block;width:100%;background:var(--gold);color:#000;border:none;border-radius:12px;
    padding:18px 22px;font-size:17px;font-weight:800;letter-spacing:.3px;cursor:pointer;
    text-align:center;text-decoration:none;transition:background .15s ease,transform .1s ease;}
  .cta:hover{background:var(--gold-dim);transform:translateY(-1px);}
  .cta .small{display:block;font-size:12.5px;font-weight:600;opacity:.75;margin-top:3px;}
  .microtrust{color:#8f8f8f;font-size:12.5px;margin-top:12px;text-align:center;}
  .price{display:inline-flex;align-items:baseline;gap:8px;margin-bottom:18px;}
  .price .amt{font-size:34px;font-weight:900;color:#fff;} .price .cur{font-size:20px;font-weight:800;color:#fff;}
  .price .once{color:var(--muted);font-size:14px;}
  .rating{display:inline-flex;align-items:center;gap:9px;margin-top:16px;padding:8px 13px;
    background:#121212;border:1px solid #2a2a2a;border-radius:999px;}
  .rating .st{color:var(--gold);font-size:15px;letter-spacing:1.5px;} .rating .st .off{color:#3a3a3a;}
  .rating .nm{font-weight:800;font-size:13.5px;}
  /* Video */
  .video{position:relative;border-radius:14px;overflow:hidden;border:1px solid #2a2a2a;
    background:linear-gradient(135deg,#161616,#0c0c0c);aspect-ratio:16/9;display:flex;
    align-items:center;justify-content:center;}
  .video iframe{width:100%;height:100%;border:0;}
  .play{width:66px;height:66px;border-radius:50%;background:var(--gold);display:flex;
    align-items:center;justify-content:center;}
  .play::after{content:'';border-style:solid;border-width:12px 0 12px 20px;
    border-color:transparent transparent transparent #000;margin-left:4px;}
  .vnote{color:#7c7c7c;font-size:12px;text-align:center;margin-top:10px;}
  /* Benefits */
  .benes{display:grid;gap:12px;grid-template-columns:1fr;}
  @media(min-width:560px){.benes{grid-template-columns:1fr 1fr;}}
  .bene{background:#111;border:1px solid #262626;border-radius:12px;padding:16px 18px;}
  .bene .ic{color:var(--gold);font-weight:900;font-size:18px;margin-bottom:8px;}
  .bene b{display:block;margin-bottom:4px;font-size:15px;} .bene p{color:#a5a5a5;font-size:14px;}
  /* Steps */
  .steps{display:grid;gap:14px;}
  .step{display:flex;gap:14px;align-items:flex-start;background:#111;border:1px solid #262626;
    border-radius:12px;padding:16px 18px;}
  .step .n{flex:0 0 34px;width:34px;height:34px;border-radius:50%;background:var(--gray-active);
    border:1px solid var(--gold);color:var(--gold);font-weight:800;display:flex;
    align-items:center;justify-content:center;}
  .step b{display:block;margin:2px 0 4px;font-size:15px;} .step p{color:#a5a5a5;font-size:14px;}
  /* Sample WhatsApp message */
  .demo-label{color:var(--muted);font-size:13px;text-align:center;margin-bottom:14px;}
  .msg{background:var(--wa);color:#111;border-radius:14px;border-top-left-radius:4px;
    padding:16px 18px;max-width:460px;box-shadow:0 2px 10px rgba(0,0,0,.4);}
  .msg .pin{font-weight:800;margin-bottom:10px;} .msg p{font-size:14.5px;margin-bottom:10px;color:#1c1c1c;}
  .msg .h{font-weight:800;color:#111;} .msg .time{color:#5a5a5a;font-size:11px;text-align:right;}
  /* Reviews */
  .reviews{display:grid;gap:14px;}
  .rev{background:#111;border:1px solid #262626;border-radius:12px;padding:18px;}
  .rev .st{color:var(--gold);font-size:17px;letter-spacing:2px;margin-bottom:8px;} .rev .st .off{color:#3a3a3a;}
  .rev .tx{color:#dcdcdc;font-size:14.5px;margin-bottom:10px;} .rev .nm{color:#9c9c9c;font-size:13px;font-weight:600;}
  .rev .vb{color:var(--success);font-size:11px;font-weight:700;margin-left:8px;}
  /* Guarantee */
  .guar{background:#101510;border:1px solid #24401f;border-left:4px solid var(--success);
    border-radius:12px;padding:20px;color:#cfe6cf;font-size:15px;}
  .guar b{color:#fff;}
  /* FAQ */
  .faq div{border-bottom:1px solid #222;padding:16px 0;}
  .faq .q{font-weight:700;font-size:15.5px;margin-bottom:8px;} .faq .a{color:#a8a8a8;font-size:14px;}
  /* price box */
  .pricebox{background:#0f0f0f;border:1px solid #2a2a2a;border-radius:16px;padding:26px 22px;text-align:center;}
  footer{text-align:center;padding:26px 0 0;border-top:1px solid var(--border);margin-top:30px;font-size:11px;}
  footer a{color:#888;text-decoration:none;margin:0 8px;} footer a:hover{color:var(--gold);}
  .demo-banner{background:#2a1f0a;border:1px solid var(--gold);color:#f0d488;font-size:12.5px;
    border-radius:10px;padding:10px 14px;margin-top:14px;text-align:center;}
  ul.clean{list-style:none;padding:0;margin:0;} ul.clean li{position:relative;padding:8px 0 8px 26px;color:#cfcfcf;font-size:15px;}
  ul.clean li::before{content:'✓';position:absolute;left:0;top:8px;color:var(--gold);font-weight:800;}
</style>
</head>
<body>
<div class="bar"></div>
<div class="wrap">
  <div class="lang"><select id="lang" onchange="setLang(this.value)"><option value="de">🇩🇪 DE</option><option value="en">🇺🇸 EN</option></select></div>

  <div class="demo-banner" id="demoBanner" hidden></div>

  <!-- Partner bar -->
  <div class="partner">
    <div class="pa" id="pAvatar">★</div>
    <div class="pt" id="pText"></div>
  </div>

  <!-- Hero -->
  <section class="hero">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="headline"></h1>
    <p class="sub" id="sub"></p>
    <div class="price"><span class="amt" id="priceAmt">49</span><span class="cur">€</span><span class="once" id="priceOnce"></span></div>
    <a class="cta" id="ctaTop" href="#" target="_blank" rel="noopener"></a>
    <div class="microtrust" id="microtrust"></div>
    <div class="rating" id="rating" hidden onclick="document.getElementById('reviewsTitle').scrollIntoView({behavior:'smooth'})"></div>
  </section>

  <!-- Influencer video -->
  <section>
    <h2 id="videoTitle"></h2>
    <div class="video" id="videoBox"><div class="play"></div></div>
    <div class="vnote" id="videoNote"></div>
  </section>

  <!-- What you get -->
  <section>
    <h2 id="whatTitle"></h2>
    <div class="benes" id="benes"></div>
  </section>

  <!-- Content origin -->
  <section>
    <h2 id="originTitle"></h2>
    <p class="sub" id="originText" style="margin-bottom:14px;"></p>
    <ul class="clean" id="originBullets"></ul>
  </section>

  <!-- Sample message -->
  <section>
    <h2 id="demoTitle"></h2>
    <div class="demo-label" id="demoLabel"></div>
    <div style="display:flex;justify-content:center;">
      <div class="msg">
        <div class="pin">📌 <span id="demoHead"></span></div>
        <p id="demoIntro"></p>
        <p><span class="h">🎯 <span id="demoTaskLbl"></span></span><br><span id="demoTask"></span></p>
        <p><span class="h">💡 <span id="demoWhyLbl"></span></span><br><span id="demoWhy"></span></p>
        <div class="time">06:02 ✓✓</div>
      </div>
    </div>
  </section>

  <!-- How it works -->
  <section>
    <h2 id="howTitle"></h2>
    <div class="steps" id="steps"></div>
  </section>

  <!-- Reviews -->
  <section>
    <h2 id="reviewsTitle"></h2>
    <div class="reviews" id="reviews"></div>
  </section>

  <!-- Guarantee -->
  <section>
    <h2 id="guarTitle"></h2>
    <div class="guar" id="guarText"></div>
  </section>

  <!-- Price box + CTA -->
  <section>
    <div class="pricebox">
      <div class="eyebrow" style="margin-bottom:10px;" id="finalKicker"></div>
      <div class="price" style="justify-content:center;"><span class="amt">49</span><span class="cur">€</span><span class="once" id="priceOnce2"></span></div>
      <a class="cta" id="ctaBottom" href="#" target="_blank" rel="noopener" style="max-width:420px;margin:8px auto 0;"></a>
      <div class="microtrust" id="microtrust2"></div>
    </div>
  </section>

  <!-- FAQ -->
  <section>
    <h2 id="faqTitle"></h2>
    <div class="faq" id="faq"></div>
  </section>

  <footer>
    <a href="impressum.html">Impressum</a><a href="datenschutz.html">Datenschutz</a><a href="agb.html">AGB</a>
  </footer>
</div>

<script>
  const SUPABASE_URL = 'https://jztwnumtwihomgxwlwor.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_yWcwDruITLbaok1rBl4Fiw_Ddjn9xZe';
  let sb = null;

  // ===== Influencer-Registry (spaeter Supabase-Tabelle 'influencers') =====
  // buyUrl = persoenlicher Digistore-Affiliate-Link des Influencers (Provision automatisch getrackt)
  // video  = YouTube/Vimeo Embed-URL ODER null (dann Platzhalter)
  const INFLUENCERS = {
    demo: {
      name: "Max Beispiel",
      handle: "@max.beispiel",
      video: null,
      buyUrl: "https://www.digistore24.com/product/688460" // Platzhalter: Integrated Man DE
    }
  };

  const params = new URLSearchParams(location.search);
  const infSlug = (params.get('inf') || '').trim();
  const inf = INFLUENCERS[infSlug] || null;
  let flow = (params.get('p') || 'gettinggirls').trim();
  let lang = (params.get('lang') || 'de').toLowerCase(); if(!['de','en'].includes(lang)) lang='de';

  const FLOWS = {
    de: {
      gettinggirls: { eyebrow:"FÜR MÄNNER, DIE NICHT MEHR ZÖGERN WOLLEN",
        headline:"Sprich sie an — ohne dass dein Kopf blockiert.",
        sub:"Der 90-Tage-Weg, der deine Blockade Schritt für Schritt abbaut. Jeden Tag ein konkreter Impuls direkt in deinen Messenger — in unter 5 Minuten." },
      porn: { eyebrow:"FÜR MÄNNER, DIE IHRE KONTROLLE ZURÜCKWOLLEN",
        headline:"Raus aus dem Drang — in 90 Tagen.",
        sub:"Ein trainierbarer Reset für dein Belohnungssystem. Jeden Tag ein machbarer Schritt direkt in deinen Messenger — in unter 5 Minuten." },
      relationship: { eyebrow:"FÜR MÄNNER, DIE IHRE BEZIEHUNG RETTEN WOLLEN",
        headline:"Führung & Nähe zurück — in 90 Tagen.",
        sub:"Der tägliche Weg, der Anziehung und Respekt neu aufbaut. Ein konkreter Schritt pro Tag direkt in deinen Messenger — in unter 5 Minuten." },
      default: { eyebrow:"FÜR MÄNNER, DIE WIEDER FÜHREN WOLLEN",
        headline:"Werde der Mann, der du sein willst — in 90 Tagen.",
        sub:"Ein klarer, täglicher Weg direkt in deinen Messenger. Ein konkreter Schritt pro Tag, in unter 5 Minuten." }
    }
  };
  FLOWS.en = FLOWS.de; // EN-Fallback bis Uebersetzung

  const T = {
    de: {
      recommendedBy: (n,h)=> `<b>Empfohlen von</b> <span>${n}</span>${h?` · ${h}`:''}`,
      priceOnce:"einmalig · kein Abo", cta:"Jetzt starten", ctaSmall:"Sicherer Checkout über Digistore24",
      microtrust:"Einmalig 49 € · 60 Tage Geld-zurück-Garantie · sofortiger Start",
      videoTitle: (n)=> `Warum ${n} das empfiehlt`, videoNote:"Video wird in Kürze eingefügt.",
      whatTitle:"Was du bekommst",
      benes:[
        {i:"90",b:"90 Tage Begleitung",p:"Jeden Tag ein Impuls — kein Kurs zum Wegklicken, sondern echte Umsetzung."},
        {i:"5",b:"Unter 5 Min pro Tag",p:"Kompakt und alltagstauglich. Kein Zeitfresser."},
        {i:"✓",b:"Konkrete Aufgaben",p:"Kein Theorie-Bla — jeden Tag ein klarer nächster Schritt."},
        {i:"↺",b:"Per WhatsApp oder Telegram",p:"Direkt dort, wo du eh bist. Keine App, kein Login."}
      ],
      originTitle:"Woher der Inhalt kommt",
      originText:"Nicht zusammengegoogelt: Jeder Tag basiert auf den Erkenntnissen aus über 10 Fachbüchern zu Psychologie, Verhalten und Beziehungen — heruntergebrochen in tägliche Mini-Aufgaben, die du wirklich umsetzt.",
      originBullets:["Fundiertes Wissen statt Motivations-Sprüche","Kein 300-Seiten-Wälzer — das Wesentliche in 5 Min pro Tag","Umsetzung vor Theorie: jeden Tag ein konkreter Schritt","Über 90 Tage sinnvoll aufeinander aufgebaut"],
      demoTitle:"So sieht dein Tag aus", demoLabel:"Beispiel-Nachricht aus dem Programm",
      demoHead:"Verletzlichkeit als Stärke",
      demoIntro:"Wahre Stärke bedeutet, das Risiko einzugehen, abgelehnt zu werden.",
      demoTaskLbl:"Deine Aufgabe für heute:",
      demoTask:"Teile heute einem Freund oder Bekannten eine persönliche Unsicherheit mit, die du normalerweise versteckst.",
      demoWhyLbl:"Warum das wirkt:",
      demoWhy:"Ehrliche Verletzlichkeit schafft paradoxerweise Vertrauen und tiefe Anziehung.",
      howTitle:"So funktioniert's",
      steps:[
        {b:"1. Kaufen",p:"Einmalig 49 € über den sicheren Digistore-Checkout."},
        {b:"2. Messenger verbinden",p:"Du bekommst einen Zugangscode und startest ihn per WhatsApp oder Telegram."},
        {b:"3. Täglich dein Schritt",p:"Ab morgen früh bekommst du 90 Tage lang jeden Tag deinen Impuls."}
      ],
      reviewsTitle:"Das sagen andere", reviewsEmpty:"Bald findest du hier echte Stimmen von Teilnehmern.",
      guarTitle:"Dein Risiko: null",
      guarText:"<b>60 Tage Geld-zurück-Garantie.</b> Wenn es dir in den ersten 60 Tagen nichts bringt, schreib uns eine Mail — du bekommst dein Geld zurück. Ohne Diskussion.",
      finalKicker:"Bereit anzufangen?",
      faqTitle:"Häufige Fragen",
      faq:[
        {q:"Was genau bekomme ich?",a:"90 Tage lang jeden Tag einen konkreten Impuls mit einer kleinen Aufgabe — direkt per WhatsApp oder Telegram."},
        {q:"Wie viel Zeit brauche ich?",a:"Unter 5 Minuten am Tag. Bewusst so gebaut, dass es in jeden Alltag passt."},
        {q:"Gibt es ein Abo?",a:"Nein. Einmalig 49 €, danach kommt nichts mehr automatisch."},
        {q:"Was, wenn's mir nicht hilft?",a:"60 Tage Geld-zurück-Garantie — du gehst kein Risiko ein."},
        {q:"Wie schnell geht's los?",a:"Direkt nach dem Kauf verbindest du deinen Messenger, am nächsten Morgen startet Tag 1."}
      ]
    }
  };
  T.en = T.de;

  function stars(r){var f=Math.floor(r),h=(r-f)>=0.5,o='';for(var i=1;i<=5;i++){o+= i<=f?'★':(i===f+1&&h?'⯪':'<span class="off">★</span>');}return o;}

  function render(){
    var t=T[lang], fl=(FLOWS[lang][flow]||FLOWS[lang].default);
    document.getElementById('lang').value=lang;
    // partner
    var name = inf ? inf.name : "unserem Partner";
    document.getElementById('pAvatar').innerText = inf ? inf.name.charAt(0) : "★";
    document.getElementById('pText').innerHTML = t.recommendedBy(name, inf?inf.handle:"");
    // hero
    document.getElementById('eyebrow').innerText=fl.eyebrow;
    document.getElementById('headline').innerText=fl.headline;
    document.getElementById('sub').innerText=fl.sub;
    document.getElementById('priceOnce').innerText=t.priceOnce;
    document.getElementById('priceOnce2').innerText=t.priceOnce;
    var buy = inf ? inf.buyUrl : "#";
    document.getElementById('ctaTop').innerHTML = t.cta+' – 49 €<span class="small">'+t.ctaSmall+'</span>';
    document.getElementById('ctaTop').href = buy;
    document.getElementById('ctaBottom').innerHTML = t.cta+' – 49 €<span class="small">'+t.ctaSmall+'</span>';
    document.getElementById('ctaBottom').href = buy;
    document.getElementById('microtrust').innerText=t.microtrust;
    document.getElementById('microtrust2').innerText=t.microtrust;
    document.getElementById('finalKicker').innerText=t.finalKicker;
    // video
    document.getElementById('videoTitle').innerText=t.videoTitle(name);
    var vb=document.getElementById('videoBox');
    if(inf && inf.video){ vb.innerHTML='<iframe src="'+inf.video+'" allowfullscreen></iframe>'; document.getElementById('videoNote').innerText=''; }
    else { vb.innerHTML='<div class="play"></div>'; document.getElementById('videoNote').innerText=t.videoNote; }
    // what
    document.getElementById('whatTitle').innerText=t.whatTitle;
    document.getElementById('benes').innerHTML=t.benes.map(function(b){return '<div class="bene"><div class="ic">'+b.i+'</div><b>'+b.b+'</b><p>'+b.p+'</p></div>';}).join('');
    // content origin
    document.getElementById('originTitle').innerText=t.originTitle;
    document.getElementById('originText').innerText=t.originText;
    document.getElementById('originBullets').innerHTML=t.originBullets.map(function(b){return '<li>'+b+'</li>';}).join('');
    // demo
    document.getElementById('demoTitle').innerText=t.demoTitle;
    document.getElementById('demoLabel').innerText=t.demoLabel;
    document.getElementById('demoHead').innerText=t.demoHead;
    document.getElementById('demoIntro').innerText=t.demoIntro;
    document.getElementById('demoTaskLbl').innerText=t.demoTaskLbl;
    document.getElementById('demoTask').innerText=t.demoTask;
    document.getElementById('demoWhyLbl').innerText=t.demoWhyLbl;
    document.getElementById('demoWhy').innerText=t.demoWhy;
    // how
    document.getElementById('howTitle').innerText=t.howTitle;
    document.getElementById('steps').innerHTML=t.steps.map(function(s){return '<div class="step"><div class="n">'+s.b.charAt(0)+'</div><div><b>'+s.b+'</b><p>'+s.p+'</p></div></div>';}).join('');
    // reviews title / guarantee / faq
    document.getElementById('reviewsTitle').innerText=t.reviewsTitle;
    document.getElementById('guarTitle').innerText=t.guarTitle;
    document.getElementById('guarText').innerHTML=t.guarText;
    document.getElementById('faqTitle').innerText=t.faqTitle;
    document.getElementById('faq').innerHTML=t.faq.map(function(x){return '<div><div class="q">'+x.q+'</div><div class="a">'+x.a+'</div></div>';}).join('');
    // demo banner if no influencer
    var db=document.getElementById('demoBanner');
    if(!inf){ db.hidden=false; db.innerText = lang==='en' ? "Preview mode — add ?inf=<slug> to load a real partner (name, video, buy link)." : "Vorschau-Modus — mit ?inf=<slug> wird ein echter Partner geladen (Name, Video, Kauf-Link)."; }
    else db.hidden=true;
    loadReviews();
  }

  function renderReviews(rows){
    var box=document.getElementById('reviews'), t=T[lang];
    if(!rows||!rows.length){ box.innerHTML='<p class="sub" style="margin:0;">'+t.reviewsEmpty+'</p>'; return; }
    box.innerHTML=rows.map(function(r){
      var vb=r.verified_purchase?'<span class="vb">✓ Verifiziert</span>':'';
      var c=(r.comment||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      var n=(r.first_name||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return '<div class="rev"><div class="st">'+stars(Number(r.rating))+'</div><div class="tx">„'+c+'"</div><div class="nm">'+n+vb+'</div></div>';
    }).join('');
  }
  function renderRating(rows){
    var el=document.getElementById('rating');
    if(!rows||!rows.length){el.hidden=true;return;}
    var avg=rows.reduce(function(a,r){return a+Number(r.rating||0);},0)/rows.length;
    var s=(lang==='en')?avg.toFixed(1):avg.toFixed(1).replace('.',',');
    el.innerHTML='<span class="st">'+stars(avg)+'</span><span class="nm">'+s+' / 5</span>';
    el.hidden=false;
  }
  async function loadReviews(){
    try{
      if(!sb) sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
      var res=await sb.from('v_reviews_public').select('first_name,comment,rating,verified_purchase,topic,created_at');
      var all=(res&&res.data)?res.data:[];
      renderRating(all);
      var rows=all.filter(function(r){return r.topic===flow;});
      renderReviews(rows.slice(0,6));
    }catch(e){console.warn(e);renderRating([]);renderReviews([]);}
  }
  function setLang(l){lang=l;render();}
  render();
</script>
</body>
</html>
