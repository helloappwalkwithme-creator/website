<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Shift My Horizon – Empfehlung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#0c0b0a; --panel:#16130f; --panel-2:#1c1811; --raised:#221d14;
    --line:#2a251c; --line-soft:#201c15;
    --brass:#c8a86a; --brass-bright:#e6cd94; --brass-dim:#8f7c53;
    --text:#ece7df; --muted:#a79f90; --muted-2:#7c7568;
    --success:#7cb87f; --success-bg:#11170f; --success-line:#2c3f25;
    --paper:#e4ddcf;
    --serif:"Fraunces",Georgia,"Times New Roman",serif;
    --sans:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--ink);color:var(--text);font-family:var(--sans);
    line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  img{max-width:100%;display:block;}
  ::selection{background:var(--brass);color:#0c0b0a;}

  /* atmospheric top glow */
  .glow{position:absolute;top:0;left:0;right:0;height:520px;pointer-events:none;z-index:0;
    background:radial-gradient(120% 100% at 50% -10%,rgba(200,168,106,.16),rgba(200,168,106,0) 60%);}
  .bar{position:relative;z-index:2;height:3px;
    background:linear-gradient(90deg,var(--brass-dim),var(--brass),var(--brass-bright),var(--brass));}
  .wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 22px 96px;}

  .topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 0 0;}
  .brandmark{font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.3px;color:var(--text);}
  .brandmark span{color:var(--brass);}
  .lang select{background:var(--panel);color:var(--text);border:1px solid var(--line);
    padding:7px 11px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans);}

  .preview-note{background:#1c1608;border:1px solid var(--brass-dim);color:var(--brass-bright);
    font-size:12.5px;border-radius:10px;padding:10px 14px;margin-top:14px;text-align:center;}

  /* section rhythm */
  section{position:relative;padding:40px 0;}
  section+section{border-top:1px solid var(--line-soft);}
  .eyebrow{display:inline-block;color:var(--brass);font-size:11.5px;font-weight:700;
    letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;}
  h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,7.4vw,44px);line-height:1.08;
    letter-spacing:-.5px;text-wrap:balance;margin-bottom:18px;}
  h2{font-family:var(--serif);font-weight:600;font-size:clamp(22px,5vw,27px);line-height:1.15;
    letter-spacing:-.3px;text-wrap:balance;margin-bottom:8px;}
  .lead{color:var(--muted);font-size:17px;line-height:1.62;margin-bottom:26px;max-width:60ch;}

  /* partner strip */
  .partner{display:flex;align-items:center;gap:13px;background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-top:22px;}
  .avatar{flex:0 0 46px;width:46px;height:46px;border-radius:50%;object-fit:cover;
    background:radial-gradient(circle at 30% 25%,#2c2519,#141009);border:1.5px solid var(--brass);
    display:flex;align-items:center;justify-content:center;color:var(--brass-bright);
    font-family:var(--serif);font-weight:600;font-size:19px;}
  .partner .pt{font-size:14px;color:var(--muted);line-height:1.4;}
  .partner .pt .r{display:block;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--brass);font-weight:700;margin-bottom:2px;}
  .partner .pt b{color:var(--text);font-weight:700;font-size:15px;}
  .partner .pt em{font-style:normal;color:var(--muted-2);}

  /* price + cta */
  .price{display:flex;align-items:baseline;gap:9px;margin:26px 0 20px;font-variant-numeric:tabular-nums;}
  .price .amt{font-family:var(--serif);font-weight:600;font-size:46px;line-height:1;color:var(--text);}
  .price .cur{font-family:var(--serif);font-size:24px;font-weight:500;color:var(--text);}
  .price .once{color:var(--muted-2);font-size:14px;align-self:center;}
  .cta{display:block;width:100%;background:linear-gradient(180deg,var(--brass-bright),var(--brass));
    color:#160f02;border:none;border-radius:13px;padding:17px 22px;font-family:var(--sans);
    font-size:16.5px;font-weight:800;letter-spacing:.2px;cursor:pointer;text-align:center;
    text-decoration:none;box-shadow:0 10px 30px -12px rgba(200,168,106,.55);
    transition:transform .12s ease,box-shadow .12s ease,filter .12s ease;}
  .cta:hover{transform:translateY(-2px);filter:brightness(1.04);box-shadow:0 16px 38px -12px rgba(200,168,106,.6);}
  .cta:focus-visible{outline:2px solid var(--brass-bright);outline-offset:3px;}
  .cta .small{display:block;font-size:12px;font-weight:600;opacity:.72;margin-top:4px;letter-spacing:.2px;}
  .microtrust{color:var(--muted-2);font-size:12.5px;margin-top:13px;text-align:center;}
  .rating{display:inline-flex;align-items:center;gap:9px;margin-top:18px;padding:8px 14px;
    background:var(--panel);border:1px solid var(--line);border-radius:999px;cursor:pointer;}
  .stars{color:var(--brass);font-size:14px;letter-spacing:2px;} .stars .off{color:#3a342a;}
  .rating .nm{font-weight:700;font-size:13px;color:var(--text);}

  /* recommendation block (video OR quote) */
  .videoframe{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);
    background:#000;aspect-ratio:16/9;}
  .videoframe iframe{width:100%;height:100%;border:0;display:block;}
  .quotecard{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);
    border-radius:16px;padding:26px 26px 22px;position:relative;overflow:hidden;}
  .quotecard::before{content:"\201C";position:absolute;top:-18px;left:16px;font-family:var(--serif);
    font-size:120px;line-height:1;color:rgba(200,168,106,.14);}
  .quotecard .qt{font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.45;
    color:var(--text);position:relative;letter-spacing:-.2px;}
  .quotecard .who{display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line-soft);}
  .quotecard .who b{color:var(--text);font-weight:700;font-size:14.5px;}
  .quotecard .who em{font-style:normal;color:var(--muted-2);font-size:13px;display:block;}

  /* benefits */
  .benes{display:grid;gap:13px;grid-template-columns:1fr;}
  @media(min-width:560px){.benes{grid-template-columns:1fr 1fr;}}
  .bene{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:20px;}
  .bene .ic{width:26px;height:26px;color:var(--brass);margin-bottom:12px;}
  .bene .ic svg{width:26px;height:26px;display:block;}
  .bene b{display:block;margin-bottom:5px;font-size:15.5px;font-weight:700;color:var(--text);}
  .bene p{color:var(--muted);font-size:14px;}

  /* origin */
  .clean{list-style:none;display:grid;gap:11px;margin-top:18px;}
  .clean li{position:relative;padding-left:30px;color:var(--text);font-size:15px;}
  .clean li::before{content:"";position:absolute;left:0;top:7px;width:17px;height:11px;
    border-left:2px solid var(--brass);border-bottom:2px solid var(--brass);transform:rotate(-45deg);border-radius:1px;}

  /* whatsapp phone mockup */
  .phone{max-width:340px;margin:0 auto;background:#0f0d0a;border:1px solid var(--line);
    border-radius:30px;padding:12px 12px 18px;box-shadow:0 30px 60px -30px rgba(0,0,0,.9);}
  .phone .notch{width:110px;height:5px;border-radius:99px;background:#2a251c;margin:2px auto 12px;}
  .chatwin{background:
    linear-gradient(rgba(10,8,6,.86),rgba(10,8,6,.86));
    background-color:#0b0906;border-radius:20px;padding:16px 12px;}
  .chathdr{display:flex;align-items:center;gap:10px;padding:0 4px 14px;border-bottom:1px solid #17130d;margin-bottom:14px;}
  .chathdr .a{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#2c2519,#141009);
    border:1px solid var(--brass-dim);display:flex;align-items:center;justify-content:center;color:var(--brass);font-family:var(--serif);font-size:15px;font-weight:600;}
  .chathdr .nm{font-size:13.5px;font-weight:700;color:var(--text);} .chathdr .st{font-size:11px;color:var(--success);}
  .bubble{background:var(--paper);color:#181510;border-radius:14px;border-top-left-radius:5px;
    padding:14px 15px;box-shadow:0 2px 8px rgba(0,0,0,.35);}
  .bubble .pin{font-weight:800;margin-bottom:10px;font-size:14.5px;color:#181510;}
  .bubble p{font-size:14px;margin-bottom:11px;color:#2a251d;line-height:1.5;}
  .bubble p:last-of-type{margin-bottom:6px;}
  .bubble .h{font-weight:800;color:#181510;}
  .bubble .time{color:#8a8071;font-size:10.5px;text-align:right;}
  .demo-cap{color:var(--muted-2);font-size:12.5px;text-align:center;margin-top:14px;}

  /* steps */
  .steps{display:grid;gap:13px;margin-top:6px;}
  .step{display:flex;gap:15px;align-items:flex-start;background:var(--panel);border:1px solid var(--line-soft);
    border-radius:14px;padding:18px 20px;}
  .step .n{flex:0 0 34px;width:34px;height:34px;border-radius:50%;background:var(--raised);
    border:1px solid var(--brass-dim);color:var(--brass-bright);font-family:var(--serif);font-weight:600;
    font-size:16px;display:flex;align-items:center;justify-content:center;}
  .step b{display:block;margin:3px 0 4px;font-size:15.5px;font-weight:700;color:var(--text);}
  .step p{color:var(--muted);font-size:14px;}

  /* reviews */
  .reviews{display:grid;gap:14px;margin-top:6px;}
  .rev{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:20px;}
  .rev .stars{font-size:15px;margin-bottom:10px;display:block;}
  .rev .tx{color:var(--text);font-size:15px;line-height:1.55;margin-bottom:12px;}
  .rev .nm{color:var(--muted-2);font-size:13px;font-weight:600;}
  .rev .vb{color:var(--success);font-size:11px;font-weight:700;margin-left:8px;}

  /* guarantee */
  .guar{display:flex;gap:16px;align-items:flex-start;background:var(--success-bg);
    border:1px solid var(--success-line);border-radius:14px;padding:22px;}
  .guar .shield{flex:0 0 34px;width:34px;height:34px;color:var(--success);}
  .guar .gt{color:#cfe6cf;font-size:15px;line-height:1.55;} .guar .gt b{color:#fff;}

  /* final price box */
  .pricebox{background:linear-gradient(180deg,var(--panel-2),var(--ink));border:1px solid var(--line);
    border-radius:20px;padding:32px 24px;text-align:center;}
  .pricebox .price{justify-content:center;margin:6px 0 18px;}
  .pricebox .cta{max-width:430px;margin:0 auto;}

  /* faq */
  .faq details{border-bottom:1px solid var(--line-soft);}
  .faq summary{list-style:none;cursor:pointer;padding:17px 34px 17px 0;font-weight:600;
    font-size:15.5px;color:var(--text);position:relative;}
  .faq summary::-webkit-details-marker{display:none;}
  .faq summary::after{content:"+";position:absolute;right:4px;top:15px;color:var(--brass);
    font-size:20px;font-weight:400;transition:transform .2s ease;}
  .faq details[open] summary::after{transform:rotate(45deg);}
  .faq .a{color:var(--muted);font-size:14.5px;padding:0 0 18px;max-width:62ch;}

  footer{text-align:center;padding:30px 0 0;margin-top:26px;border-top:1px solid var(--line-soft);font-size:11.5px;}
  footer a{color:var(--muted-2);text-decoration:none;margin:0 9px;} footer a:hover{color:var(--brass);}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}

  /* secondary "direkt kaufen" link under the check-CTA */
  .buylink{color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;}
  .buylink:hover{color:var(--brass-bright);}

  /* ===== 2-Minuten-Check (Test-Overlay) ===== */
  #quiz{position:fixed;inset:0;z-index:60;background:var(--ink);overflow-y:auto;}
  #quiz .qz-inner{max-width:600px;margin:0 auto;padding:18px 22px 70px;min-height:100%;}
  .qz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0 14px;}
  .qz-partner{font-size:12.5px;color:var(--muted);} .qz-partner b{color:var(--text);font-weight:700;}
  .qz-close{background:none;border:1px solid var(--line);color:var(--muted);width:34px;height:34px;
    border-radius:9px;font-size:20px;line-height:1;cursor:pointer;flex:0 0 auto;}
  .qz-close:hover{color:var(--text);border-color:var(--brass-dim);}
  .qz-progress{height:4px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-bottom:30px;}
  .qz-bar{height:100%;width:6%;background:linear-gradient(90deg,var(--brass),var(--brass-bright));transition:width .35s ease;}
  .qz-lbl{color:var(--brass);font-size:11.5px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:13px;}
  .qz-q{font-family:var(--serif);font-weight:600;font-size:clamp(23px,5.6vw,30px);line-height:1.16;letter-spacing:-.3px;margin-bottom:24px;text-wrap:balance;}
  .qz-opts{display:grid;gap:12px;}
  .qz-opt{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:17px 18px;cursor:pointer;text-align:left;font-family:var(--sans);
    font-size:15.5px;font-weight:500;color:var(--text);width:100%;transition:border-color .15s,background .15s;}
  .qz-opt:hover{border-color:var(--brass-dim);}
  .qz-opt.sel{border-color:var(--brass);background:var(--raised);}
  .qz-opt .rad{flex:0 0 22px;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);position:relative;}
  .qz-opt.sel .rad{border-color:var(--brass);}
  .qz-opt.sel .rad::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--brass);}
  .qz-analyse{text-align:center;padding:56px 0;}
  .qz-spinner{width:44px;height:44px;border:3px solid var(--line);border-top-color:var(--brass);
    border-radius:50%;margin:0 auto 22px;animation:qzspin 1s linear infinite;}
  @keyframes qzspin{to{transform:rotate(360deg);}}
  .qz-result .price{margin:24px 0 18px;}
</style>
</head>
