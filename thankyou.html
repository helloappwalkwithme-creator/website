                var fb = document.getElementById('optin-feedback');
                if (!wantCoaching && !wantSeminar) { return; }
                btn.disabled = true;
                sb.rpc('register_free_offer_interest', { p_email: email, p_coaching: wantCoaching, p_seminar: wantSeminar, p_product_id: productId || null, p_language: lang }).then(function (res) {
                    fb.style.display = 'block';
                    if (res && !res.error && res.data && res.data.success) {
                        fb.style.color = 'var(--success)'; fb.innerText = o.success;
                        document.getElementById('optin-coaching').disabled = true;
                        document.getElementById('optin-seminar').disabled = true;
                        btn.style.display = 'none';
                    } else { fb.style.color = '#e57373'; fb.innerText = o.error; btn.disabled = false; }
                }).catch(function () { fb.style.display = 'block'; fb.style.color = '#e57373'; fb.innerText = o.error; btn.disabled = false; });
            });
        })();
    </script>
</body>
</html>
