        :root {

            margin: 0;

            color: var(--text);

            line-height: 1.6;

        .app-header { 
            width: 100%;

            margin: 0 auto; 
            display: flex; 
            justify-content: flex-end; 
            padding: 20px 20px 0 20px; 
        }
        
        .lang-switcher { 
            background-color: var(--gray); 
            color: var(--text); 
            border: 1px solid var(--border); 
            padding: 8px 12px; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: 600; 
            cursor: pointer; 
            outline: none; 
            appearance: none; 
            text-align: center; 
        }
        .lang-switcher:focus { border-color: var(--gold); }

        main { 
            flex: 1; 
            padding: 40px 20px 100px 20px; 
            max-width: 600px; 
            margin: 0 auto; 
            width: 100%; 
        }

        .h1-title { font-size: 32px; font-weight: 800; margin-top: 0; margin-bottom: 20px; color: var(--text); line-height: 1.2; text-align: center; }
        
        .hero-box {
            background-color: var(--highlight);
            border: 1px solid var(--border);
            border-left: 4px solid var(--gold);
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 32px;
        }

        .hero-text { font-size: 16px; color: #e0e0e0; margin: 0; }

        .feature-list { list-style: none; padding: 0; margin: 0 0 40px 0; }
        .feature-item { 
            display: flex; 
            align-items: flex-start; 
            margin-bottom: 16px; 
            background: var(--gray);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .check-icon { color: var(--gold); font-weight: bold; margin-right: 12px; font-size: 18px; }
        .feature-text { font-size: 15px; color: #ccc; margin: 0; }
        .feature-title { color: #fff; font-weight: 700; display: block; margin-bottom: 4px; }

        .btn-gold { 
            background-color: var(--gold); 
            color: var(--dark); 
            padding: 18px;

            font-weight: 800; 
            font-size: 16px;

            border: none;

                    feat1Title: "Jeden Morgen eine Nachricht",

                    feat2Title: "Es läuft weiter, wo du bist",

            en: {

                    flowTitle: "4 DAYS DONE. IT CARRIES ON TOMORROW.",
                    headline: "Keep going, <span id='user-name' style='color: var(--gold);'></span>.",
                    hero: "You have four mornings behind you. From day 5 it keeps going if you have the subscription: one message every morning, one thought and one small step for that day. $19 a month, cancel anytime.",

            },
            es: {

                    flowTitle: "4 DÍAS HECHOS. MAÑANA SIGUE.",
                    headline: "Sigue, <span id='user-name' style='color: var(--gold);'></span>.",
                    hero: "Llevas cuatro mañanas. A partir del día 5 sigue si tienes la suscripción: cada mañana un mensaje, una idea y un paso pequeño para ese día. 19 € al mes, cancelas cuando quieras.",
                    feat1Title: "Un mensaje cada mañana",
                    feat1Text: "Una idea y un paso pequeño, por WhatsApp o Telegram. Tarda un minuto.",
                    feat2Title: "Sigue donde lo dejaste",
                    feat2Text: "Tu cuenta de días simplemente continúa. No empiezas de cero.",
                    feat3Title: "Puedes parar cuando quieras",
                    feat3Text: "Escribe STOP en el chat o cancela en Digistore24. No hay más cobros.",
                    btn: "Contratar la suscripción",
                    btnAus: "Ahora mismo no está disponible",
                    guarantee: "Pago por Digistore24. Cancelación mensual. 100 por ciento digital, entrega diaria por WhatsApp o Telegram, sin envío físico.",

                }
            }
        };

        // Welcher Flow auf welches Digistore-Produkt zeigt, je Sprache.
        // Gepflegt in 07-TECHNIK/influencer-seiten-generator/produkte.json.
        // islam_flow und buddhism_flow fehlen hier mit Absicht: dafuer gibt es
        // kein Produkt. Der Knopf bleibt dann aus und der Hinweis steht da.
        const FLOW_PRODUKT = {
                  "main_character_flow": {
                            "de": "688575",
                            "en": "688595",
                            "es": "688596"
                  },
                  "high_value_dating_flow": {
                            "de": "688575",
                            "en": "688595",
                            "es": "688596"
                  },
                  "heartbreak_flow": {
                            "de": "688575",

                  "porn_recovery_flow": {

                  },
                  "gettinggirls_flow": {

                  },
                  "mens_relationship_flow": {

                  },
                  "fairplay_flow": {

                  },
                  "parenting_loop_flow": {
                            "de": "688578",
                            "en": "688672",

                  },
                  "parental_burnout_flow": {
                            "de": "688578",
                            "en": "688672",

                  },
                  "career_flow": {
                            "de": "688580",
                            "en": "688677",
                            "es": "688680"
                  },
                  "sales_flow": {
                            "de": "688583",
                            "en": "688688",
                            "es": "688693"
                  },
                  "leichtigkeit_flow": {
                            "de": "719920",
                            "en": "719919",
                            "es": "719921"
                  },
                  "secular_flow": {
                            "de": "688579",

                  },
                  "bible_flow": {
                            "de": "759094",

                  },
                  "islam_flow": {
                            "de": "759094",

                  },
                  "buddhism_flow": {
                            "de": "759094",
                            "en": "759095",
                            "es": "759096"
                  }
        };

        const urlParams = new URLSearchParams(window.location.search);
        let fname = urlParams.get('fname') || '';
        let leadId = urlParams.get('id') || '';
        let flowName = (urlParams.get('flow') || '').trim();

        let currentLang = localStorage.getItem('smh_language') || urlParams.get('lang') || 'de';
        if (!t[currentLang]) currentLang = 'de';

        // pid aus alten Nachrichten gilt weiter, sonst kommt die ID aus dem Flow.
        function produktId() {
            const alt = (urlParams.get('pid') || '').trim();
            if (/^[0-9]+$/.test(alt)) return alt;
            const eintrag = FLOW_PRODUKT[flowName];
            if (eintrag && /^[0-9]+$/.test(String(eintrag[currentLang] || ''))) return String(eintrag[currentLang]);
            return '';
        }

        function updateTexts() {
            const content = t[currentLang].ui;
            const pid = produktId();
            document.documentElement.lang = currentLang;
            document.title = content.pageTitle;
            document.getElementById('langSelect').value = currentLang;

            document.getElementById('ui-flow-title').innerText = content.flowTitle;
            document.getElementById('dynamic-headline').innerHTML = content.headline;

            if (fname && fname.trim() !== '') {
                document.getElementById('user-name').innerText = decodeURIComponent(fname);
            }

            document.getElementById('dynamic-hero').innerText = content.hero;
            document.getElementById('feat-1-title').innerText = content.feat1Title;
            document.getElementById('feat-1-text').innerText = content.feat1Text;
            document.getElementById('ui-feat-2-title').innerText = content.feat2Title;
            document.getElementById('ui-feat-2-text').innerText = content.feat2Text;
            document.getElementById('ui-feat-3-title').innerText = content.feat3Title;
            document.getElementById('ui-feat-3-text').innerText = content.feat3Text;

            const knopf = document.getElementById('checkout-btn');
            const offen = VERKAUF_AN && !!pid;
            knopf.innerText = offen ? content.btn : content.btnAus;
            knopf.style.opacity = offen ? '1' : '0.72';
            knopf.style.cursor = offen ? 'pointer' : 'default';
            document.getElementById('ui-guarantee').innerText = offen
                ? content.guarantee
                : (VERKAUF_AN ? content.fehlt : '');

            document.getElementById('link-imp').innerText = content.legal.imp;
            document.getElementById('link-dat').innerText = content.legal.dat;
            document.getElementById('link-agb').innerText = content.legal.agb;
        }

        function selectLang(lang) {
            currentLang = lang;
            localStorage.setItem('smh_language', lang);
            updateTexts();
        }

        window.onload = () => {
            updateTexts();
        };

        // Ein Schalter. false stellt den Kauf hier wieder ab.
        var VERKAUF_AN = true;

        function goToCheckout(e) {
            e.preventDefault();
            if (!VERKAUF_AN) return;
            const pid = produktId();
            if (!pid) return;

            const aff = (urlParams.get('aff') || '').toLowerCase().replace(/[^a-z0-9_-]/g, '');
            let finalUrl = aff
                ? "https://www.digistore24.com/redir/" + encodeURIComponent(pid) + "/" + aff + "/"
                : "https://www.checkout-ds24.com/product/" + encodeURIComponent(pid);

            if (leadId) {
                finalUrl += (finalUrl.indexOf('?') === -1 ? '?' : '&') + "custom=" + encodeURIComponent(leadId);
            }

            window.location.href = finalUrl;
        }
    </script>
