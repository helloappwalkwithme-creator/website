    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">Shift My Horizon - The Next Step</title>
    <style>
        :root {
            --dark: #0a0c10;
            --gray: #13161f;
            --border: #2b3245;
            --gold: #cba677;
            --text: #e2e4e9;
            --highlight: #1d2230;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        
        body { 
            margin: 0; 
            padding: 0; 
            background-color: var(--dark); 
            color: var(--text); 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh;
            line-height: 1.6;
        }

        .app-header { 
            width: 100%; 
            max-width: 600px; 
            margin: 0 auto; 
            display: flex; 
            justify-content: flex-end; 
            padding: 20px 20px 0 20px; 
        }
        
        .lang-switcher { 
            background-color: var(--gray); 
            color: var(--text); 
            border: 1px solid var(--border); 
            padding: 8px 12px; 
            border-radius: 8px; 
            font-size: 13px; 
            font-weight: 600; 
            cursor: pointer; 
            outline: none; 
            appearance: none; 
            text-align: center; 
        }
        .lang-switcher:focus { border-color: var(--gold); }

        main { 
            flex: 1; 
            padding: 40px 20px 100px 20px; 
            max-width: 600px; 
            margin: 0 auto; 
            width: 100%; 
        }

        .flow-title { color: var(--gold); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; text-align: center; }
        .h1-title { font-size: 32px; font-weight: 800; margin-top: 0; margin-bottom: 20px; color: var(--text); line-height: 1.2; text-align: center; }
        
        .hero-box {
            background-color: var(--highlight);
            border: 1px solid var(--border);
            border-left: 4px solid var(--gold);
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 32px;
        }

        .hero-text { font-size: 16px; color: #e0e0e0; margin: 0; }

        .feature-list { list-style: none; padding: 0; margin: 0 0 40px 0; }
        .feature-item { 
            display: flex; 
            align-items: flex-start; 
            margin-bottom: 16px; 
            background: var(--gray);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .check-icon { color: var(--gold); font-weight: bold; margin-right: 12px; font-size: 18px; }
        .feature-text { font-size: 15px; color: #ccc; margin: 0; }
        .feature-title { color: #fff; font-weight: 700; display: block; margin-bottom: 4px; }

        .btn-gold { 
            background-color: var(--gold); 
            color: var(--dark); 
            padding: 18px; 
            border-radius: 10px; 
            font-weight: 800; 
            font-size: 16px; 
            text-transform: uppercase; 
            border: none; 
            width: 100%; 
            cursor: pointer; 
            text-align: center; 
            letter-spacing: 0.5px;
            display: block;
            text-decoration: none;
            transition: transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(203, 166, 119, 0.2);
        }
        .btn-gold:active { transform: scale(0.98); }

        .guarantee { text-align: center; font-size: 13px; color: #888; margin-top: 16px; }

        .legal-footer { text-align: center; padding: 20px; margin-top: auto; border-top: 1px solid var(--border); font-size: 11px; }
        .legal-footer a { color: #888; text-decoration: none; margin: 0 8px; }
    </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-523HRG3C"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <header class="app-header">
        <select id="langSelect" class="lang-switcher" onchange="selectLang(this.value)">
            <option value="de">🇩🇪 DE</option>
            <option value="en">🇺🇸 EN</option>
            <option value="es">🇪🇸 ES</option>
        </select>
    </header>

    <main>
        <div class="flow-title" id="ui-flow-title"></div>
        <h1 class="h1-title" id="dynamic-headline"></h1>

        <div class="hero-box">
            <p class="hero-text" id="dynamic-hero"></p>
        </div>

        <ul class="feature-list">
            <li class="feature-item">
                <div class="check-icon">✓</div>
                <div>
                    <span class="feature-title" id="feat-1-title"></span>
                    <p class="feature-text" id="feat-1-text"></p>
                </div>
            </li>
            <li class="feature-item">
                <div class="check-icon">✓</div>
                <div>
                    <span class="feature-title" id="ui-feat-2-title"></span>
                    <p class="feature-text" id="ui-feat-2-text"></p>
                </div>
            </li>
            <li class="feature-item">
                <div class="check-icon">✓</div>
                <div>
                    <span class="feature-title" id="ui-feat-3-title"></span>
                    <p class="feature-text" id="ui-feat-3-text"></p>
                </div>
            </li>
        </ul>

        <a href="#" id="checkout-btn" class="btn-gold" onclick="goToCheckout(event)"></a>
        <div class="guarantee" id="ui-guarantee"></div>
    </main>

    <footer class="legal-footer">
        <a href="impressum.html" id="link-imp"></a> | 
        <a href="datenschutz.html" id="link-dat"></a> | 
        <a href="agb.html" id="link-agb"></a>
    </footer>

    <script>
        // HIER DEINEN ECHTEN DIGISTORE LINK EINTRAGEN
        const DIGISTORE_BASE_URL = "https://www.checkout-ds24.com/product/XXXXXX";

        const t = {
            de: {
                ui: {
                    pageTitle: "Shift My Horizon - Der nächste Schritt",
                    flowTitle: "Deine 4-Tage-Reise ist abgeschlossen",
                    headline: "Die Struktur für echte Transformation, <span id='user-name' style='color: var(--gold);'></span>",
                    hero: "Die ersten Erkenntnisse sind da, aber anfängliche Motivation verblasst schnell. Echte, dauerhafte Veränderung entsteht nicht durch Wissen, sondern durch konsequente Umsetzung. Um deine alten Muster endgültig zu brechen, brauchst du ab heute eine kompromisslose Struktur.",
                    feat1Title: "Tägliches Messenger-Protokoll",
                    feat1Text: "90 Tage lang tiefgreifende Impulse und konkrete Handlungsaufgaben direkt auf dein Handy. Kein theoretischer Ballast, sondern messbare Umsetzung.",
                    feat2Title: "Psychologische Neuausrichtung",
                    feat2Text: "Wir bekämpfen nicht nur Symptome. Wir verändern die unbewussten Überzeugungen an der Wurzel, die dich bisher blockiert haben.",
                    feat3Title: "Kompromisslose Verantwortlichkeit",
                    feat3Text: "Eine Schritt-für-Schritt-Führung, die sicherstellt, dass du nicht wieder in den alten Autopiloten zurückfällst.",
                    btn: "90-Tage-Zugang jetzt freischalten",
                    guarantee: "🔒 Sichere Kasse via Digistore24",
                    legal: { imp: "Impressum", dat: "Datenschutz", agb: "AGB" }
                }
            },
            en: {
                ui: {
                    pageTitle: "Shift My Horizon - The Next Step",
                    flowTitle: "Your 4-Day Journey is Complete",
                    headline: "The Structure for True Transformation, <span id='user-name' style='color: var(--gold);'></span>",
                    hero: "Initial insights are great, but motivation fades quickly. Real, lasting change doesn't come from knowledge, but from consistent execution. To permanently break your old patterns, you need an uncompromising structure starting today.",
                    feat1Title: "Daily Messenger Protocol",
                    feat1Text: "90 days of profound insights and actionable tasks delivered directly to your phone. No theoretical fluff, just measurable execution.",
                    feat2Title: "Psychological Rewiring",
                    feat2Text: "We don't just fight symptoms. We transform the unconscious core beliefs that have blocked you up until now.",
                    feat3Title: "Uncompromising Accountability",
                    feat3Text: "Step-by-step guidance that ensures you never slip back into your old autopilot habits.",
                    btn: "Unlock 90-Day Access Now",
                    guarantee: "🔒 Secure Checkout via Digistore24",
                    legal: { imp: "Imprint", dat: "Privacy Policy", agb: "Terms & Conditions" }
                }
            },
            es: {
                ui: {
                    pageTitle: "Shift My Horizon - El siguiente paso",
                    flowTitle: "Tu viaje de 4 días ha terminado",
                    headline: "La estructura para una verdadera transformación, <span id='user-name' style='color: var(--gold);'></span>",
                    hero: "Los conocimientos iniciales están ahí, pero la motivación se desvanece rápido. El cambio real y duradero no proviene de saber más, sino de la ejecución constante. Para romper tus viejos patrones, necesitas una estructura implacable.",
                    feat1Title: "Protocolo Diario por Messenger",
                    feat1Text: "90 días de impulsos profundos y tareas concretas directamente en tu móvil. Sin teoría innecesaria, solo ejecución medible.",
                    feat2Title: "Reconexión Psicológica",
                    feat2Text: "No solo combatimos los síntomas. Transformamos desde la raíz las creencias inconscientes que te han bloqueado hasta ahora.",
                    feat3Title: "Responsabilidad Inquebrantable",
                    feat3Text: "Una guía paso a paso que asegura que no vuelvas a caer en tus antiguos patrones de piloto automático.",
                    btn: "Desbloquear acceso de 90 días",
                    guarantee: "🔒 Pago seguro a través de Digistore24",
                    legal: { imp: "Aviso Legal", dat: "Privacidad", agb: "Términos" }
                }
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        let fname = urlParams.get('fname') || '';
        let leadId = urlParams.get('id') || '';
        
        let currentLang = localStorage.getItem('smh_language') || urlParams.get('lang') || 'de';
        if (!t[currentLang]) currentLang = 'de';

        function updateTexts() {
            const content = t[currentLang].ui;
            document.documentElement.lang = currentLang;
            document.title = content.pageTitle;
            document.getElementById('langSelect').value = currentLang;

            document.getElementById('ui-flow-title').innerText = content.flowTitle;
            document.getElementById('dynamic-headline').innerHTML = content.headline;
            
            if (fname && fname.trim() !== '') {
                document.getElementById('user-name').innerText = decodeURIComponent(fname);
            }

            document.getElementById('dynamic-hero').innerText = content.hero;
            document.getElementById('feat-1-title').innerText = content.feat1Title;
            document.getElementById('feat-1-text').innerText = content.feat1Text;
            document.getElementById('ui-feat-2-title').innerText = content.feat2Title;
            document.getElementById('ui-feat-2-text').innerText = content.feat2Text;
            document.getElementById('ui-feat-3-title').innerText = content.feat3Title;
            document.getElementById('ui-feat-3-text').innerText = content.feat3Text;
            
            document.getElementById('checkout-btn').innerText = content.btn;
            document.getElementById('ui-guarantee').innerText = content.guarantee;
            
            document.getElementById('link-imp').innerText = content.legal.imp;
            document.getElementById('link-dat').innerText = content.legal.dat;
            document.getElementById('link-agb').innerText = content.legal.agb;
        }

        function selectLang(lang) { 
            currentLang = lang; 
            localStorage.setItem('smh_language', lang);
            updateTexts(); 
        }

        window.onload = () => { 
            updateTexts(); 
        };

        function goToCheckout(e) {
            e.preventDefault();
            
            let finalUrl = DIGISTORE_BASE_URL;
            
            // Wenn eine ID aus der URL vorhanden ist, hängen wir sie für Make.com an den Digistore-Link an
            if (leadId) {
                finalUrl += "?custom=" + encodeURIComponent(leadId);
            }
            
            window.location.href = finalUrl;
        }
    </script>
</body>
</html>
