    <script>

                    flowTitle: "4 TAGE GESCHAFFT. DEIN ALTES ICH WARTET BEREITS.",
                    headline: "Wirf dein Momentum jetzt nicht weg, <span id='user-name' style='color: var(--gold);'></span>.",
                    hero: "Du hast die ersten 4 Tage durchgezogen. Aber Motivation verpufft. Wenn du jetzt abbrichst, übernimmt morgen wieder dein Autopilot. Echte Transformation entsteht nicht durch ein paar gute Vorsätze, sondern durch eine kompromisslose Routine. Die nächsten 86 Tage entscheiden, ob du in alte Muster zurückfällst oder dein Leben wirklich neu erschaffst.",
                    feat1Title: "Die Essenz aus über 10 Fachbüchern",
                    feat1Text: "Wir haben das Wissen der weltbesten Psychologie- und Verhaltens-Literatur komprimiert. Du musst keine Bücher wälzen – du bekommst die direkte Abkürzung in Form von täglichen 5-Minuten-Aufgaben.",
                    feat2Title: "Tag 5 bis 90: Der Messenger-Motor",
                    feat2Text: "Weitere 86 Tage lang glasklare Handlungsaufgaben direkt auf dein Handy. Kein theoretisches Blabla, sondern messbare Umsetzung, die deine Identität Stück für Stück neu verdrahtet.",
                    feat3Title: "Kompromisslose Verantwortlichkeit",
                    feat3Text: "Eine Schritt-für-Schritt-Führung, die dich an die Hand nimmt – und nicht mehr loslässt, bis dein neuer Standard unerschütterlich ist.",
                    btn: "Jetzt die nächsten 86 Tage freischalten",
                    guarantee: "🔒 Sichere und diskrete Kasse via Digistore24",
                    legal: { imp: "Impressum", dat: "Datenschutz", agb: "AGB" }

            },
            en: {
                ui: {
                    pageTitle: "Shift My Horizon - The Next Step",
                    flowTitle: "4 DAYS DOWN. YOUR OLD SELF IS WAITING.",
                    headline: "Don't throw away your momentum now, <span id='user-name' style='color: var(--gold);'></span>.",
                    hero: "You pushed through the first 4 days. But motivation fades. If you stop now, your autopilot takes over again tomorrow. True transformation doesn't come from a few good intentions, but from an uncompromising routine. The next 86 days will dictate whether you fall back into old patterns or truly recreate your life.",
                    feat1Title: "The Essence of over 10 Expert Books",
                    feat1Text: "We compressed the knowledge of the world's best psychology and behavioral literature. You don't have to read countless books—you get the ultimate shortcut in the form of daily 5-minute tasks.",
                    feat2Title: "Day 5 to 90: The Messenger Engine",
                    feat2Text: "86 more days of crystal-clear actionable tasks delivered directly to your phone. No theoretical nonsense, just measurable execution that rewires your identity piece by piece.",
                    feat3Title: "Uncompromising Accountability",
                    feat3Text: "Step-by-step guidance that takes you by the hand—and doesn't let go until your new standard is unshakable.",
                    btn: "Unlock the next 86 days now",
                    guarantee: "🔒 Secure and discreet checkout via Digistore24",
                    legal: { imp: "Imprint", dat: "Privacy Policy", agb: "Terms & Conditions" }

                    flowTitle: "4 DÍAS SUPERADOS. TU ANTIGUO YO TE ESPERA.",
                    headline: "No desperdicies tu impulso ahora, <span id='user-name' style='color: var(--gold);'></span>.",
                    hero: "Has superado los primeros 4 días. Pero la motivación se desvanece. Si te detienes ahora, tu piloto automático volverá a tomar el control mañana. La verdadera transformación no surge de un par de buenas intenciones, sino de una rutina implacable. Los próximos 86 días decidirán si vuelves a tus viejos patrones o si realmente recreas tu vida.",
                    feat1Title: "La esencia de más de 10 libros expertos",
                    feat1Text: "Hemos comprimido el conocimiento de la mejor literatura mundial sobre psicología y comportamiento. No tienes que leer docenas de libros: obtienes el atajo directo a través de tareas diarias de 5 minutos.",

                    btn: "Desbloquear los próximos 86 días ahora",
                    guarantee: "🔒 Pago seguro y discreto a través de Digistore24",
                    legal: { imp: "Aviso Legal", dat: "Privacidad", agb: "Términos" }
                }
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        let fname = urlParams.get('fname') || '';
        let leadId = urlParams.get('id') || '';
        let productId = urlParams.get('pid') || ''; 
        
        let currentLang = localStorage.getItem('smh_language') || urlParams.get('lang') || 'de';
        if (!t[currentLang]) currentLang = 'de';

        function updateTexts() {
            const content = t[currentLang].ui;
            document.documentElement.lang = currentLang;
            document.title = content.pageTitle;
            document.getElementById('langSelect').value = currentLang;

            document.getElementById('ui-flow-title').innerText = content.flowTitle;
            document.getElementById('dynamic-headline').innerHTML = content.headline;
            
            if (fname && fname.trim() !== '') {
                document.getElementById('user-name').innerText = decodeURIComponent(fname);
            }

            document.getElementById('dynamic-hero').innerText = content.hero;
            document.getElementById('feat-1-title').innerText = content.feat1Title;
            document.getElementById('feat-1-text').innerText = content.feat1Text;
            document.getElementById('ui-feat-2-title').innerText = content.feat2Title;
            document.getElementById('ui-feat-2-text').innerText = content.feat2Text;
            document.getElementById('ui-feat-3-title').innerText = content.feat3Title;
            document.getElementById('ui-feat-3-text').innerText = content.feat3Text;
            
            document.getElementById('checkout-btn').innerText = content.btn;
            document.getElementById('ui-guarantee').innerText = content.guarantee;
            
            document.getElementById('link-imp').innerText = content.legal.imp;
            document.getElementById('link-dat').innerText = content.legal.dat;
            document.getElementById('link-agb').innerText = content.legal.agb;
        }

        function selectLang(lang) { 
            currentLang = lang; 
            localStorage.setItem('smh_language', lang);
            updateTexts(); 
        }

        window.onload = () => { 
            updateTexts(); 
        };

        function goToCheckout(e) {
            e.preventDefault();
            
            if (!productId) {
                alert("Fehler: Keine Produkt-ID gefunden. Bitte öffne den Link erneut aus deiner Nachricht.");
                return;
            }
            
            let finalUrl = "https://www.checkout-ds24.com/product/" + encodeURIComponent(productId);
            
            if (leadId) {
                finalUrl += "?custom=" + encodeURIComponent(leadId);
            }
            
            window.location.href = finalUrl;
        }
    </script>
