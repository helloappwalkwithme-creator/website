    <style>
        :root {
            --bg: #000000;
            --card: #121212;
            --border: #2A2A2A;
            --gold: #D4AF37;
            --gold-dim: rgba(212, 175, 55, 0.15);
            --text: #FFFFFF;
            --text-dim: #888888;
            --danger: #C62828;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Progress Bar */
        .progress-container { width: 100%; height: 6px; background-color: var(--card); position: fixed; top: 0; left: 0; z-index: 100; display: none; }
        .progress-bar { height: 100%; background-color: var(--gold); width: 0%; transition: width 0.4s ease; }

        main { flex: 1; padding: 40px 20px; max-width: 600px; margin: 40px auto 0 auto; width: 100%; display: flex; flex-direction: column; }

        .step { display: none; animation: fadeIn 0.4s ease forwards; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .label-gold { color: var(--gold); font-size: 0.8rem; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; text-align: center; }
        h1 { font-size: 1.6rem; margin-bottom: 10px; text-align: center; line-height: 1.3; color: var(--text); }
        .subtitle { text-align: center; color: var(--text-dim); margin-bottom: 30px; font-size: 0.95rem; line-height: 1.5; }

        /* Buttons & Inputs */
        .option-btn { background-color: var(--card); border: 2px solid var(--border); color: var(--text); padding: 20px; border-radius: 12px; font-size: 1.05rem; margin-bottom: 15px; cursor: pointer; text-align: left; transition: all 0.2s ease; width: 100%; font-weight: 500; display: flex; justify-content: space-between; align-items: center; line-height: 1.4; }
        .option-btn:hover { border-color: #555; }
        .option-btn.selected { border-color: var(--gold); background-color: var(--gold-dim); color: var(--gold); font-weight: bold; }
        .lang-subtext { display: block; font-size: 0.85rem; color: var(--text-dim); font-weight: normal; margin-top: 4px; }

        .input-field { background-color: var(--card); border: 2px solid var(--border); color: var(--text); padding: 18px; border-radius: 10px; font-size: 1.1rem; margin-bottom: 15px; width: 100%; }
        .input-field:focus { border-color: var(--gold); outline: none; }

        /* 1-10 Scale */
        .scale-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 10px; }
        .scale-btn { width: 45px; height: 45px; border-radius: 8px; border: 2px solid var(--border); background-color: var(--card); color: var(--text); font-size: 1.1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
        .scale-btn:hover { border-color: var(--gold); }
        .scale-btn.selected { background-color: var(--gold); color: #000; border-color: var(--gold); }
        .scale-labels { display: flex; justify-content: space-between; color: var(--text-dim); font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 20px; padding: 0 5px; }
        .desc-box { background: #1a1a1a; padding: 20px; border-radius: 8px; border-left: 3px solid var(--gold); display: none; margin-bottom: 20px; animation: fadeIn 0.3s ease; }
        .desc-text { margin: 0; color: #DDD; font-size: 0.95rem; font-style: italic; line-height: 1.5; }

        /* Result Card & Pitch */
        .result-card { background-color: #1a0000; padding: 40px 20px; border-radius: 16px; border: 3px solid #FF3333; text-align: center; margin-top: 20px; margin-bottom: 20px; }
        .result-score { font-size: 5rem; font-weight: 900; color: #FF3333; line-height: 1; margin-bottom: 10px; }
        .result-title { color: #FF3333; font-size: 1.5rem; font-weight: bold; letter-spacing: 1px; margin-bottom: 15px; }
        .result-desc { color: #CCC; font-size: 1.1rem; line-height: 1.5; }
        .pitch-card { margin-top: 20px; background-color: var(--card); padding: 25px 20px; border-radius: 12px; border: 1px solid var(--border); text-align: left; }
        .pitch-card ul { list-style: none; padding: 0; margin: 0; }
        .pitch-card li { margin-bottom: 12px; font-size: 1rem; color: #DDD; display: flex; align-items: flex-start; }
        .pitch-card li span { margin-right: 10px; color: var(--gold); }

        /* Action Buttons */
        .btn-gold { background-color: var(--gold); color: #000; padding: 18px; border-radius: 10px; font-weight: 800; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; border: none; width: 100%; cursor: pointer; margin-top: 10px; text-align: center; display: block; transition: opacity 0.2s; }
        .btn-gold:active { opacity: 0.8; }
        .btn-gold:disabled { background-color: #333; color: #666; cursor: not-allowed; }

        .loading-screen { text-align: center; padding: 50px 0; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--gold); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .disclaimer { color: var(--text-dim); font-size: 0.8rem; text-align: center; margin-top: 20px; }
    </style>
</head>

                pitch: { label: "LA SOLUCIÓN", headline: "Tu camino a la libertad", sub: "Aquí tienes tu herramienta para resolverlo.", title: "El Protocolo incluye:", f1: "Programa de 90 días", f2: "Esencia de 48 libros", f3: "Diario y seguimiento", f4: "Apoyo de la comunidad", btn: "DESBLOQUEAR SOLUCIÓN" },
                reg: { label: "ÚLTIMO PASO", headline: "Crear Cuenta", sub: "Crea tu cuenta para guardar resultados y procede al pago.", email: "tu@email.com", pw: "Contraseña (mín. 6 car.)", btn: "IR AL PAGO", errFill: "Por favor, completa todos los campos.", errExists: "¡El correo ya existe! Inicia sesión en la app." },
                opts: {
                    root: { porn: "Consumo sexual excesivo", gettinggirls: "Inseguridad social", relationship: "Conflicto constante" },
                    freq: { porn: ["Varias veces al día", "Diario", "En el trabajo", "Varias por semana", "Solo con estrés"], gettinggirls: ["Diario", "Cada vez que veo una mujer", "Fines de semana", "Evito lo social"], relationship: ["Diario", "Discusiones diarias", "Varias por semana", "Fines de semana peores", "Solo silencio"] },
                    hist: ["Menos de 1 año", "1 - 5 años", "5 - 10 años", "Más de 10 años"],
                    pain: { porn: ["Niebla mental", "Problemas de erección", "Pérdida de tiempo", "Aislamiento", "Impotencia"], gettinggirls: ["Soledad profunda", "Miedo a quedar solo", "Envidia", "Inferioridad", "Frustración"], relationship: ["Sequía sexual", "Crítica constante", "Miedo a separación", "No cómodo", "Pérdida de respeto"] },
                    time: ["0-15 Min", "30 Min", "60 Min", "90 Min", "2+ Hrs"],
                    commit: ["Sí, lo haré (100%)", "Aún no estoy seguro"],
                    goal: { porn: ["Libertad mental", "Sexualidad saludable", "Respeto propio"], gettinggirls: ["Encontrar a la indicada", "Naturalidad", "Autoconfianza"], relationship: ["Reavivar pasión", "Liderazgo", "Paz"] },
                    rank: ["Militar", "El Guardián", "El Samurái", "El Emperador"]
                },
                scales: { distress: { porn: { 1: "Pequeño hábito.", 4: "Molesta.", 7: "Fuerte deseo.", 10: "Destruye mi vida." }, gettinggirls: { 1: "Quiero mejorar.", 4: "Bloqueado.", 7: "Solo.", 10: "Soledad consume." }, relationship: { 1: "Pequeñas diferencias.", 4: "Discusiones.", 7: "Distantes.", 10: "Sufrimiento máximo." } }, energy: { 1: "Agotado.", 4: "Agotado a menudo.", 7: "Buena energía.", 10: "Máxima." } },
                levels: { extreme: { t: "EXTREMO", sub: "TU SISTEMA ESTÁ AL LÍMITE", d: "Modo supervivencia." }, dangerous: { t: "PELIGROSO", sub: "TU CUERPO ESTÁ AL LÍMITE", d: "Sobrecargado." } }
            }
        };

        let currentLang = null;
        let currentStep = 0;
        const totalSteps = 14; 
        const answers = {};

        function getScaleDesc(scaleType, value) {
            const tr = t[currentLang].scales[scaleType];
            if(scaleType === 'distress') {
                const root = answers['root'];
                if(value <= 3) return tr[root][1];
                if(value <= 6) return tr[root][4];
                if(value <= 8) return tr[root][7];
                return tr[root][10];
            } else {
                if(value <= 3) return tr[1];
                if(value <= 6) return tr[4];
                if(value <= 8) return tr[7];
                return tr[10];
            }
        }

        function selectLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('#step-0 .option-btn').forEach(btn => btn.classList.remove('selected'));
            document.getElementById(`lang-${lang}`).classList.add('selected');
            document.getElementById('lang-welcome').innerText = t[lang].lang.welcome;
            document.getElementById('lang-title').innerText = t[lang].lang.title;
            document.getElementById('lang-subtitle').innerText = t[lang].lang.subtitle;
            const btn = document.getElementById('btn-start');
            btn.disabled = false;
            btn.innerText = t[lang].lang.next;
        }

        function startOnboarding() { document.getElementById('progressContainer').style.display = 'block'; buildStep1(); nextStep(); }

        function buildStep1() {
            const tr = t[currentLang];
            document.getElementById('s1-label').innerText = tr.step1.label; document.getElementById('s1-title').innerText = tr.step1.title; document.getElementById('s1-sub').innerText = tr.step1.sub; document.getElementById('s1-disclaimer').innerText = tr.step1.disclaimer;
            
            // Render Options Safely
            let html = '';
            for (const [key, val] of Object.entries(tr.opts.root)) { 
                html += `<button class="option-btn" onclick="selectRoot('${key}')">${val}</button>`; 
            }
            document.getElementById('s1-options').innerHTML = html;
        }

        function selectRoot(rootKey) { answers['root'] = rootKey; buildDynamicSteps(); nextStep(); }

        function buildDynamicSteps() {
            const tr = t[currentLang]; const root = answers['root'];
            
            const buildOpts = (id, optsObj) => {
                document.getElementById(`${id}-label`).innerText = tr[id.replace('s', 'step')].label; 
                document.getElementById(`${id}-title`).innerText = tr[id.replace('s', 'step')].title; 
                document.getElementById(`${id}-sub`).innerText = tr[id.replace('s', 'step')].sub || '';
                let html = '';
                optsObj.forEach(opt => html += `<button class="option-btn" onclick="nextStep()">${opt}</button>`);
                document.getElementById(`${id}-options`).innerHTML = html;
            };

            buildOpts('s2', tr.opts.freq[root]); buildOpts('s3', tr.opts.hist); buildOpts('s4', tr.opts.pain[root]); buildOpts('s7', tr.opts.time); buildOpts('s10', tr.opts.commit); buildOpts('s11', tr.opts.goal[root]); buildOpts('s12', tr.opts.rank);

            // Scale 1-10 (Distress)
            document.getElementById('s5-label').innerText = tr.step5.label; document.getElementById('s5-title').innerText = tr.step5.title; document.getElementById('s5-sub').innerText = tr.step5.sub; document.getElementById('s5-min').innerText = tr.step5.min; document.getElementById('s5-max').innerText = tr.step5.max; document.getElementById('s5-btn').innerText = tr.step5.next; 
            let scale5Html = ''; for(let i=1; i<=10; i++) scale5Html += `<button class="scale-btn" onclick="selectScale(this, 5, ${i}, 'distress')">${i}</button>`; document.getElementById('s5-options').innerHTML = scale5Html;
            
            // Scale 1-10 (Energy)
            document.getElementById('s6-label').innerText = tr.step6.label; document.getElementById('s6-title').innerText = tr.step6.title; document.getElementById('s6-sub').innerText = tr.step6.sub; document.getElementById('s6-min').innerText = tr.step6.min; document.getElementById('s6-max').innerText = tr.step6.max; document.getElementById('s6-btn').innerText = tr.step6.next; 
            let scale6Html = ''; for(let i=1; i<=10; i++) scale6Html += `<button class="scale-btn" onclick="selectScale(this, 6, ${i}, 'energy')">${i}</button>`; document.getElementById('s6-options').innerHTML = scale6Html;

            // Result
            document.getElementById('loading-title').innerText = tr.loading; document.getElementById('loading-sub').innerText = tr.loadingSub;
            document.getElementById('res-label').innerText = tr.result.label; document.getElementById('res-headline').innerText = tr.result.headline; document.getElementById('res-cost').innerText = tr.result.cost; document.getElementById('btn-res-next').innerText = tr.result.next;

            // Pitch & Reg
            document.getElementById('pitch-label').innerText = tr.pitch.label; document.getElementById('pitch-headline').innerText = tr.pitch.headline; document.getElementById('pitch-sub').innerText = tr.pitch.sub; document.getElementById('pitch-title').innerText = tr.pitch.title; document.getElementById('pitch-1').innerText = tr.pitch.f1; document.getElementById('pitch-2').innerText = tr.pitch.f2; document.getElementById('pitch-3').innerText = tr.pitch.f3; document.getElementById('pitch-4').innerText = tr.pitch.f4; document.getElementById('btn-checkout').innerText = tr.pitch.btn;
            document.getElementById('reg-label').innerText = tr.reg.label; document.getElementById('reg-headline').innerText = tr.reg.headline; document.getElementById('reg-sub').innerText = tr.reg.sub; document.getElementById('reg-email').placeholder = tr.reg.email; document.getElementById('reg-password').placeholder = tr.reg.pw; document.getElementById('btn-register').innerText = tr.reg.btn;
        }

        // Bugfix für Apple-Geräte: Button-Click wird explizit mitgegeben
        function selectScale(btnElement, stepNum, val, type) {
            document.querySelectorAll(`#step-${stepNum} .scale-btn`).forEach(b => b.classList.remove('selected'));
            btnElement.classList.add('selected');
            document.getElementById(`s${stepNum}-desc-text`).innerText = `"${getScaleDesc(type, val)}"`;
            document.getElementById(`s${stepNum}-desc-box`).style.display = 'block'; 
            document.getElementById(`s${stepNum}-btn`).style.display = 'block';
        }

        function nextStep() {
            document.getElementById(`step-${currentStep}`).classList.remove('active');
            currentStep++;
            if (currentStep > 0 && currentStep !== 8 && currentStep !== 13 && currentStep !== 14) {
                document.getElementById('progressBar').style.width = `${Math.min((currentStep / 12) * 100, 100)}%`;
            }
            document.getElementById(`step-${currentStep}`).classList.add('active');

            if(currentStep === 8) {
                setTimeout(() => {
                    document.getElementById(`step-8`).classList.remove('active');
                    currentStep++;
                    const fakeScore = Math.floor(Math.random() * (96 - 78 + 1)) + 78;
                    const tr = t[currentLang];
                    document.getElementById('res-score').innerText = `${fakeScore}%`;
                    const level = fakeScore >= 85 ? tr.levels.extreme : tr.levels.dangerous;
                    const color = fakeScore >= 85 ? "#FF0000" : "#FF3333";
                    document.getElementById('res-title').innerText = level.t; document.getElementById('res-desc').innerText = `${level.sub}\n\n${level.d}`; document.getElementById('res-score').style.color = color; document.getElementById('res-title').style.color = color; document.getElementById('resultCard').style.borderColor = color;
                    document.getElementById(`step-${currentStep}`).classList.add('active');
                }, 3000);
            }
        }

        // --- REGISTRATION & DIGISTORE REDIRECT ---
        async function handleRegistration() {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const errEl = document.getElementById('reg-error');
            const btn = document.getElementById('btn-register');
            const tr = t[currentLang];
            
            if(!email || password.length < 6) {
                errEl.innerText = tr.reg.errFill;
                errEl.style.display = 'block';
                return;
            }

            errEl.style.display = 'none';
            btn.innerText = "Lädt...";
            btn.disabled = true;

            // FALLBACK-SYSTEM: Wenn Supabase vom Adblocker blockiert wurde, ignorieren wir die Anmeldung und schicken ihn direkt zur Kasse!
            const db = initSupabase();
            if (!db) {
                console.warn("Rettungs-System greift: Direkter Checkout.");
                redirectToDigistore('guest_user_' + Math.floor(Math.random() * 10000));
                return;
            }

            const { data, error } = await db.auth.signUp({
                email: email,
                password: password,
                options: { data: { first_name: 'WebUser', is_over_21: true } }
            });

            if (error) {
                if(error.message.includes('already registered')) {
                    const { data: signInData, error: signInError } = await db.auth.signInWithPassword({ email, password });
                    if(signInError) {
                        errEl.innerText = tr.reg.errExists;
                        errEl.style.display = 'block';
                        btn.innerText = tr.reg.btn;
                        btn.disabled = false;
                        return;
                    }
                    redirectToDigistore(signInData.user.id);
                } else {
                    errEl.innerText = error.message;
                    errEl.style.display = 'block';
                    btn.innerText = tr.reg.btn;
                    btn.disabled = false;
                }
            } else if (data.user) {
                redirectToDigistore(data.user.id);
            }
        }

        function redirectToDigistore(userId) {
            // DEIN ECHTER DIGISTORE LINK
            const digistoreBaseUrl = "https://www.digistore24.com/product/675932"; 
            const finalUrl = `${digistoreBaseUrl}?custom=${userId}`;
            window.location.href = finalUrl;
        }
    </script>
