            let goal = '';
            try { goal = (l.s3.opts[root] && l.s3.opts[root][answers.energy]) ? l.s3.opts[root][answers.energy] : ''; } catch(e) {}
            const goalText = goal ? (goal.charAt(0).toLowerCase() + goal.slice(1)) : 'dein Ziel';

            document.getElementById('s6-lbl').innerText = res.lbl;
            document.getElementById('res-score').innerText = r.title;
            document.getElementById('res-level').innerText = r.level;

            document.getElementById('res-cost-lbl').innerText = res.costLbl;
            document.getElementById('res-cost-val').innerText = r.cost;

            document.getElementById('res-action-lbl').innerText = res.actionLbl;
            document.getElementById('s6-msg').innerText = r.msg.replace('{goal}', goalText);
        }

        function handleNext() {
            if(step === 1 && !answers.root_problem) return;
            if(step === 2 && answers.pain_point.length === 0) return;
            if(step === 3 && !answers.energy) return;
            if(step === 4 && !answers.satisfaction) return;

            document.getElementById(`step-${step}`).classList.remove('active'); step++;
            document.querySelector('.progress-container').style.display = (step < 7 && step !== 5 && step !== 6) ? 'block' : 'none';
            pBar.style.width = `${((step - 1) / 6) * 100}%`;

            bBar.style.display = (step === 2 || step === 6) ? 'flex' : 'none';
            if(step === 6) bNext.innerText = t[currentLang].btn.next;
            checkNextState();

            document.getElementById(`step-${step}`).classList.add('active'); window.scrollTo(0,0);
            if(step === 5) setTimeout(() => { handleNext(); renderResult(); }, 2000);
        }

        function handleBack() {
            document.getElementById(`step-${step}`).classList.remove('active');
            step = Math.max(1, step === 6 ? 4 : step - 1);
            document.getElementById(`step-${step}`).classList.add('active');
            document.querySelector('.progress-container').style.display = 'block';
            pBar.style.width = `${((step - 1) / 6) * 100}%`;
            bBar.style.display = (step === 2) ? 'flex' : 'none';
            checkNextState(); window.scrollTo(0,0);
        }

        function generateAccessCode() {
            const p1 = Math.random().toString(36).substring(2, 6).toUpperCase();
            const p2 = Math.random().toString(36).substring(2, 6).toUpperCase();
            return p1 + '-' + p2;
        }

        async function handleRegistration() {
            const fname = document.getElementById('reg-fname').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const channel = document.getElementById('reg-channel').value;
            const errEl = document.getElementById('reg-error');
            const btn = document.getElementById('btn-register');

            if(!email || !fname) { errEl.innerText = t[currentLang].s7.errFill; errEl.style.display = 'block'; return; }
            errEl.style.display = 'none'; btn.disabled = true; btn.innerText = "...";

            const accessCode = generateAccessCode();
            answers.access_code = accessCode;

            try {
                if (!supabaseClient) {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                }

                const { error: rpcError } = await supabaseClient.rpc('register_lead', {
                    p_email: email,
                    p_first_name: fname,
                    p_delivery_channel: channel,
                    p_source: 'integrated_man_flow',
                    p_language: currentLang,
                    p_onboarding_data: answers,
                    p_access_code: accessCode,
                    p_chosen_path: chosenPath,
                    // Fallback only — server-side map_flow_name() resolves the real sub-flow
                    // from (source + root_problem). "Integrated Man" is a category, not a flow.
                    p_flow_name: 'mens_relationship_flow'
                });

                if (rpcError) throw rpcError;

                const baseMessage = botMessages[currentLang] || botMessages['de'];
                const accessLabel = accessLabels[currentLang] || accessLabels['de'];
                const finalMessage = `${baseMessage}\n\n${accessLabel} ${accessCode}`;

                const encodedMessage = encodeURIComponent(finalMessage);

                if(channel === 'telegram') {
                    window.location.href = `https://t.me/${tgBotName}?text=${encodedMessage}`;
                } else {
                    window.location.href = `https://wa.me/${waNumber}?text=${encodedMessage}`;
                }

            } catch(e) {
                console.error("Fehler beim Speichern:", e);
                errEl.innerText = t[currentLang].s7.errServer;
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.innerText = t[currentLang].btn.pay;
            }
        }

        function lpGetFlowKey() {
            var pp = new URLSearchParams(location.search).get('p');
            var L = LANDING[currentLang] || LANDING.de;
            if (pp && L.flows[pp]) return pp;
            return 'default';
        }

        function lpStars(rating) {
            var full = Math.floor(rating);
            var half = (rating - full) >= 0.5;
            var html = '';
            for (var i = 1; i <= 5; i++) {
                if (i <= full) html += '★';
                else if (i === full + 1 && half) html += '⯪';
                else html += '<span class="off">★</span>';
            }
            return html;
        }

        function lpRenderRating(rows) {
            var el = document.getElementById('lp-rating');
            if (!el) return;
            if (!rows || !rows.length) { el.hidden = true; return; }
            var sum = rows.reduce(function(a, r){ return a + Number(r.rating || 0); }, 0);
            var avg = sum / rows.length;
            var avgStr = (currentLang === 'en') ? avg.toFixed(1) : avg.toFixed(1).replace('.', ',');
            var lbl = (currentLang === 'en') ? (rows.length === 1 ? 'review' : 'reviews')
                    : (currentLang === 'es') ? (rows.length === 1 ? 'reseña' : 'reseñas')
                    : (rows.length === 1 ? 'Bewertung' : 'Bewertungen');
            el.innerHTML = '<span class="lp-rating-stars">' + lpStars(avg) + '</span>' +
                           '<span class="lp-rating-num">' + avgStr + ' / 5</span>' +
                           '<span class="lp-rating-count">· ' + rows.length + ' ' + lbl + '</span>';
            el.hidden = false;
        }

        function lpRenderReviews(rows) {
            var box = document.getElementById('lp-reviews');
            var L = LANDING[currentLang] || LANDING.de;
            if (!rows || !rows.length) { box.innerHTML = '<p class="lp-sub" style="margin:0;">' + L.reviewsEmpty + '</p>'; return; }
            box.innerHTML = rows.map(function(r){
                var badge = r.verified_purchase ? '<span class="lp-review-badge">✓ Verifiziert</span>' : '';
                var safe = (r.comment || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                var name = (r.first_name || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                return '<div class="lp-review"><div class="lp-stars">' + lpStars(Number(r.rating)) + '</div>' +
                       '<p class="lp-review-txt">„' + safe + '"</p>' +
                       '<div class="lp-review-name">' + name + badge + '</div></div>';
            }).join('');
        }

        async function lpLoadReviews() {
            try {
                if (!supabaseClient) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                var flowKey = lpGetFlowKey();
                var q = supabaseClient.from('v_reviews_public').select('first_name,comment,rating,verified_purchase,topic,created_at');
                var res = await q;
                var allRows = (res && res.data) ? res.data : [];
                lpRenderRating(allRows); // Aggregat-Badge bleibt ueber ALLE Reviews
                // Einzel-Stimmen NUR zum passenden Flow-Topic; Uebersichtsseite (default) zeigt alle
                var rows = (flowKey === 'default') ? allRows.slice()
                         : allRows.filter(function(r){ return r.topic === flowKey; });
                lpRenderReviews(rows.slice(0, 6));
            } catch (e) { console.warn('reviews load failed', e); lpRenderRating([]); lpRenderReviews([]); }
        }
