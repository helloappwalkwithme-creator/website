        .progress-bar { height: 100%; background-color: var(--gold); width: 0%; transition: width 0.3s ease; }

        main { flex: 1; padding: 40px 20px; max-width: 500px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; }
        
        .step { display: none; animation: fadeIn 0.3s ease forwards; padding-bottom: 80px; }

        .quiz-btn { background-color: var(--card); border: 2px solid var(--border); padding: 18px 20px; border-radius: 10px; margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.2s ease; }
        .quiz-btn:hover { border-color: #555; }
        .quiz-btn.selected { border-color: var(--gold); background-color: var(--card-active); }
        .quiz-btn-text { color: var(--text); font-size: 15px; flex: 1; padding-right: 15px; line-height: 1.4; }
        .quiz-btn.selected .quiz-btn-text { color: var(--gold); font-weight: bold; }
        
        .radio-icon { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #666; display: flex; align-items: center; justify-content: center; }
        .quiz-btn.selected .radio-icon { border-color: var(--gold); }
        .radio-icon::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); display: none; }
        .quiz-btn.selected .radio-icon::after { display: block; }

        .check-icon { width: 22px; height: 22px; border-radius: 4px; border: 2px solid #666; display: flex; align-items: center; justify-content: center; color: transparent; font-weight: bold; }
        .quiz-btn.selected .check-icon { border-color: var(--gold); background: var(--gold); color: #000; }

        .ass-label { color: var(--gold); font-size: 11px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px; margin-bottom: 10px; }
        .ass-value { font-size: 40px; font-weight: 800; margin: 10px 0; }
        .ass-desc { color: #bbb; font-size: 13px; margin-bottom: 15px; min-height: 20px; }
        .counter-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-top: 1px solid var(--border); padding-top: 15px; }
        .counter-btn { background: #222; border: none; color: inherit; width: 40px; height: 40px; border-radius: 8px; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .counter-btn:active { background: #333; }
        .scale-hints { display: flex; justify-content: space-between; font-size: 11px; color: #777; }

        /* Result Card */
        .result-card { background-color: #1a0000; border: 3px solid var(--danger); border-radius: 12px; padding: 30px 20px; text-align: center; margin-bottom: 20px; }
        .result-score { color: var(--danger); font-size: 70px; font-weight: 900; line-height: 1; margin-bottom: 10px; }
        .result-level { color: #ff9999; font-size: 20px; font-weight: 800; text-transform: uppercase; }
        .insight-card { background: #171717; border: 1px solid #2b2b2b; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
        .insight-title { color: #ccc; font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; }
        .insight-text { color: #b5b5b5; font-size: 14px; line-height: 1.5; }
        .info-card { background: #141414; border: 1px solid #303030; border-radius: 10px; padding: 20px; margin-bottom: 15px; }

        .check-row { display: flex; align-items: flex-start; margin-bottom: 20px; cursor: pointer; }
        .box-icon { width: 24px; height: 24px; border: 2px solid var(--gold); border-radius: 6px; margin-right: 15px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: transparent; font-weight: bold; }
        .check-row.selected .box-icon { background: var(--gold); color: #000; }
        .check-label { font-size: 14px; color: #ddd; line-height: 1.5; margin: 0; }

        /* Fixed Bottom Button */
        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg); padding: 15px 20px 25px 20px; border-top: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .btn-gold { background-color: var(--gold); color: #000; padding: 18px; border-radius: 8px; font-weight: 900; font-size: 16px; text-transform: uppercase; border: none; width: 100%; max-width: 500px; cursor: pointer; text-align: center; }
        .btn-gold:disabled { background-color: #333; color: #666; cursor: not-allowed; }
        .btn-back { background: none; border: none; color: #666; margin-top: 15px; cursor: pointer; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }

        .input-field { background-color: #fdfad5; border: 1px solid var(--border); color: #000; padding: 18px; border-radius: 8px; font-size: 16px; margin-bottom: 15px; width: 100%; font-weight: 500; }

        .spinner { border: 4px solid #333; border-top-color: var(--gold); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 40px auto; }

                    title: "¿Estás listo para trabajar?", 
                    opts: ["Sí, lo haré (100%)", "Aún no estoy seguro"] 
                },
                s10: {

                    title: "Aviso importante", 
                    desc: "Esta app ofrece guías estructuradas y herramientas para el desarrollo personal. No sustituye tratamiento médico, psicológico o psiquiátrico profesional.", 
                    c1: "Confirmo que actualmente estoy mentalmente estable y no en una crisis aguda.", 
                    c2: "Entiendo que esta app no sustituye una terapia." 
                },
                s11: { 
                    title: "¿Qué camino de fuerza te inspira más?", 
                    opts: { military: "Militar (disciplina y dureza)", guardian: "El Guardián (mente y enfoque)", samurai: "El Samurái (honor y calma)", roman: "El Emperador (poder y estoicismo)" } 
                },
                s12: { 
                    lbl: "ÚLTIMO PASO", 
                    title: "Crea tu cuenta", 
                    sub: "Asegura tu progreso.", 
                    em: "tu@email.com", 
                    pw: "Al menos 6 caracteres", 
                    btn: "IR AL PAGO", 
                    errFill: "Completa todos los campos", 
                    errExists: "Email existe." 
                }
            }
        };

        // --- STATE ---
        let currentLang = localStorage.getItem('smh_language') || 'en';
        let step = 1; // Wir starten direkt bei Step 1, da Sprache schon auf der Index-Seite gewählt wird
        let answers = { root_problem: 'porn', pain_point: [], urgency: 5, energy: 5, available_time: 30, therapy1: false, therapy2: false };

        // --- DOM ELEMENTS ---
        const bBar = document.getElementById('bottomBar');
        const bNext = document.getElementById('btnNext');
        const pBar = document.getElementById('progressBar');
        const pCont = document.getElementById('progressContainer');

        function updateTexts() {
            const l = t[currentLang] || t['en'];
            bNext.innerText = l.btn.next;
            document.getElementById('btnBack').innerText = l.btn.back;

            document.getElementById('s1-lbl').innerText = l.s1.lbl; document.getElementById('s1-title').innerText = l.s1.title;
            document.getElementById('s2-lbl').innerText = l.s2.lbl; document.getElementById('s2-title').innerText = l.s2.title;
            document.getElementById('s3-lbl').innerText = l.s3.lbl; document.getElementById('s3-title').innerText = l.s3.title;
            document.getElementById('s4-lbl').innerText = l.s4.lbl; document.getElementById('s4-title').innerText = l.s4.title;
            document.getElementById('s5-lbl').innerText = l.s5.lbl; document.getElementById('s5-title').innerText = l.s5.title;
            
            document.getElementById('s5-lbl-urg').innerText = l.s5.urgLbl; document.getElementById('hint-urg-min').innerText = l.s5.urgMin; document.getElementById('hint-urg-max').innerText = l.s5.urgMax;
            document.getElementById('s5-lbl-nrg').innerText = l.s5.nrgLbl; document.getElementById('hint-nrg-min').innerText = l.s5.nrgMin; document.getElementById('hint-nrg-max').innerText = l.s5.nrgMax;
            document.getElementById('s5-lbl-tim').innerText = l.s5.timLbl;
            
            document.getElementById('s6-title').innerText = l.s6.title; document.getElementById('s6-sub').innerText = l.s6.sub;
            
            document.getElementById('s8-title').innerText = l.s8.title; document.getElementById('s8-msg').innerText = l.s8.msg; document.getElementById('s8-disc').innerText = l.s8.disc;
            document.getElementById('s9-lbl').innerText = l.s9.lbl; document.getElementById('s9-title').innerText = l.s9.title;
            
            document.getElementById('s10-lbl').innerText = l.s10.lbl; document.getElementById('s10-title').innerText = l.s10.title; document.getElementById('s10-desc').innerText = l.s10.desc;
            document.getElementById('s10-c1').innerText = l.s10.c1; document.getElementById('s10-c2').innerText = l.s10.c2;
            
            document.getElementById('s11-title').innerText = l.s11.title;
            
            document.getElementById('s12-lbl').innerText = l.s12.lbl; 
            document.getElementById('s12-title').innerText = l.s12.title; 
            document.getElementById('s12-sub').innerText = l.s12.sub;
            document.getElementById('reg-email').placeholder = l.s12.em; 
            document.getElementById('reg-password').placeholder = l.s12.pw;
            document.getElementById('btn-register').innerText = l.s12.btn.pay || "PROCEED TO PAYMENT";
            
            updateAssessmentUI();
        }

        window.onload = () => { 
            updateTexts();
            buildOptions();
            
            // Setzt Progress-Bar initial für Step 1
            pBar.style.width = `${(1 / 11) * 100}%`;
        };

        function buildOptions() {
            const l = t[currentLang] || t['en'];
            const root = answers.root_problem;

            // S1 (Root)
            document.getElementById('s1-opts').innerHTML = Object.entries(l.s1.opts).map(([k, v]) => 
                `<div class="quiz-btn ${root === k ? 'selected' : ''}" onclick="setAns('root_problem', '${k}'); buildOptions(); handleNext();"><div class="quiz-btn-text">${v}</div><div class="radio-icon"></div></div>`
            ).join('');

            // S2 (Frequency)
            document.getElementById('s2-opts').innerHTML = l.s2.opts[root].map((v, i) => 
                `<div class="quiz-btn ${answers.frequency === v ? 'selected' : ''}" onclick="setAns('frequency', '${v.replace(/'/g, "\\'")}'); buildOptions(); handleNext();"><div class="quiz-btn-text">${v}</div><div class="radio-icon"></div></div>`
            ).join('');

            // S3 (History)
            document.getElementById('s3-opts').innerHTML = l.s3.opts.map((v, i) => 
                `<div class="quiz-btn ${answers.history === v ? 'selected' : ''}" onclick="setAns('history', '${v.replace(/'/g, "\\'")}'); buildOptions(); handleNext();"><div class="quiz-btn-text">${v}</div><div class="radio-icon"></div></div>`
            ).join('');

            // S4 (Consequences - Multi)
            document.getElementById('s4-opts').innerHTML = l.s4.opts[root].map((v) => {
                const isSel = answers.pain_point.includes(v);
                return `<div class="quiz-btn ${isSel ? 'selected' : ''}" onclick="togglePain('${v.replace(/'/g, "\\'")}'); buildOptions();"><div class="quiz-btn-text">${v}</div><div class="check-icon">✓</div></div>`;
            }).join('');

            // S9 (Commitment)
            document.getElementById('s9-opts').innerHTML = l.s9.opts.map((v) => 
                `<div class="quiz-btn ${answers.commitment === v ? 'selected' : ''}" onclick="setAns('commitment', '${v.replace(/'/g, "\\'")}'); buildOptions(); handleNext();"><div class="quiz-btn-text">${v}</div><div class="radio-icon"></div></div>`
            ).join('');

            // S11 (Rank Path)
            document.getElementById('s11-opts').innerHTML = Object.entries(l.s11.opts).map(([k, v]) => 
                `<div class="quiz-btn ${answers.rank_path === k ? 'selected' : ''}" onclick="setAns('rank_path', '${k}'); buildOptions(); handleNext();"><div class="quiz-btn-text">${v}</div><div class="radio-icon"></div></div>`
            ).join('');
        }

        function setAns(key, val) { answers[key] = val; }
        function togglePain(val) {
            const idx = answers.pain_point.indexOf(val);
            if (idx > -1) answers.pain_point.splice(idx, 1);
            else answers.pain_point.push(val);
            checkNextState();
        }

        function adjCounter(type, amount) {
            if (type === 'urg') { answers.urgency = Math.max(1, Math.min(10, answers.urgency + amount)); }
            if (type === 'nrg') { answers.energy = Math.max(1, Math.min(10, answers.energy + amount)); }
            if (type === 'tim') { answers.available_time = Math.max(0, Math.min(120, answers.available_time + amount)); }
            updateAssessmentUI();
        }

        function updateAssessmentUI() {
            document.getElementById('val-urg').innerText = answers.urgency;
            document.getElementById('val-nrg').innerText = answers.energy;
            document.getElementById('val-tim').innerText = answers.available_time;
            
            const l = t[currentLang] ? t[currentLang].s5 : t['en'].s5;
            document.getElementById('desc-urg').innerText = l.urgDesc[answers.urgency - 1];
            document.getElementById('desc-nrg').innerText = l.nrgDesc[answers.energy - 1];
            
            let tIdx = 2;
            if(answers.available_time < 15) tIdx = 0; else if(answers.available_time < 30) tIdx = 1; else if(answers.available_time >= 60) tIdx = 3; else if(answers.available_time >= 90) tIdx = 4;
            document.getElementById('desc-tim').innerText = l.timDesc[tIdx];
        }

        function toggleTherapy(id) {
            if(id === 'chk1') answers.therapy1 = !answers.therapy1;
            if(id === 'chk2') answers.therapy2 = !answers.therapy2;
            document.getElementById('chk1').className = `check-row ${answers.therapy1 ? 'selected' : ''}`;
            document.getElementById('chk2').className = `check-row ${answers.therapy2 ? 'selected' : ''}`;
            checkNextState();
        }

        function checkNextState() {
            let canGo = false;
            if(step === 4) canGo = answers.pain_point.length > 0;
            else if(step === 5) canGo = true;
            else if(step === 7) canGo = true;
            else if(step === 8) canGo = true;
            else if(step === 10) canGo = (answers.therapy1 && answers.therapy2);

            bNext.disabled = !canGo;
        }

        function renderResult() {
            let burden = 70 + (answers.urgency * 1.5) + ((10 - answers.energy) * 1.5);
            burden = Math.min(99, Math.round(burden));
            answers.calculated_stress_score = burden;

            const res = t[currentLang] ? t[currentLang].s7 : t['en'].s7;
            let lvl, col;
            if (burden >= 86) { lvl = res.lvls.ext; col = '#ff0000'; }
            else if (burden >= 81) { lvl = res.lvls.dan; col = '#ff3333'; }
            else if (burden >= 76) { lvl = res.lvls.ala; col = '#ff6666'; }
            else { lvl = res.lvls.cri; col = '#ff9999'; }

            document.getElementById('s7-lbl').innerText = res.lbl;
            document.getElementById('res-score').innerText = burden + '%';
            document.getElementById('res-score').style.color = col;
            document.getElementById('res-level').innerText = lvl.t;
            document.getElementById('res-level').style.color = col;
            document.getElementById('res-card').style.borderColor = col;

            document.getElementById('res-sub').innerText = lvl.s;
            document.getElementById('res-sub').style.color = col;
            document.getElementById('res-desc').innerText = lvl.d;
            document.getElementById('res-info-box').style.borderLeftColor = col;

            document.getElementById('res-cost-lbl').innerText = res.costLbl;
            document.getElementById('res-cost-val').innerText = res.costVal[answers.root_problem];
        }

        function handleNext() {
            document.getElementById(`step-${step}`).classList.remove('active');
            step++;
            
            if (step < 12 && step !== 6 && step !== 7 && step !== 8) {
                pCont.style.display = 'block';
                pBar.style.width = `${((step - 1) / 11) * 100}%`;
            } else {
                pCont.style.display = 'none';
            }

            // Buttons Bar an/aus
            if (step === 4 || step === 5 || step === 7 || step === 8 || step === 10) {
                bBar.style.display = 'flex';
                if(step === 10) bNext.innerText = t[currentLang] ? t[currentLang].btn.start : t['en'].btn.start; 
                else bNext.innerText = t[currentLang] ? t[currentLang].btn.next : t['en'].btn.next;
                checkNextState();
            } else {
                bBar.style.display = 'none';
            }

            document.getElementById(`step-${step}`).classList.add('active');
            window.scrollTo(0,0);

            if(step === 6) {
                setTimeout(() => { handleNext(); renderResult(); }, 2500);
            }
        }

        function handleBack() {
            document.getElementById(`step-${step}`).classList.remove('active');
            step = Math.max(1, step - 1);
            if(step === 6) step = 5; // skip loading backward
            document.getElementById(`step-${step}`).classList.add('active');
            
            if (step < 12 && step !== 6 && step !== 7 && step !== 8) {
                pCont.style.display = 'block';
                pBar.style.width = `${((step - 1) / 11) * 100}%`;
            } else {
                pCont.style.display = 'none';
            }
            
            if (step === 4 || step === 5 || step === 7 || step === 8 || step === 10) {
                bBar.style.display = 'flex';
                if(step === 10) bNext.innerText = t[currentLang] ? t[currentLang].btn.start : t['en'].btn.start; 
                else bNext.innerText = t[currentLang] ? t[currentLang].btn.next : t['en'].btn.next;
                checkNextState();
            } else {
                bBar.style.display = 'none';
            }
            window.scrollTo(0,0);
        }

        // --- SUPABASE REGISTRATION & BULLETPROOF REDIRECT ---
        function redirectToDigistore(userId) {
            console.log("Navigiere zu Digistore. User ID:", userId);
            const digistoreBaseUrl = digistoreLinks[currentLang] || digistoreLinks['en'];
            const targetUrl = digistoreBaseUrl + '?custom=' + userId;
            
            // Garantierte Weiterleitung (location.href löst den Browser-Redirect sicher aus)
            window.location.href = targetUrl;
        }

        async function handleRegistration() {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const errEl = document.getElementById('reg-error');
            const btn = document.getElementById('btn-register'); 
            const l = t[currentLang] || t['en'];
            
            if(!email || password.length < 6) { 
                errEl.innerText = l.s12.errFill; 
                errEl.style.display = 'block'; 
                return; 
            }
            
            errEl.style.display = 'none';
            btn.disabled = true;
            btn.innerText = "...";

            // Failsafe: Falls Supabase durch Adblocker (Brave etc.) komplett geblockt wird
            try {
                const db = initSupabase();
                if (!db) { 
                    console.warn("Supabase konnte nicht initialisiert werden (evtl. Adblocker). Umleitung läuft trotzdem.");
                    redirectToDigistore('guest_adblock_user'); 
                    return; 
                }

                const finalPayload = {
                    name: 'WebUser',
                    root_problem: answers.root_problem,
                    frequency: answers.frequency,
                    history: answers.history,
                    pain_point: answers.pain_point,
                    urgency: answers.urgency,
                    energy: answers.energy,
                    impact: answers.urgency,
                    energy_level: answers.energy,
                    available_time: answers.available_time,
                    belastung: answers.calculated_stress_score,
                    belastung_insights: "Web Assessment Completed",
                    health_confirmation: answers.therapy1,
                    disclaimer_accepted: answers.therapy2,
                    rank_path: answers.rank_path
                };

                const { data, error } = await db.auth.signUp({ 
                    email, 
                    password, 
                    options: { 
                        data: { 
                            first_name: 'WebUser', 
                            is_over_21: true,
                            onboarding_data: finalPayload 
                        } 
                    } 
                });

                if (error) {
                    if (error.message.includes('already registered') || error.status === 400) {
                        const { data: signInData, error: signInError } = await db.auth.signInWithPassword({ email, password });
                        if (signInError) { 
                            errEl.innerText = l.s12.errExists; 
                            errEl.style.display = 'block'; 
                            btn.disabled = false;
                            btn.innerText = l.s12.btn.pay || "PROCEED TO PAYMENT";
                            return; 
                        }
                        redirectToDigistore(signInData.user.id);
                    } else {
                        errEl.innerText = error.message; 
                        errEl.style.display = 'block';
                        btn.disabled = false;
                        btn.innerText = l.s12.btn.pay || "PROCEED TO PAYMENT";
                    }
                } else {
                    // Fallback falls User-Objekt leer ist, aber Registrierung geklappt hat
                    redirectToDigistore(data?.user?.id || 'new_user_no_id');
                }
            } catch (e) {
                console.error("Unerwarteter Fehler im Registrierungsprozess: ", e);
                // Harte Failsafe-Weiterleitung bei JS Crash
                redirectToDigistore('guest_crash_user');
            }
        }
    </script>
