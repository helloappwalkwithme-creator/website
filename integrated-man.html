        .input-field:focus { border-color: var(--gold); outline: none; }

        /* Scales */
        .scale-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 10px; }
        .scale-btn { width: 45px; height: 45px; border-radius: 8px; border: 2px solid var(--border); background-color: var(--card); color: var(--text); font-size: 1.1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }

        .desc-text { margin: 0; color: #DDD; font-size: 0.95rem; font-style: italic; line-height: 1.5; font-weight: 500; }

        .result-desc { color: #CCC; font-size: 1.05rem; line-height: 1.5; font-style: italic; }

        .cost-prefix { color: var(--text-dim); font-size: 0.85rem; font-weight: bold; text-transform: uppercase; margin: 0 0 10px 0; letter-spacing: 1px; }
        .cost-dynamic { color: #FF3333; font-size: 1.2rem; font-weight: 800; margin: 0; line-height: 1.4; }

        let currentLang = 'de'; let currentStep = 0; const answers = {}; 
        
        // --- SCORE SYSTEM ---
        let totalStressScore = 0;
        let scoreAnswersCount = 0;

        function saveAnswer(stepId, value, scoreWeight) {
            answers[stepId] = value;
            if (scoreWeight !== undefined) {
                totalStressScore += scoreWeight;
                scoreAnswersCount++;
            }
        }

        // Berechnet den finalen Score zwischen 70 und 90 Prozent
        function calculateFinalScore() {
            const averageWeight = scoreAnswersCount > 0 ? (totalStressScore / scoreAnswersCount) : 50;
            const finalScore = 70 + (averageWeight / 100) * 20;
            return Math.round(finalScore);
        }

        function getScaleDesc(scaleType, value) {
            const steps = t[currentLang].onboarding.steps;
            const root = answers['root'];
            if(scaleType === 'distress') return steps.impact.descriptions[root][value];
            if(scaleType === 'energy') return steps.energy_level.descriptions[root][value];
            return "";
        }

            answers['language'] = lang;

        function startOnboarding() { document.getElementById('progressContainer').style.display = 'block'; buildStep1(); nextStep(); }

        function buildStep1() {
            const steps = t[currentLang].onboarding.steps;
            setText('s1-label', steps.root_problem.title); setText('s1-title', steps.root_problem.question); setText('s1-disclaimer', steps.root_problem.disclaimer);
            let html = ''; 
            for (const [key, val] of Object.entries(steps.root_problem.options)) { 
                html += `<button class="option-btn" onclick="selectRoot('${key}')">${val}</button>`; 
            }
            document.getElementById('s1-options').innerHTML = html;
        }

        function selectRoot(rootKey) { 
            answers['root'] = rootKey; 
            saveAnswer('root_problem', rootKey, 80); 
            buildDynamicSteps(); 
            nextStep(); 
        }

        function buildDynamicSteps() {
            const steps = t[currentLang].onboarding.steps; 
            const root = answers['root'];

            // stressIncreasesWithIndex: TRUE = Index 0 (Wenig) -> Wenig Stress, Max Index (Viel) -> Viel Stress.
            const buildOpts = (id, stepData, optionsObj, stressIncreasesWithIndex = false) => {
                setText(`${id}-label`, stepData.title); setText(`${id}-title`, stepData.question); 
                let html = ''; 
                const opts = Array.isArray(optionsObj) ? optionsObj : Object.values(optionsObj);
                const maxIndex = opts.length - 1;
                
                opts.forEach((opt, index) => {
                    const safeOpt = opt.replace(/'/g, "\\'");
                    
                    let scoreWeight = stressIncreasesWithIndex ? (index / maxIndex) * 100 : ((maxIndex - index) / maxIndex) * 100;
                    
                    html += `<button class="option-btn" onclick="saveAnswer('${id}', '${safeOpt}', ${scoreWeight}); nextStep()">${opt}</button>`;
                });
                document.getElementById(`${id}-options`).innerHTML = html;
            };

            // BEIDE auf "true" gestellt, da sie jetzt streng von WENIG -> VIEL geordnet sind
            buildOpts('s2', steps.frequency, steps.frequency.options[root], true); 
            buildOpts('s3', steps.history, steps.history.options, true); 
            
            buildOpts('s4', steps.pain_point, steps.pain_point.options[root], false); 
            
            // "Wenig Zeit" = Schlecht (also stressIncreasesWithIndex = false)
            buildOpts('s7', steps.available_time, steps.available_time.options, false); 
            
            buildOpts('s10', steps.commitment, steps.commitment.options, false); 
            buildOpts('s11', steps.goal, steps.goal.options[root], false); 
            buildOpts('s12', steps.rank_path, steps.rank_path.options, false);

            const labels = t[currentLang].onboarding.labels;
            
            // Leidensdruck (1-10): 1 = Wenig Leidensdruck (0 Stress), 10 = Viel Leidensdruck (100 Stress)
            setText('s5-label', steps.impact.title); setText('s5-title', steps.impact.question); setText('s5-min', '1 - ' + labels.not_urgent); setText('s5-max', '10 - ' + labels.very_urgent); setText('s5-btn', t[currentLang].onboarding.buttons.next); 
            let h5 = ''; for(let i=1; i<=10; i++) {
                const stressVal = ((i - 1) / 9) * 100; 
                h5 += `<button class="scale-btn" onclick="selectScale(this, 5, ${i}, 'distress', ${stressVal})">${i}</button>`;
            }
            document.getElementById('s5-options').innerHTML = h5;
            
            // Energy Skala (1-10): 1 = Wenig Energie (100 Stress), 10 = Viel Energie (0 Stress)
            setText('s6-label', steps.energy_level.title); setText('s6-title', steps.energy_level.question); setText('s6-min', '1 - ' + labels.no_energy); setText('s6-max', '10 - ' + labels.very_energetic); setText('s6-btn', t[currentLang].onboarding.buttons.next); 
            let h6 = ''; for(let i=1; i<=10; i++) {
                const stressVal = ((10 - i) / 9) * 100;
                h6 += `<button class="scale-btn" onclick="selectScale(this, 6, ${i}, 'energy', ${stressVal})">${i}</button>`;
            }
            document.getElementById('s6-options').innerHTML = h6;

            setText('loading-title', t[currentLang].onboarding.result.calculating); setText('loading-sub', t[currentLang].web.loadingSub);
            setText('res-label', t[currentLang].onboarding.result.title); setText('btn-res-next', t[currentLang].onboarding.buttons.next);

            const pitch = t[currentLang].web.pitch;
            setText('pitch-label', pitch.label); setText('pitch-headline', pitch.headline); setText('pitch-sub', pitch.sub); setText('pitch-title', pitch.title);

            setText('reg-label', reg.label); setText('reg-headline', reg.headline); setText('reg-sub', reg.sub); setText('btn-register', reg.btn);

        function selectScale(btn, stepNum, val, type, scoreWeight) {
            document.querySelectorAll(`#step-${stepNum} .scale-btn`).forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            setText(`s${stepNum}-desc-text`, `"${getScaleDesc(type, val)}"`);
            document.getElementById(`s${stepNum}-desc-box`).style.display = 'block'; document.getElementById(`s${stepNum}-btn`).style.display = 'block';
            saveAnswer('s' + stepNum, val, scoreWeight); 
        }

        function nextStep() {
            document.getElementById(`step-${currentStep}`).classList.remove('active');
            currentStep++;
            if (currentStep > 0 && currentStep !== 8 && currentStep !== 13 && currentStep !== 14) {
                document.getElementById('progressBar').style.width = `${Math.min((currentStep / 12) * 100, 100)}%`;
            }
            document.getElementById(`step-${currentStep}`).classList.add('active');

            if(currentStep === 8) {
                setTimeout(() => {
                    document.getElementById(`step-8`).classList.remove('active');
                    currentStep++;
                    
                    const calculatedScore = calculateFinalScore();
                    const tr = t[currentLang].onboarding.result;
                    
                    setText('res-score', `${calculatedScore}%`);
                    
                    let levelData;
                    let color;
                    
                    if (calculatedScore >= 86) { levelData = tr.levels.extreme; color = "#FF0000"; }
                    else if (calculatedScore >= 81) { levelData = tr.levels.dangerous; color = "#FF3333"; }
                    else if (calculatedScore >= 76) { levelData = tr.levels.alarming; color = "#FF6600"; }
                    else { levelData = tr.levels.critical; color = "#FFAA00"; }
                    
                    setText('res-title', levelData.title); 
                    setText('res-desc', `${levelData.sub}\n\n${levelData.desc}`);
                    
                    setText('res-cost-prefix', tr.cost_headline);
                    setText('res-cost-dynamic', tr.dynamicCost[answers['root']]);
                    
                    document.getElementById('res-score').style.color = color; 
                    document.getElementById('res-title').style.color = color; 
                    document.getElementById('resultCard').style.borderColor = color;
                    
                    document.getElementById(`step-${currentStep}`).classList.add('active');
                }, 3000);
            }
        }

        async function handleRegistration() {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const errEl = document.getElementById('reg-error');
            const btn = document.getElementById('btn-register');
            const regTexts = t[currentLang].web.reg;
            
            if(!email || password.length < 6) { errEl.innerText = regTexts.errFill; errEl.style.display = 'block'; return; }
            errEl.style.display = 'none'; btn.innerText = "Lädt..."; btn.disabled = true;

            const db = initSupabase();
            if (!db) { redirectToDigistore('guest_user_' + Math.floor(Math.random() * 10000)); return; }

            answers['calculated_stress_score'] = calculateFinalScore();

            const { data, error } = await db.auth.signUp({ 
                email, 
                password, 
                options: { 
                    data: { 
                        first_name: 'WebUser', 
                        is_over_21: true,
                        onboarding_data: answers 
                    } 
                } 
            });

            if (error) {
                if(error.message.includes('already registered')) {
                    const { data: signInData, error: signInError } = await db.auth.signInWithPassword({ email, password });
                    if(signInError) { errEl.innerText = regTexts.errExists; errEl.style.display = 'block'; btn.innerText = regTexts.btn; btn.disabled = false; return; }
                    redirectToDigistore(signInData.user.id);
                } else {
                    errEl.innerText = error.message; errEl.style.display = 'block'; btn.innerText = regTexts.btn; btn.disabled = false;
                }
            } else if (data.user) {
                redirectToDigistore(data.user.id);
            }
        }

        function redirectToDigistore(userId) {
            const digistoreBaseUrl = digistoreLinks[currentLang] || digistoreLinks['de'];
