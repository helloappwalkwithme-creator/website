<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --bg: #000000;
            --card: #121212;
            --border: #2A2A2A;
            --gold: #D4AF37;
            --gold-dim: rgba(212, 175, 55, 0.15);
            --text: #FFFFFF;
            --text-dim: #888888;
            --danger: #C62828;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background-color: var(--card);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            display: none; 
        }
        .progress-bar {
            height: 100%;
            background-color: var(--gold);
            width: 0%;
            transition: width 0.4s ease;
        }

        main {
            flex: 1;
            padding: 40px 20px;
            max-width: 600px;
            margin: 40px auto 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .step { display: none; animation: fadeIn 0.4s ease forwards; }
        .step.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .label-gold {
            color: var(--gold);
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 10px;
            text-align: center;
            line-height: 1.3;
            color: var(--text);
        }
        .subtitle {
            text-align: center; color: var(--text-dim); margin-bottom: 30px; font-size: 0.95rem; line-height: 1.5;
        }

        /* List Buttons */
        .option-btn {
            background-color: var(--card); border: 2px solid var(--border); color: var(--text);
            padding: 20px; border-radius: 12px; font-size: 1.05rem; margin-bottom: 15px;
            cursor: pointer; text-align: left; transition: all 0.2s ease; width: 100%; font-weight: 500;
            display: flex; justify-content: space-between; align-items: center; line-height: 1.4;
        }
        .option-btn:hover { border-color: #555; }
        .option-btn.selected { border-color: var(--gold); background-color: var(--gold-dim); color: var(--gold); font-weight: bold; }
        
        /* 1-10 Scale */
        .scale-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 10px; }
        .scale-btn {
            width: 45px; height: 45px; border-radius: 8px; border: 2px solid var(--border);
            background-color: var(--card); color: var(--text); font-size: 1.1rem; font-weight: bold;
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;
        }
        .scale-btn:hover { border-color: var(--gold); }
        .scale-btn.selected { background-color: var(--gold); color: #000; border-color: var(--gold); }

        .scale-labels { display: flex; justify-content: space-between; color: var(--text-dim); font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 20px; padding: 0 5px; }
        
        .desc-box { background: #1a1a1a; padding: 20px; border-radius: 8px; border-left: 3px solid var(--gold); display: none; margin-bottom: 20px; animation: fadeIn 0.3s ease; }
        .desc-text { margin: 0; color: #DDD; font-size: 0.95rem; font-style: italic; line-height: 1.5; }

        /* Result Card & Pitch */
        .result-card { background-color: #1a0000; padding: 40px 20px; border-radius: 16px; border: 3px solid #FF3333; text-align: center; margin-top: 20px; margin-bottom: 20px; }
        .result-score { font-size: 5rem; font-weight: 900; color: #FF3333; line-height: 1; margin-bottom: 10px; }
        .result-title { color: #FF3333; font-size: 1.5rem; font-weight: bold; letter-spacing: 1px; margin-bottom: 15px; }
        .result-desc { color: #CCC; font-size: 1.1rem; line-height: 1.5; }
        
        .pitch-card { margin-top: 20px; background-color: var(--card); padding: 25px 20px; border-radius: 12px; border: 1px solid var(--border); text-align: left; }
        .pitch-card ul { list-style: none; padding: 0; margin: 0; }
        .pitch-card li { margin-bottom: 12px; font-size: 1rem; color: #DDD; display: flex; align-items: flex-start; }
        .pitch-card li span { margin-right: 10px; color: var(--gold); }

        /* Actions */
        .btn-gold {
            background-color: var(--gold); color: #000; padding: 18px; border-radius: 10px;
            text-decoration: none; font-weight: 800; font-size: 1.1rem; text-transform: uppercase;
            letter-spacing: 1px; border: none; width: 100%; cursor: pointer; margin-top: 10px;
            text-align: center; display: block; transition: opacity 0.2s;
        }
        .btn-gold:active { opacity: 0.8; }
        .btn-gold:disabled { background-color: #333; color: #666; cursor: not-allowed; }

        .loading-screen { text-align: center; padding: 50px 0; }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--gold); border-radius: 50%;
            width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .disclaimer { color: var(--text-dim); font-size: 0.8rem; text-align: center; margin-top: 20px; }
    </style>
</head>

        // --- APP LOGIK ---
        let currentLang = null;
        let currentStep = 0;
        const totalSteps = 13; 
        const answers = {};

        // Fallback helper for scales
        function getScaleDesc(scaleType, value) {
            const tr = t[currentLang].scales[scaleType];
            if(scaleType === 'distress') {
                const root = answers['root'];
                if(value <= 3) return tr[root][1];
                if(value <= 6) return tr[root][4];
                if(value <= 8) return tr[root][7];
                return tr[root][10];
            } else {
                if(value <= 3) return tr[1];
                if(value <= 6) return tr[4];
                if(value <= 8) return tr[7];
                return tr[10];
            }
        }

        function selectLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('#step-0 .option-btn').forEach(btn => btn.classList.remove('selected'));
            document.getElementById(`lang-${lang}`).classList.add('selected');
            
            document.getElementById('lang-welcome').innerText = t[lang].lang.welcome;
            document.getElementById('lang-title').innerText = t[lang].lang.title;
            document.getElementById('lang-subtitle').innerText = t[lang].lang.subtitle;

            const btn = document.getElementById('btn-start');
            btn.disabled = false;
            btn.innerText = t[lang].lang.next;
        }

        function startOnboarding() {
            document.getElementById('progressContainer').style.display = 'block';
            buildStep1();
            nextStep();
        }

        function buildStep1() {
            const tr = t[currentLang];
            document.getElementById('s1-label').innerText = tr.step1.label;
            document.getElementById('s1-title').innerText = tr.step1.title;
            document.getElementById('s1-sub').innerText = tr.step1.sub;
            document.getElementById('s1-disclaimer').innerText = tr.step1.disclaimer;
            
            const div = document.getElementById('s1-options');
            div.innerHTML = '';
            for (const [key, val] of Object.entries(tr.opts.root)) {
                div.innerHTML += `<button class="option-btn" onclick="selectRoot('${key}')">${val}</button>`;
            }
        }

        function selectRoot(rootKey) {
            answers['root'] = rootKey;
            buildDynamicSteps();
            nextStep();
        }

        function buildDynamicSteps() {
            const tr = t[currentLang];
            const root = answers['root'];

            // 2. Freq
            document.getElementById('s2-label').innerText = tr.step2.label;
            document.getElementById('s2-title').innerText = tr.step2.title;
            document.getElementById('s2-sub').innerText = tr.step2.sub;
            document.getElementById('s2-options').innerHTML = '';
            tr.opts.freq[root].forEach(opt => {
                document.getElementById('s2-options').innerHTML += `<button class="option-btn" onclick="nextStep()">${opt}</button>`;
            });

            // 3. History
            document.getElementById('s3-label').innerText = tr.step3.label;
            document.getElementById('s3-title').innerText = tr.step3.title;
            document.getElementById('s3-sub').innerText = tr.step3.sub;
            document.getElementById('s3-options').innerHTML = '';
            tr.opts.hist.forEach(opt => {
                document.getElementById('s3-options').innerHTML += `<button class="option-btn" onclick="nextStep()">${opt}</button>`;
            });

            // 4. Pain
            document.getElementById('s4-label').innerText = tr.step4.label;
            document.getElementById('s4-title').innerText = tr.step4.title;
            document.getElementById('s4-sub').innerText = tr.step4.sub;
            document.getElementById('s4-options').innerHTML = '';
            tr.opts.pain[root].forEach(opt => {
                document.getElementById('s4-options').innerHTML += `<button class="option-btn" onclick="nextStep()">${opt}</button>`;
            });

            // 5. Distress
            document.getElementById('s5-label').innerText = tr.step5.label;
            document.getElementById('s5-title').innerText = tr.step5.title;
            document.getElementById('s5-sub').innerText = tr.step5.sub;
            document.getElementById('s5-min').innerText = tr.step5.min;
            document.getElementById('s5-max').innerText = tr.step5.max;
            document.getElementById('s5-btn').innerText = tr.step5.next;
            document.getElementById('s5-options').innerHTML = '';
            for(let i=1; i<=10; i++) {
                document.getElementById('s5-options').innerHTML += `<button class="scale-btn" onclick="selectScale(5, ${i}, 'distress')">${i}</button>`;
            }

            // 6. Energy
            document.getElementById('s6-label').innerText = tr.step6.label;
            document.getElementById('s6-title').innerText = tr.step6.title;
            document.getElementById('s6-sub').innerText = tr.step6.sub;
            document.getElementById('s6-min').innerText = tr.step6.min;
            document.getElementById('s6-max').innerText = tr.step6.max;
            document.getElementById('s6-btn').innerText = tr.step6.next;
            document.getElementById('s6-options').innerHTML = '';
            for(let i=1; i<=10; i++) {
                document.getElementById('s6-options').innerHTML += `<button class="scale-btn" onclick="selectScale(6, ${i}, 'energy')">${i}</button>`;
            }

            // 7. Time

            // 8. Loading & 9. Result

            document.getElementById('s11-sub').innerText = tr.step11.sub;
            document.getElementById('s11-options').innerHTML = '';
            tr.opts.goal[root].forEach(opt => {
                document.getElementById('s11-options').innerHTML += `<button class="option-btn" onclick="nextStep()">${opt}</button>`;
            });

            // 12. Rank Path
            document.getElementById('s12-label').innerText = tr.step12.label;
            document.getElementById('s12-title').innerText = tr.step12.title;
            document.getElementById('s12-sub').innerText = tr.step12.sub;
            document.getElementById('s12-options').innerHTML = '';
            tr.opts.rank.forEach(opt => {
                document.getElementById('s12-options').innerHTML += `<button class="option-btn" onclick="nextStep()">${opt}</button>`;
            });

            // 13. Pitch
            document.getElementById('pitch-label').innerText = tr.pitch.label;
            document.getElementById('pitch-headline').innerText = tr.pitch.headline;
            document.getElementById('pitch-sub').innerText = tr.pitch.sub;
            document.getElementById('pitch-title').innerText = tr.pitch.title;
            document.getElementById('pitch-1').innerText = tr.pitch.f1;
            document.getElementById('pitch-2').innerText = tr.pitch.f2;
            document.getElementById('pitch-3').innerText = tr.pitch.f3;
            document.getElementById('pitch-4').innerText = tr.pitch.f4;
            document.getElementById('btn-checkout').innerText = tr.pitch.btn;
        }

        function selectScale(stepNum, val, type) {
            // Update UI
            document.querySelectorAll(`#step-${stepNum} .scale-btn`).forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');
            
            // Text & Button einblenden
            const descText = getScaleDesc(type, val);
            document.getElementById(`s${stepNum}-desc-text`).innerText = `"${descText}"`;
            document.getElementById(`s${stepNum}-desc-box`).style.display = 'block';
            document.getElementById(`s${stepNum}-btn`).style.display = 'block';
        }

        function nextStep() {
            document.getElementById(`step-${currentStep}`).classList.remove('active');
            currentStep++;
            
            // Progress Bar (Ohne Ladebildschirm und Pitch)
            if (currentStep > 0 && currentStep !== 8 && currentStep !== 13) {
                const progress = (currentStep / (totalSteps - 2)) * 100;
                document.getElementById('progressBar').style.width = `${Math.min(progress, 100)}%`;
            }

            document.getElementById(`step-${currentStep}`).classList.add('active');

            // Lade-Screen Timer (Step 8)
            if(currentStep === 8) {
                setTimeout(() => {
                    document.getElementById(`step-8`).classList.remove('active');
                    currentStep++;
                    
                    const fakeScore = Math.floor(Math.random() * (96 - 78 + 1)) + 78;
                    const tr = t[currentLang];
                    
                    document.getElementById('res-score').innerText = `${fakeScore}%`;

                    let level;
                    let color;
                    if(fakeScore >= 85) {
                        level = tr.levels.extreme;
                        color = "#FF0000";
                    } else {
                        level = tr.levels.dangerous;
                        color = "#FF3333";
                    }

                    document.getElementById('res-title').innerText = level.t;
                    document.getElementById('res-desc').innerText = `${level.sub}\n\n${level.d}`;
                    document.getElementById('res-score').style.color = color;
                    document.getElementById('res-title').style.color = color;
                    document.getElementById('resultCard').style.borderColor = color;

                    document.getElementById(`step-${currentStep}`).classList.add('active');
                }, 3000); // Fake Ladezeit
            }
        }
    </script>
