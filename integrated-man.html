        .cost-dynamic { color: #FF3333; font-size: 1.2rem; font-weight: 800; margin: 0; line-height: 1.4; }

        function selectLanguage(lang) {
            currentLang = lang;

            const tr = t[currentLang];

            const buildOpts = (id, optsObj) => {

        async function handleRegistration() {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const errEl = document.getElementById('reg-error');
            const btn = document.getElementById('btn-register');
            const tr = t[currentLang];
            
            if(!email || password.length < 6) { errEl.innerText = tr.reg.errFill; errEl.style.display = 'block'; return; }
            errEl.style.display = 'none'; btn.innerText = "Lädt..."; btn.disabled = true;

            const db = initSupabase();
            if (!db) { redirectToDigistore('guest_user_' + Math.floor(Math.random() * 10000)); return; }

            const { data, error } = await db.auth.signUp({ email, password, options: { data: { first_name: 'WebUser', is_over_21: true } } });

            if (error) {
                if(error.message.includes('already registered')) {
                    const { data: signInData, error: signInError } = await db.auth.signInWithPassword({ email, password });

                } else {
                    errEl.innerText = error.message; errEl.style.display = 'block'; btn.innerText = tr.reg.btn; btn.disabled = false;
                }
            } else if (data.user) {
                redirectToDigistore(data.user.id);
            }
        }

            const digistoreBaseUrl = digistoreLinks[currentLang] || digistoreLinks['de'];
