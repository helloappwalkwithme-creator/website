<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.shiftmyhorizon.com/quiz/bible">
<title>Bible quiz</title>
<script src="/lang.js"></script>
<script>
(function () {
  var incoming = new URLSearchParams(location.search);
  var next = new URLSearchParams();
  ["invite", "aff"].forEach(function (key) {
    if (incoming.get(key)) next.set(key, incoming.get(key));
  });
  var explicit = (incoming.get("lang") || "").toLowerCase().split("-")[0];
  if (explicit === "de" || explicit === "en" || explicit === "es") next.set("lang", explicit);
  location.replace("/quiz/bible" + (next.toString() ? "?" + next.toString() : ""));
})();
</script>
</head>
<body>
<p><a href="/quiz/bible">Continue</a></p>
</body>
</html>
