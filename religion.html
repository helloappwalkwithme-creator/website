    <style>
        :root {
            --dark: #0d1117;
            --gray: #161b22;
            --gray-active: #21262d;
            --border: #30363d;
            --gold: #cba677; /* Alchemist Gold / Sand - neutral, spiritual */
            --text: #f0f6fc;
            --error: #f85149;
            --success: #3fb950;
            --action: #cba677;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body {
            margin: 0; padding: 0; background-color: var(--dark); color: var(--text);
            display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden;
        }

        .progress-container { width: 100%; height: 3px; background-color: #222; position: fixed; top: 0; left: 0; z-index: 100; display: block; }
        .progress-bar { height: 100%; background-color: var(--gold); width: 0%; transition: width 0.4s ease; }

        .app-header { width: 100%; max-width: 500px; margin: 0 auto; display: flex; justify-content: flex-end; padding: 20px 20px 0 20px; }
        .lang-switcher { background-color: var(--gray); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; outline: none; appearance: none; text-align: center; }
        .lang-switcher:focus { border-color: var(--gold); }

        main { flex: 1; padding: 20px 20px 100px 20px; max-width: 500px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; }

        .step { display: none; animation: fadeIn 0.4s ease forwards; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .flow-title { color: var(--gold); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }
        .h1-title { font-size: 26px; font-weight: 800; margin-top: 0; margin-bottom: 12px; color: var(--text); line-height: 1.35; }
        .subtitle { color: #8b949e; margin-bottom: 24px; font-size: 15px; line-height: 1.6; }

        .quiz-btn { background-color: var(--gray); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px; cursor: pointer; display: flex; align-items: center; transition: all 0.25s ease; }
        .quiz-btn.selected { border-color: var(--gold); background-color: var(--gray-active); }
        .opt-icon { font-size: 24px; margin-right: 16px; flex-shrink: 0; width: 30px; text-align: center; }
        .opt-body { flex: 1; padding-right: 12px; }
        .quiz-btn-main { color: var(--text); font-size: 16px; font-weight: 700; line-height: 1.4; }
        .quiz-btn.selected .quiz-btn-main { color: var(--gold); }
        .quiz-btn-desc { color: #8b949e; font-size: 13px; line-height: 1.5; margin-top: 3px; }

        .radio-icon { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #555; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .quiz-btn.selected .radio-icon { border-color: var(--gold); }
        .radio-icon::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); display: none; }
        .quiz-btn.selected .radio-icon::after { display: block; }

        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(13, 17, 23, 0.95); backdrop-filter: blur(8px); border-top: 1px solid var(--border); padding: 15px 20px 25px 20px; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .btn-gold { background-color: var(--gold); color: var(--dark); padding: 16px; border-radius: 8px; font-weight: 800; font-size: 14px; text-transform: uppercase; border: none; width: 100%; max-width: 460px; cursor: pointer; text-align: center; letter-spacing: 1.5px; transition: opacity 0.2s; }
        .btn-gold:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-back { background: none; border: none; color: #8b949e; margin-top: 12px; padding: 8px 16px; cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }

        .input-field { background-color: var(--gray); border: 1px solid var(--border); color: #fff; padding: 16px; border-radius: 8px; font-size: 15px; margin-bottom: 16px; width: 100%; font-family: -apple-system, sans-serif; font-weight: 500;}
        .input-field:focus { border-color: var(--gold); outline: none; }

        .legal-disclaimer { font-size: 12px; color: #8b949e; margin-top: 20px; line-height: 1.6; text-align: center; border-top: 1px solid var(--border); padding-top: 15px; font-family: -apple-system, sans-serif; }
        .legal-disclaimer strong { color: var(--gold); font-weight: 600; }

        .legal-footer { text-align: center; padding: 20px; margin-top: auto; border-top: 1px solid var(--border); font-size: 11px; padding-bottom: 120px; font-family: -apple-system, sans-serif;}
        .legal-footer a { color: #8b949e; text-decoration: none; margin: 0 8px; transition: color 0.2s; }
        .legal-footer a:hover { color: var(--gold); }
    </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-523HRG3C"

    <div class="progress-container" id="progressContainer"><div class="progress-bar" id="progressBar" style="width: 0%;"></div></div>

    <header class="app-header">
        <select id="langSelect" class="lang-switcher" onchange="selectLang(this.value)">
            <option value="de">🇩🇪 DE</option>
            <option value="en">🇺🇸 EN</option>
            <option value="es">🇪🇸 ES</option>
        </select>
    </header>

    <main id="app-container">
        <!-- STEP 1: Religion / Weg auswählen -->
        <div class="step active" id="step-1">
            <div class="flow-title" id="s1-lbl"></div>
            <h1 class="h1-title" id="s1-title"></h1>
            <p class="subtitle" id="s1-sub"></p>
            <div id="s1-opts"></div>
        </div>

        <!-- STEP 2: Registrierung -->
        <div class="step" id="step-2">
            <div style="text-align: center;">
                <div class="flow-title" id="s2-lbl"></div>
                <h1 class="h1-title" id="s2-title"></h1>
                <p class="subtitle" id="s2-sub"></p>
            </div>

            <div class="flow-title" id="lbl-fname"></div>
            <input type="text" id="reg-fname" class="input-field" placeholder="">

            <div class="flow-title" id="lbl-email"></div>
            <input type="email" id="reg-email" class="input-field" autocomplete="email" placeholder="">

            <div class="flow-title" id="lbl-channel"></div>
            <select id="reg-channel" class="input-field" style="appearance: none; cursor: pointer;">
                <option value="whatsapp">WhatsApp</option>
                <option value="telegram">Telegram</option>
            </select>

            <button class="btn-gold" id="btn-register" onclick="handleRegistration()" style="margin-top: 10px; max-width: 100%;"></button>
            <p id="reg-error" style="color: var(--error); text-align: center; display: none; font-weight: bold; margin-top: 15px;"></p>

            <p class="legal-disclaimer" id="s2-disclaimer"></p>
        </div>
    </main>

    <footer class="legal-footer">
        <a href="impressum.html" id="link-imp">Impressum</a> |
        <a href="datenschutz.html" id="link-dat">Datenschutz</a> |
        <a href="agb.html" id="link-agb">AGB</a> |
        <a href="cookie.html" id="link-cook">Cookie-Richtlinie</a>
    </footer>

    <div class="bottom-bar" id="bottomBar" style="display: none;">
        <button class="btn-back" id="btnBack" onclick="handleBack()"></button>
    </div>

    <script>
        const SUPABASE_URL = 'https://jztwnumtwihomgxwlwor.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_yWcwDruITLbaok1rBl4Fiw_Ddjn9xZe';
        let supabaseClient = null;

        const waNumber = "491632225456";
        const tgBotName = "shiftmyhorizonbot";

        // Vorauswahl -> exakter Content-Flow in Supabase.
        // p_source ist bewusst NICHT in map_flow_name gemappt, damit register_lead
        // auf p_flow_name (den exakten Content-Flow) zurueckfaellt.
        const RELIGIONS = [
            { key: 'bible',    flow: 'bible_flow',     icon: '✝️' },
            { key: 'islam',    flow: 'islam_flow',     icon: '☪️' },
            { key: 'buddhism', flow: 'buddhism_flow',  icon: '☸️' },
            { key: 'secular',  flow: 'secular_flow',   icon: '✨' }
        ];

        const accessLabels = {
            de: "Mein Zugangscode:",
            en: "My access code:",
            es: "Mi código de acceso:"
        };

        const t = {
            de: {
                pageTitle: "Dein Weg - Onboarding",
                btn: { back: "ZURÜCK", pay: "ZUM 4-TAGE-FLOW" },
                s1: {
                    lbl: "SCHRITT 1: DEIN WEG",
                    title: "Von welcher Lehre möchtest du lernen?",
                    sub: "Wähle den Weg, auf dem wir dich in den nächsten 4 Tagen kostenlos begleiten dürfen."
                },
                rel: {
                    bible:    { name: "Christentum",                  desc: "Weisheit & Führung aus der Bibel." },
                    islam:    { name: "Islam",                        desc: "Weisheit & Führung aus dem Koran." },
                    buddhism: { name: "Buddhismus",                   desc: "Achtsamkeit & die Lehre des Buddha." },
                    secular:  { name: "Spiritualität ohne Religion",  desc: "Ein spiritueller Weg – ganz ohne Konfession." }
                },
                s2: {
                    lbl: "DER NÄCHSTE SCHRITT",
                    title: "Dein kostenloser 4-Tage-Flow",
                    sub: "Sichere dir deinen Zugang und wir starten gemeinsam.",
                    lblFname: "VORNAME", lblEmail: "EMAIL", lblChannel: "AUSLIEFERUNG ÜBER",
                    em: "deine@email.com",
                    errFill: "Bitte fülle alle Felder aus.",
                    errServer: "Ein Fehler ist aufgetreten. Bitte versuche es noch einmal.",
                    placeholders: { fname: "Dein Vorname" },
                    disclaimer: "<strong>Wichtig:</strong> Deine Daten werden zu 100% ausschließlich für die automatisierte Bereitstellung dieses Flows genutzt. Wir geben niemals Daten an Dritte weiter. Dein Vertrauen ist unser höchstes Gut."
                },
                botMsg: "Hallo, ich möchte meinen kostenlosen 4-Tage-Flow «{name}» starten. Bitte aktiviere meinen Zugang.",
                legal: { imp: "Impressum", dat: "Datenschutz", agb: "AGB", cook: "Cookie-Richtlinie" }
            },
            en: {
                pageTitle: "Your Path - Onboarding",
                btn: { back: "BACK", pay: "START 4-DAY FLOW" },
                s1: {
                    lbl: "STEP 1: YOUR PATH",
                    title: "Which teaching would you like to learn from?",
                    sub: "Choose the path we may guide you on — free of charge for the next 4 days."
                },
                rel: {
                    bible:    { name: "Christianity",                 desc: "Wisdom & guidance from the Bible." },
                    islam:    { name: "Islam",                        desc: "Wisdom & guidance from the Quran." },
                    buddhism: { name: "Buddhism",                     desc: "Mindfulness & the teaching of the Buddha." },
                    secular:  { name: "Spirituality without religion", desc: "A spiritual path — free of any denomination." }
                },
                s2: {
                    lbl: "THE NEXT STEP",
                    title: "Your free 4-Day Flow",
                    sub: "Secure your access and let's begin together.",
                    lblFname: "FIRST NAME", lblEmail: "EMAIL", lblChannel: "DELIVERY VIA",
                    em: "your@email.com",
                    errFill: "Please fill in all fields.",
                    errServer: "An error occurred. Please try again.",
                    placeholders: { fname: "Your First Name" },
                    disclaimer: "<strong>Important:</strong> Your data will 100% only be used for the automated delivery of this flow. We will never share your data with third parties. Your trust is sacred to us."
                },
                botMsg: "Hello, I would like to start my free 4-day «{name}» flow. Please activate my access.",
                legal: { imp: "Imprint", dat: "Privacy Policy", agb: "Terms & Conditions", cook: "Cookie Policy" }
            },
            es: {
                pageTitle: "Tu Camino - Incorporación",
                btn: { back: "ATRÁS", pay: "INICIAR FLUJO DE 4 DÍAS" },
                s1: {
                    lbl: "PASO 1: TU CAMINO",
                    title: "¿De qué enseñanza te gustaría aprender?",
                    sub: "Elige el camino en el que podemos acompañarte — gratis durante los próximos 4 días."
                },
                rel: {
                    bible:    { name: "Cristianismo",                 desc: "Sabiduría y guía de la Biblia." },
                    islam:    { name: "Islam",                        desc: "Sabiduría y guía del Corán." },
                    buddhism: { name: "Budismo",                      desc: "Atención plena y la enseñanza de Buda." },
                    secular:  { name: "Espiritualidad sin religión",  desc: "Un camino espiritual, sin ninguna confesión." }
                },
                s2: {
                    lbl: "EL PRÓXIMO PASO",
                    title: "Tu Flujo gratuito de 4 Días",
                    sub: "Asegura tu acceso y comencemos juntos.",
                    lblFname: "NOMBRE", lblEmail: "EMAIL", lblChannel: "ENTREGA VÍA",
                    em: "tu@email.com",
                    errFill: "Por favor, completa todos los campos.",
                    errServer: "Ha ocurrido un error. Por favor, inténtalo de nuevo.",
                    placeholders: { fname: "Tu Nombre" },
                    disclaimer: "<strong>Importante:</strong> Tus datos se utilizarán 100% exclusivamente para la entrega automatizada de este flujo. Nunca compartiremos tus datos con terceros. Tu confianza es sagrada para nosotros."
                },
                botMsg: "Hola, me gustaría iniciar mi flujo gratuito de 4 días «{name}». Por favor, activa mi acceso.",
                legal: { imp: "Aviso Legal", dat: "Privacidad", agb: "Términos", cook: "Cookies" }
            }
        };

        let currentLang = localStorage.getItem('smh_language');
        if (!currentLang || !t[currentLang]) { currentLang = 'de'; }

        let step = 1;
        let chosen = null; // { key, flow }

        const bBar = document.getElementById('bottomBar');
        const pBar = document.getElementById('progressBar');

        function updateTexts() {
            const l = t[currentLang];
            document.documentElement.lang = currentLang;
            document.title = l.pageTitle;

            document.getElementById('btnBack').innerText = l.btn.back;

            document.getElementById('s1-lbl').innerText = l.s1.lbl;
            document.getElementById('s1-title').innerText = l.s1.title;
            document.getElementById('s1-sub').innerText = l.s1.sub;

            document.getElementById('s2-lbl').innerText = l.s2.lbl;
            document.getElementById('s2-title').innerText = l.s2.title;
            document.getElementById('s2-sub').innerText = l.s2.sub;

            document.getElementById('lbl-fname').innerText = l.s2.lblFname;
            document.getElementById('lbl-email').innerText = l.s2.lblEmail;
            document.getElementById('lbl-channel').innerText = l.s2.lblChannel;

            document.getElementById('reg-fname').placeholder = l.s2.placeholders.fname;
            document.getElementById('reg-email').placeholder = l.s2.em;

            document.getElementById('btn-register').innerText = l.s2.pay || l.btn.pay;
            document.getElementById('s2-disclaimer').innerHTML = l.s2.disclaimer;

            document.getElementById('link-imp').innerText = l.legal.imp;
            document.getElementById('link-dat').innerText = l.legal.dat;
            document.getElementById('link-agb').innerText = l.legal.agb;
            document.getElementById('link-cook').innerText = l.legal.cook;
        }

        function buildOptions() {
            const l = t[currentLang];
            const el = document.getElementById('s1-opts');
            el.innerHTML = '';
            RELIGIONS.forEach(r => {
                const info = l.rel[r.key];
                const isSelected = chosen && chosen.key === r.key;

                const div = document.createElement('div');
                div.className = `quiz-btn ${isSelected ? 'selected' : ''}`;
                div.onclick = () => {
                    chosen = { key: r.key, flow: r.flow };
                    buildOptions();
                    setTimeout(() => goToStep(2), 300);
                };

                const icon = document.createElement('div');
                icon.className = 'opt-icon';
                icon.innerText = r.icon;

                const body = document.createElement('div');
                body.className = 'opt-body';
                const main = document.createElement('div');
                main.className = 'quiz-btn-main';
                main.innerText = info.name;
                const desc = document.createElement('div');
                desc.className = 'quiz-btn-desc';
                desc.innerText = info.desc;
                body.appendChild(main);
                body.appendChild(desc);

                const radio = document.createElement('div');
                radio.className = 'radio-icon';

                div.appendChild(icon);
                div.appendChild(body);
                div.appendChild(radio);
                el.appendChild(div);
            });
        }

        function goToStep(n) {
            document.getElementById(`step-${step}`).classList.remove('active');
            step = n;
            document.getElementById(`step-${step}`).classList.add('active');
            pBar.style.width = `${(step / 2) * 100}%`;
            bBar.style.display = (step === 2) ? 'flex' : 'none';
            window.scrollTo(0, 0);
        }

        function handleBack() {
            if (step === 2) goToStep(1);
        }

        function selectLang(lang) {
            currentLang = lang;
            localStorage.setItem('smh_language', lang);
            updateTexts();
            buildOptions();
        }

        window.onload = () => {
            document.getElementById('langSelect').value = currentLang;
            updateTexts();
            buildOptions();
            pBar.style.width = '50%';
        };

        function generateAccessCode() {
            const p1 = Math.random().toString(36).substring(2, 6).toUpperCase();
            const p2 = Math.random().toString(36).substring(2, 6).toUpperCase();
            return p1 + '-' + p2;
        }

        async function handleRegistration() {
            const l = t[currentLang];
            const fname = document.getElementById('reg-fname').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const channel = document.getElementById('reg-channel').value;
            const errEl = document.getElementById('reg-error');
            const btn = document.getElementById('btn-register');

            if (!chosen) { goToStep(1); return; }
            if (!email || !fname) { errEl.innerText = l.s2.errFill; errEl.style.display = 'block'; return; }
            errEl.style.display = 'none'; btn.disabled = true; btn.innerText = "...";

            const accessCode = generateAccessCode();
            const onboarding = { chosen_religion: chosen.key, root_problem: chosen.key };

            try {
                if (!supabaseClient) {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                }

                const { error: rpcError } = await supabaseClient.rpc('register_lead', {
                    p_email: email,
                    p_first_name: fname,
                    p_delivery_channel: channel,
                    p_source: 'religion_selector',
                    p_language: currentLang,
                    p_onboarding_data: onboarding,
                    p_access_code: accessCode,
                    p_chosen_path: chosen.key,
                    p_flow_name: chosen.flow
                });

                if (rpcError) throw rpcError;

                const relName = l.rel[chosen.key].name;
                const baseMessage = l.botMsg.replace('{name}', relName);
                const accessLabel = accessLabels[currentLang] || accessLabels['de'];
                const finalMessage = `${baseMessage}\n\n${accessLabel} ${accessCode}`;
                const encodedMessage = encodeURIComponent(finalMessage);

                if (channel === 'telegram') {
                    window.location.href = `https://t.me/${tgBotName}?text=${encodedMessage}`;
                } else {
                    window.location.href = `https://wa.me/${waNumber}?text=${encodedMessage}`;
                }
            } catch (e) {
                console.error("Error:", e);
                errEl.innerText = l.s2.errServer;
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.innerText = l.s2.pay || l.btn.pay;
            }
        }
    </script>
</body>
</html>
