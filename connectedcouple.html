        main { flex: 1; padding: 20px 20px 100px 20px; max-width: 500px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; }
        
        .step { display: none; animation: fadeIn 0.4s ease forwards; }

        .quiz-btn.selected .quiz-btn-text { color: var(--gold); font-weight: 600; }
        
        .radio-icon { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #777; display: flex; align-items: center; justify-content: center; }
        .quiz-btn.selected .radio-icon { border-color: var(--gold); }
        .radio-icon::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); display: none; }
        .quiz-btn.selected .radio-icon::after { display: block; }

        .check-icon { width: 22px; height: 22px; border-radius: 4px; border: 1px solid #777; display: flex; align-items: center; justify-content: center; color: transparent; font-size: 13px; }
        .quiz-btn.selected .check-icon { border-color: var(--gold); background: var(--gold); color: var(--dark); }

                    lbl: "EL PRÓXIMO PASO", 
                    title: "Tu Flujo de 4 Días", 
                    sub: "Recibe impulsos profundos y tareas concretas directamente en tu messenger durante 4 días, totalmente gratis. Sin spam, sin desvíos.",
                    lblFname: "NOMBRE", lblEmail: "EMAIL", lblChannel: "ENTREGA VÍA",
                    em: "tu@email.com", 
                    errFill: "Por favor, completa todos los campos.", errExists: "Este correo ya existe.",
                    errServer: "Ha ocurrido un error. Por favor, inténtalo de nuevo más tarde.",
                    placeholders: { fname: "Tu Nombre" },
                    disclaimer: "<strong>Importante:</strong> Tus datos se utilizarán 100% exclusivamente para la entrega automatizada de este curso. Nunca compartiremos tus datos con terceros. Tu confianza es sagrada para nosotros."
                },
                legal: { imp: "Aviso Legal", dat: "Privacidad", agb: "Términos", cook: "Cookies" }
            }
        };

        // Sicherheits-Check für die Sprache
        let currentLang = localStorage.getItem('smh_language');
        if (!currentLang || !t[currentLang]) {
            currentLang = 'de';
        }
        
        let step = 1;
        let answers = { root_problem: '', pain_point: [], anxiety: '', avoidance: '' }; 
        
        const bBar = document.getElementById('bottomBar'), bNext = document.getElementById('btnNext'), pBar = document.getElementById('progressBar'), pCont = document.getElementById('progressContainer');

        function updateTexts() {
            const l = t[currentLang];
            document.documentElement.lang = currentLang;
            document.title = l.pageTitle;
            
            bNext.innerText = l.btn.next; document.getElementById('btnBack').innerText = l.btn.back;
            
            document.getElementById('s1-lbl').innerText = l.s1.lbl; document.getElementById('s1-title').innerText = l.s1.title;
            document.getElementById('s2-lbl').innerText = l.s2.lbl; document.getElementById('s2-title').innerText = l.s2.title;
            document.getElementById('s3-lbl').innerText = l.s3.lbl; document.getElementById('s3-title').innerText = l.s3.title;
            document.getElementById('s4-lbl').innerText = l.s4.lbl; document.getElementById('s4-title').innerText = l.s4.title;
            document.getElementById('s5-title').innerText = l.s5.title; document.getElementById('s5-sub').innerText = l.s5.sub;
            
            document.getElementById('s6-lbl').innerText = l.s6.lbl; 
            
            document.getElementById('s7-lbl').innerText = l.s7.lbl; 
            document.getElementById('s7-title').innerText = l.s7.title; 
            document.getElementById('s7-sub').innerText = l.s7.sub;
            
            document.getElementById('lbl-fname').innerText = l.s7.lblFname;
            document.getElementById('lbl-email').innerText = l.s7.lblEmail;
            document.getElementById('lbl-channel').innerText = l.s7.lblChannel;
            
            document.getElementById('reg-fname').placeholder = l.s7.placeholders.fname;
            document.getElementById('reg-email').placeholder = l.s7.em; 
            
            document.getElementById('btn-register').innerText = l.btn.pay;
            if(l.s7.disclaimer) {
                document.getElementById('s7-disclaimer').innerHTML = l.s7.disclaimer;
            }

            document.getElementById('link-imp').innerText = l.legal.imp;
            document.getElementById('link-dat').innerText = l.legal.dat;
            document.getElementById('link-agb').innerText = l.legal.agb;
            document.getElementById('link-cook').innerText = l.legal.cook;
        }

        window.onload = () => { 
            document.getElementById('langSelect').value = currentLang;
            updateTexts(); buildOptions(); pBar.style.width = `${(1 / 6) * 100}%`; 
        };

        function selectLang(lang) { 
            currentLang = lang; localStorage.setItem('smh_language', lang);
            updateTexts(); buildOptions(); if (step === 6) renderResult(); 
        }

        function createOptionBtn(text, isSelected, isMulti, onClick) {
            const div = document.createElement('div'); div.className = `quiz-btn ${isSelected ? 'selected' : ''}`; div.onclick = onClick;
            const textDiv = document.createElement('div'); textDiv.className = 'quiz-btn-text'; textDiv.innerText = text;
            const iconDiv = document.createElement('div'); iconDiv.className = isMulti ? 'check-icon' : 'radio-icon';
            if (isMulti) iconDiv.innerText = '✓';
            div.appendChild(textDiv); div.appendChild(iconDiv); return div;
        }

        function buildOptions() {
            const l = t[currentLang], root = answers.root_problem;
            const build = (id, opts, key, multi) => {
                const el = document.getElementById(id); el.innerHTML = '';
                Object.entries(opts).forEach(([k, v]) => {
                    const isSelected = multi ? answers[key].includes(v) : answers[key] === k;
                    el.appendChild(createOptionBtn(v, isSelected, multi, () => {
                        if(multi) {
                            const idx = answers[key].indexOf(v);
                            if (idx > -1) answers[key].splice(idx, 1); else answers[key].push(v);
                            buildOptions(); checkNextState();
                        } else {
                            answers[key] = k; buildOptions(); checkNextState();
                            setTimeout(() => handleNext(), 350); 
                        }
                    }));
                });
            };
            build('s1-opts', l.s1.opts, 'root_problem', false);
            build('s2-opts', l.s2.opts[root] || {}, 'pain_point', true); 
            build('s3-opts', l.s3.opts, 'anxiety', false);
            build('s4-opts', l.s4.opts, 'avoidance', false);
        }

        function checkNextState() {
            bNext.disabled = (step === 2 && answers.pain_point.length === 0);
        }

        function renderResult() {
            const res = t[currentLang].s6;
            let lvl;
            
            // Korrekte Zuweisung des Bindungstyps
            if (answers.anxiety === 'low' && answers.avoidance === 'low') {
                lvl = res.lvls.sec;
            } else if (answers.anxiety === 'high' && answers.avoidance === 'low') {
                lvl = res.lvls.anx;
            } else if (answers.avoidance === 'high' && answers.anxiety !== 'high') {
                lvl = res.lvls.avo;
            } else {
                lvl = res.lvls.dis; 
            }

            document.getElementById('s6-lbl').innerText = res.lbl;
            document.getElementById('res-score').innerText = lvl.t; 
            document.getElementById('res-level').innerText = lvl.d; 
            document.getElementById('res-cost-lbl').innerText = res.costLbl; 
            document.getElementById('res-cost-val').innerText = res.costVal[answers.root_problem];
            document.getElementById('s6-msg').innerText = res.msg;
        }

        function handleNext() {
            document.getElementById(`step-${step}`).classList.remove('active'); step++;
            document.querySelector('.progress-container').style.display = (step < 7 && step !== 5 && step !== 6) ? 'block' : 'none';
            pBar.style.width = `${((step - 1) / 6) * 100}%`;
            
            bBar.style.display = (step === 2 || step === 6) ? 'flex' : 'none';
            if(step === 6) bNext.innerText = t[currentLang].btn.next;
            checkNextState();
            
            document.getElementById(`step-${step}`).classList.add('active'); window.scrollTo(0,0);
            if(step === 5) setTimeout(() => { handleNext(); renderResult(); }, 2000);
        }

        function handleBack() {
            document.getElementById(`step-${step}`).classList.remove('active');
            step = Math.max(1, step === 6 ? 4 : step - 1);
            document.getElementById(`step-${step}`).classList.add('active');
            document.querySelector('.progress-container').style.display = 'block';
            pBar.style.width = `${((step - 1) / 6) * 100}%`;
            bBar.style.display = (step === 2) ? 'flex' : 'none';
            checkNextState(); window.scrollTo(0,0);
        }

        async function handleRegistration() {
            const fname = document.getElementById('reg-fname').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const channel = document.getElementById('reg-channel').value;
            const errEl = document.getElementById('reg-error');
            const btn = document.getElementById('btn-register'); 
            
            if(!email || !fname) { errEl.innerText = t[currentLang].s7.errFill; errEl.style.display = 'block'; return; }
            errEl.style.display = 'none'; btn.disabled = true; btn.innerText = "...";

            try {
                if (!supabaseClient) {
                    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                }

                const { data, error } = await supabaseClient.from('leads').insert([
                    { 
                        email: email, 
                        first_name: fname, 
                        delivery_channel: channel,
                        source: 'connected_couples_flow',
                        language: currentLang,
                        marketing_consent: true,
                        onboarding_data: answers,
                        has_paid: false,
                        current_mentoring_day: 1
                    }
                ]).select();

                if (error) throw error;
                
                const leadId = data[0].id;
                
                if(channel === 'telegram') {
                    window.location.href = `${botLinks.telegram}${leadId}`;
                } else {
                    window.location.href = `${botLinks.whatsapp}${leadId}`;
                }
            } catch(e) {
                console.error("Fehler beim Speichern:", e);
                errEl.innerText = t[currentLang].s7.errServer; 
                errEl.style.display = 'block';
                btn.disabled = false;
                btn.innerText = t[currentLang].btn.pay;
            }
        }
    </script>
</body>
</html>
