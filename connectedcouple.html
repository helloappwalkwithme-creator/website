<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connected Couples - Onboarding</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            /* Warm, grounded color palette for couples */
            --dark: #1a1715;
            --gray: #292421;
            --gray-active: #3a322d;
            --border: #4a403a;
            --gold: #d48a60; /* Terracotta/Amber */
            --text: #f0ebeb;
            --error: #d46060;
            --success: #88b08b;
            --energy: #e6b87c;
            --time: #88b08b;
        }

        * { box-sizing: border-box; font-family: "Georgia", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            margin: 0; 
            padding: 0; 
            background-color: var(--dark); 
            color: var(--text); 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            overflow-x: hidden; 
        }
        
        .progress-container { width: 100%; height: 3px; background-color: #222; position: fixed; top: 0; left: 0; z-index: 100; display: block; }
        .progress-bar { height: 100%; background-color: var(--gold); width: 0%; transition: width 0.4s ease-in-out; }

        .app-header {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: flex-end;
            padding: 20px 20px 0 20px;
        }
        .lang-switcher {
            background-color: var(--gray);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            text-align: center;
        }
        .lang-switcher:focus { border-color: var(--gold); }

        main { 
            flex: 1; 
            padding: 20px 20px 100px 20px; 
            max-width: 500px; 
            margin: 0 auto; 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
        }
        
        .step { display: none; animation: fadeIn 0.4s ease forwards; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .flow-title { color: var(--gold); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
        .h1-title { font-size: 24px; font-weight: 400; margin-top: 0; margin-bottom: 24px; color: var(--text); line-height: 1.4; letter-spacing: 0.5px; }
        .subtitle { color: #bbbbbb; margin-bottom: 24px; font-size: 15px; line-height: 1.6; }

        .quiz-btn { 
            background-color: var(--gray); 
            border: 1px solid var(--border); 
            border-radius: 10px; 
            padding: 16px 20px; 
            margin-bottom: 12px; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            transition: all 0.25s ease; 
        }
        .quiz-btn.selected { border-color: var(--gold); background-color: var(--gray-active); }
        .quiz-btn-text { color: var(--text); font-size: 14px; flex: 1; padding-right: 15px; line-height: 1.5; font-weight: 400; }
        .quiz-btn.selected .quiz-btn-text { color: var(--gold); font-weight: 600; }
        
        .radio-icon { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #777; display: flex; align-items: center; justify-content: center; }
        .quiz-btn.selected .radio-icon { border-color: var(--gold); }
        .radio-icon::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); display: none; }
        .quiz-btn.selected .radio-icon::after { display: block; }

        .check-icon { width: 22px; height: 22px; border-radius: 4px; border: 1px solid #777; display: flex; align-items: center; justify-content: center; color: transparent; font-size: 13px; }
        .quiz-btn.selected .check-icon { border-color: var(--gold); background: var(--gold); color: var(--dark); }

        .assessment-block { background: var(--gray); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 15px; }
        .ass-label { color: var(--gold); font-size: 11px; text-transform: uppercase; font-weight: 600; letter-spacing: 1px; margin-bottom: 10px; text-align: center; }
        .ass-value { font-size: 36px; font-weight: 400; text-align: center; margin-bottom: 8px; }
        .ass-desc { color: #bbb; font-size: 13px; text-align: center; margin-bottom: 12px; min-height: 18px; line-height: 1.5; }
        .counter-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 15px; }
        .counter-btn { background: #151311; border: 1px solid var(--border); color: inherit; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: 300; }
        .counter-btn:active { background: #333; }
        .scale-hints { display: flex; justify-content: space-between; font-size: 11px; color: #888; margin-top: 8px; }

        .result-card { background-color: #241a1a; border: 2px solid var(--error); border-radius: 12px; padding: 30px 20px; text-align: center; margin-bottom: 16px; }
        .result-score { color: var(--error); font-size: 32px; font-weight: 600; line-height: 1.2; margin-bottom: 5px;}
        .result-level { color: #e8a5a5; font-size: 14px; font-weight: 400; text-transform: uppercase; letter-spacing: 2px; }
        
        .insight-card { background: var(--gray); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 12px; }
        .insight-title { color: #dcdcdc; font-size: 11px; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        .insight-text { color: #c4c4c4; font-size: 14px; line-height: 1.6; }
        
        .info-card { background: #211d1a; border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 12px; }

        .check-row { display: flex; align-items: flex-start; margin-top: 15px; margin-bottom: 10px; cursor: pointer; }
        .box-icon { width: 22px; height: 22px; border: 1px solid var(--gold); border-radius: 4px; margin-right: 12px; margin-top: 2px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: transparent; font-size: 13px;}
        .check-row.selected .box-icon { background: var(--gold); color: var(--dark); }
        .check-label { font-size: 14px; color: var(--text); line-height: 1.6; flex: 1; }

        .bottom-bar { 
            position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(26, 23, 21, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border); padding: 15px 20px 25px 20px; display: flex; flex-direction: column; align-items: center; z-index: 10; 
        }
        .btn-gold { 
            background-color: var(--gold); color: var(--dark); padding: 16px; border-radius: 8px; font-weight: 600; font-size: 14px; text-transform: uppercase; border: none; width: 100%; max-width: 460px; cursor: pointer; text-align: center; letter-spacing: 1.5px; 
        }
        .btn-gold:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-back { background: none; border: none; color: #999; margin-top: 12px; padding: 8px 16px; cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }

        .input-field { background-color: #292421; border: 1px solid var(--border); color: #fff; padding: 16px; border-radius: 8px; font-size: 15px; margin-bottom: 16px; width: 100%; font-weight: 400; }
        .input-field:focus { border-color: var(--gold); outline: none; }
        .name-grid { display: flex; gap: 10px; }
        .name-grid .input-field { margin-bottom: 10px; }

        .spinner { border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 60px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="progress-container" id="progressContainer"><div class="progress-bar" id="progressBar" style="width: 0%;"></div></div>

    <header class="app-header">
        <select id="langSelect" class="lang-switcher" onchange="selectLang(this.value)">
            <option value="de">🇩🇪 DE</option>
            <option value="en">🇺🇸 EN</option>
            <option value="es">🇪🇸 ES</option>
        </select>
    </header>

    <main id="app-container">
        <div class="step active" id="step-1">
            <div class="flow-title" id="s1-lbl"></div><h1 class="h1-title" id="s1-title"></h1>
            <div id="s1-opts"></div>
        </div>

        <div class="step" id="step-2">
            <div class="flow-title" id="s2-lbl"></div><h1 class="h1-title" id="s2-title"></h1>
            <div id="s2-opts"></div>
        </div>

        <div class="step" id="step-3">
            <div class="flow-title" id="s3-lbl"></div><h1 class="h1-title" id="s3-title"></h1>
            <div id="s3-opts"></div>
        </div>

        <div class="step" id="step-4">
            <div class="flow-title" id="s4-lbl"></div><h1 class="h1-title" id="s4-title"></h1>
            <div id="s4-opts"></div>
        </div>

        <div class="step" id="step-5">
            <div class="flow-title" id="s5-lbl"></div><h1 class="h1-title" id="s5-title"></h1>
            
            <div class="assessment-block">
                <div class="ass-label" id="s5-lbl-anx"></div>
                <div class="ass-value" id="val-anx" style="color: var(--error);">5</div>
                <div class="ass-desc" id="desc-anx"></div>
                <div class="counter-row">
                    <button class="counter-btn" style="color: var(--error);" onclick="adjCounter('anx', -1)">−</button>
                    <button class="counter-btn" style="color: var(--error);" onclick="adjCounter('anx', 1)">+</button>
                </div>
                <div class="scale-hints"><span id="hint-anx-min"></span><span id="hint-anx-max"></span></div>
            </div>

            <div class="assessment-block">
                <div class="ass-label" id="s5-lbl-avo"></div>
                <div class="ass-value" id="val-avo" style="color: var(--gold);">5</div>
                <div class="ass-desc" id="desc-avo"></div>
                <div class="counter-row">
                    <button class="counter-btn" style="color: var(--gold);" onclick="adjCounter('avo', -1)">−</button>
                    <button class="counter-btn" style="color: var(--gold);" onclick="adjCounter('avo', 1)">+</button>
                </div>
                <div class="scale-hints"><span id="hint-avo-min"></span><span id="hint-avo-max"></span></div>
            </div>

            <div class="assessment-block">
                <div class="ass-label" id="s5-lbl-tim"></div>
                <div class="ass-value" id="val-tim" style="color: var(--success);">30</div>
                <div class="ass-desc" id="desc-tim"></div>
                <div class="counter-row">
                    <button class="counter-btn" style="color: var(--success);" onclick="adjCounter('tim', -5)">−</button>
                    <button class="counter-btn" style="color: var(--success);" onclick="adjCounter('tim', 5)">+</button>
                </div>
                <div class="scale-hints"><span id="hint-tim-min">0 min</span><span id="hint-tim-max">120 min</span></div>
            </div>
        </div>

        <div class="step" id="step-6" style="text-align: center; padding-top: 60px;">
            <div class="spinner"></div>
            <h1 class="h1-title" id="s6-title" style="color: var(--gold);"></h1>
            <p class="subtitle" id="s6-sub"></p>
        </div>

        <div class="step" id="step-7">
            <div class="flow-title" id="s7-lbl"></div>
            <div class="result-card" id="res-card">
                <div class="result-score" id="res-score"></div>
                <div class="result-level" id="res-level"></div>
            </div>
            <div class="info-card" style="border-left: 3px solid var(--gold);" id="res-info-box">
                <div class="insight-title" id="res-sub" style="color: var(--gold);"></div>
                <div class="insight-text" id="res-desc"></div>
            </div>
            <div class="insight-card">
                <div class="insight-title" id="res-cost-lbl"></div>
                <div class="insight-text" id="res-cost-val"></div>
            </div>
        </div>

        <div class="step" id="step-8">
            <h1 class="h1-title" id="s8-title" style="color: var(--gold); text-align: center; margin-top: 20px;"></h1>
            <div class="info-card"><p class="insight-text" id="s8-msg" style="color: #eaeaea; text-align: center;"></p></div>
            <div class="info-card" style="border-left: 2px solid var(--gold);"><p class="insight-text" id="s8-disc" style="font-size: 13px;"></p></div>
        </div>

        <div class="step" id="step-9">
            <div class="flow-title" id="s9-lbl"></div><h1 class="h1-title" id="s9-title"></h1>
            <div id="s9-opts"></div>
        </div>

        <div class="step" id="step-10">
            <div class="flow-title" id="s10-lbl"></div>
            <h1 class="h1-title" id="s10-title"></h1>
            <div class="info-card"><p class="insight-text" id="s10-desc" style="color: #eaeaea;"></p></div>
            
            <div class="check-row" id="chk1" onclick="toggleTherapy('chk1')">
                <div class="box-icon">✓</div><p class="check-label" id="s10-c1"></p>
            </div>
            <div class="check-row" id="chk2" onclick="toggleTherapy('chk2')">
                <div class="box-icon">✓</div><p class="check-label" id="s10-c2"></p>
            </div>
        </div>

        <div class="step" id="step-11">
            <h1 class="h1-title" id="s11-title"></h1>
            <div id="s11-opts"></div>
        </div>

        <div class="step" id="step-12">
            <div style="text-align: center;">
                <div class="flow-title" id="s12-lbl" style="justify-content: center;"></div>
                <h1 class="h1-title" id="s12-title" style="margin-bottom: 10px;"></h1>
                <p class="subtitle" id="s12-sub" style="margin-bottom: 30px;"></p>
            </div>
            
            <div class="name-grid">
                <div style="flex: 1;">
                    <div class="flow-title" id="lbl-fname" style="margin-bottom: 8px;"></div>
                    <input type="text" id="reg-fname" class="input-field" placeholder="">
                </div>
                <div style="flex: 1;">
                    <div class="flow-title" id="lbl-lname" style="margin-bottom: 8px;"></div>
                    <input type="text" id="reg-lname" class="input-field" placeholder="">
                </div>
            </div>

            <div style="margin-bottom: 10px; margin-top: 6px;">
                <div class="flow-title" id="lbl-age" style="margin-bottom: 8px;"></div>
                <input type="number" id="reg-age" class="input-field" placeholder="">
            </div>
            
            <div style="margin-bottom: 10px; margin-top: 6px;">
                <div class="flow-title" id="lbl-email" style="margin-bottom: 8px;">EMAIL</div>
                <input type="email" id="reg-email" class="input-field" autocomplete="email" placeholder="">
            </div>
            
            <div style="margin-bottom: 10px; margin-top: 6px;">
                <div class="flow-title" id="lbl-pwd" style="margin-bottom: 8px;"></div>
                <input type="password" id="reg-password" class="input-field" placeholder="">
            </div>
            
            <button class="btn-gold" id="btn-register" onclick="handleRegistration()" style="margin-top: 10px; max-width: 100%;"></button>
            <p id="reg-error" style="color: var(--error); text-align: center; display: none; font-weight: bold; margin-top: 15px;"></p>
        </div>

    </main>

    <div class="bottom-bar" id="bottomBar" style="display: none;">
        <button class="btn-gold" id="btnNext" onclick="handleNext()"></button>
        <button class="btn-back" id="btnBack" onclick="handleBack()"></button>
    </div>

        function buildOptions() {
            const l = t[currentLang], root = answers.root_problem;
            const build = (id, opts, key, multi) => {
                const el = document.getElementById(id); el.innerHTML = '';
                const items = Array.isArray(opts) ? opts : Object.entries(opts);
                items.forEach(item => {
                    const [k, v] = Array.isArray(opts) ? [item, item] : item;
                    const isSelected = multi ? answers[key].includes(v) : answers[key] === k || answers[key] === v;
                    el.appendChild(createOptionBtn(v, isSelected, multi, () => {
                        if(multi) {
                            togglePain(v);
                            buildOptions(); 
                        } else {
                            answers[key] = k;
                            buildOptions(); 
                            
                            // 450ms Verzögerung für weichere UX bei Single Choice (erspart den Weiter-Klick)
                            setTimeout(() => {
                                handleNext();
                            }, 450);
                        }
                    }));
                });
            };
            build('s1-opts', l.s1.opts, 'root_problem', false);
            build('s2-opts', l.s2.opts[root], 'frequency', false);
            build('s3-opts', l.s3.opts, 'history', false);

            if (type === 'tim') answers.available_time = Math.max(0, Math.min(120, answers.available_time + amount));
            updateAssessmentUI();
        }

        }

        function toggleTherapy(id) {
            if(id === 'chk1') answers.therapy1 = !answers.therapy1; if(id === 'chk2') answers.therapy2 = !answers.therapy2;
            document.getElementById('chk1').className = `check-row ${answers.therapy1 ? 'selected' : ''}`;
            document.getElementById('chk2').className = `check-row ${answers.therapy2 ? 'selected' : ''}`;
            checkNextState();
        }

        function checkNextState() {
            let canGo = [4,5,7,8].includes(step) ? (step === 4 ? answers.pain_point.length > 0 : true) : step === 10 ? (answers.therapy1 && answers.therapy2) : false;
            bNext.disabled = !canGo;
        }

        function renderResult() {
            // ECR-R Logik Matrix
            const res = t[currentLang].s7;
            let lvl;
            
            if (answers.anxiety <= 5 && answers.avoidance <= 5) lvl = res.lvls.sec; // Sicher
            else if (answers.anxiety > 5 && answers.avoidance <= 5) lvl = res.lvls.anx; // Ängstlich
            else if (answers.anxiety <= 5 && answers.avoidance > 5) lvl = res.lvls.avo; // Vermeidend
            else lvl = res.lvls.dis; // Desorganisiert

            // Setze den ermittelten Typ-String als Score-Ersatz in groß, ohne % Zeichen
            document.getElementById('s7-lbl').innerText = res.lbl;
            document.getElementById('res-score').innerText = lvl.t; 
            document.getElementById('res-score').style.color = '#d48a60'; 
            
            document.getElementById('res-level').innerText = lvl.s; 
            document.getElementById('res-level').style.color = '#d48a60';
            document.getElementById('res-card').style.borderColor = '#d48a60';
            
            document.getElementById('res-sub').innerText = "PROFIL-ANALYSE"; 
            document.getElementById('res-sub').style.color = '#d48a60';
            document.getElementById('res-info-box').style.borderLeftColor = '#d48a60'; 
            
            document.getElementById('res-desc').innerText = lvl.d;
            document.getElementById('res-cost-lbl').innerText = res.costLbl; 
            document.getElementById('res-cost-val').innerText = res.costVal[answers.root_problem];
        }

        function handleNext() {
            document.getElementById(`step-${step}`).classList.remove('active'); step++;
            pCont.style.display = (step < 12 && ![6,7,8].includes(step)) ? 'block' : 'none';
            if (pCont.style.display === 'block') pBar.style.width = `${((step - 1) / 11) * 100}%`;
            
            bBar.style.display = [4,5,7,8,10].includes(step) ? 'flex' : 'none';
            if(step === 10) bNext.innerText = t[currentLang].btn.start; else bNext.innerText = t[currentLang].btn.next;
            checkNextState();
            
            document.getElementById(`step-${step}`).classList.add('active'); window.scrollTo(0,0);
            if(step === 6) setTimeout(() => { handleNext(); renderResult(); }, 2500);
        }

        function handleBack() {
            document.getElementById(`step-${step}`).classList.remove('active');
            step = Math.max(1, step === 7 ? 5 : step - 1);
            document.getElementById(`step-${step}`).classList.add('active');
            pCont.style.display = (step < 12 && ![6,7,8].includes(step)) ? 'block' : 'none';
            if (pCont.style.display === 'block') pBar.style.width = `${((step - 1) / 11) * 100}%`;
            bBar.style.display = [4,5,7,8,10].includes(step) ? 'flex' : 'none';
            checkNextState(); window.scrollTo(0,0);
        }

        function redirectToDigistore(userId, fName, lName, email) {
            const digistoreBaseUrl = digistoreLinks[currentLang] || digistoreLinks['de'];
            let targetUrl = `${digistoreBaseUrl}?custom=${encodeURIComponent(userId)}`;
            if (fName) targetUrl += `&first_name=${encodeURIComponent(fName)}`;
            if (lName) targetUrl += `&last_name=${encodeURIComponent(lName)}`;
            if (email) targetUrl += `&email=${encodeURIComponent(email)}`;
            window.location.href = targetUrl;
        }

        async function handleRegistration() {
            const fname = document.getElementById('reg-fname').value.trim();
            const lname = document.getElementById('reg-lname').value.trim();
            const age = document.getElementById('reg-age').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value;
            const errEl = document.getElementById('reg-error');
            const btn = document.getElementById('btn-register'); 
            const l = t[currentLang];
            
            if(!email || password.length < 6 || !fname || !lname || !age) { 
                errEl.innerText = l.s12.errFill; 
                errEl.style.display = 'block'; 
                return; 
            }
            
            errEl.style.display = 'none';
            btn.disabled = true;
            btn.innerText = "...";

            try {
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                // Finales Datenobjekt mit den Bindungs-Scores
                const finalPayload = {
                    name: fname + ' ' + lname,
                    age: parseInt(age, 10),
                    root_problem: answers.root_problem,
                    frequency: answers.frequency,
                    history: answers.history,
                    pain_point: answers.pain_point,
                    attachment_anxiety: answers.anxiety,
                    attachment_avoidance: answers.avoidance,
                    available_time: answers.available_time,
                    health_confirmation: answers.therapy1,
                    disclaimer_accepted: answers.therapy2,
                    rank_path: answers.rank_path
                };

                const { data, error } = await supabase.auth.signUp({ 
                    email, 
                    password, 
                    options: { 
                        data: { 
                            first_name: fname,
                            last_name: lname,
                            age: parseInt(age, 10),
                            onboarding_data: finalPayload 
                        } 
                    } 
                });

                if (error) {
                    if (error.message.includes('already registered') || error.status === 400) {
                        const { data: signInData, error: signInError } = await supabase.auth.signInWithPassword({ email, password });
                        if (signInError) { 
                            errEl.innerText = l.s12.errExists; 
                            errEl.style.display = 'block'; 
                            btn.disabled = false;
                            btn.innerText = l.btn.pay;
                            return; 
                        }
                        redirectToDigistore(signInData.user.id, fname, lname, email);
                    } else {
                        errEl.innerText = error.message; 
                        errEl.style.display = 'block';
                        btn.disabled = false;
                        btn.innerText = l.btn.pay;
                    }
                } else {
                    redirectToDigistore(data?.user?.id || 'new_user_no_id', fname, lname, email);
                }
            } catch (e) {
                console.error("Fehler: ", e);
                redirectToDigistore('guest_crash_user', fname, lname, email);
            }
        }
    </script>
</body>
