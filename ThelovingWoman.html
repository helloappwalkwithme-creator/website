    <meta charset="UTF-8">

    <title>The Loving Woman - Onboarding</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            /* Loving Woman Color Palette */
            --dark: #1f1a1c;
            --gray: #2e2628;
            --gray-active: #3f3537;
            --border: #4d4044;
            --gold: #d4a3b3; /* Soft Rose/Taupe */
            --text: #fdfafb;
            --error: #e07a7a;
            --success: #88b08b;
            --action: #88b08b; /* Calming sage green for action plan */
        }

        * { box-sizing: border-box; font-family: "Georgia", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body {
            margin: 0; padding: 0; background-color: var(--dark); color: var(--text);
            display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden;
        }

        .progress-container { width: 100%; height: 3px; background-color: #222; position: fixed; top: 0; left: 0; z-index: 100; display: block; }
        .progress-bar { height: 100%; background-color: var(--gold); width: 0%; transition: width 0.4s ease; }

        .app-header { width: 100%; max-width: 500px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 20px 20px 0 20px; }
        .app-logo { height: 44px; width: 44px; border-radius: 50%; display: block; }
        .lang-switcher { background-color: var(--gray); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; outline: none; appearance: none; text-align: center; }
        .lang-switcher:focus { border-color: var(--gold); }

        main { flex: 1; padding: 20px 20px 100px 20px; max-width: 500px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; }

        .step { display: none; animation: fadeIn 0.4s ease forwards; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .flow-title { color: var(--gold); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
        .h1-title { font-size: 26px; font-weight: 400; margin-top: 0; margin-bottom: 24px; color: var(--text); line-height: 1.35; }
        .subtitle { color: #a1a5b5; margin-bottom: 24px; font-size: 15px; line-height: 1.6; }

        .quiz-btn { background-color: var(--gray); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.25s ease; }
        .quiz-btn.selected { border-color: var(--gold); background-color: var(--gray-active); }
        .quiz-btn-text { color: var(--text); font-size: 15px; flex: 1; padding-right: 15px; line-height: 1.5; font-weight: 400; }
        .quiz-btn.selected .quiz-btn-text { color: var(--gold); font-weight: 600; }

        .radio-icon { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #555; display: flex; align-items: center; justify-content: center; }
        .quiz-btn.selected .radio-icon { border-color: var(--gold); }
        .radio-icon::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); display: none; }
        .quiz-btn.selected .radio-icon::after { display: block; }

        .check-icon { width: 22px; height: 22px; border-radius: 4px; border: 1px solid #555; display: flex; align-items: center; justify-content: center; color: transparent; font-weight: bold; font-size: 13px; }
        .quiz-btn.selected .check-icon { border-color: var(--gold); background: var(--gold); color: var(--dark); }

        .result-card { background-color: #2b2124; border: 2px solid var(--action); border-radius: 12px; padding: 25px 20px; text-align: center; margin-bottom: 16px; }
        .result-score { color: var(--action); font-size: 22px; font-weight: 600; line-height: 1.3; margin-bottom: 10px; }
        .result-level { color: #d1d5db; font-size: 15px; font-weight: 400; line-height: 1.5; }

        .insight-card { background: var(--gray); border: 1px solid var(--border); border-radius: 10px; padding: 18px; margin-bottom: 12px; }
        .insight-title { color: #a1a5b5; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        .insight-text { color: #d1d5db; font-size: 14px; line-height: 1.6; }

        .info-card { background: #261f22; border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 12px; border-left: 3px solid var(--gold); }

        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(31, 26, 28, 0.95); backdrop-filter: blur(8px); border-top: 1px solid var(--border); padding: 15px 20px 25px 20px; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .btn-gold { background-color: var(--gold); color: var(--dark); padding: 16px; border-radius: 8px; font-weight: 600; font-size: 14px; text-transform: uppercase; border: none; width: 100%; max-width: 460px; cursor: pointer; text-align: center; letter-spacing: 1.5px; transition: opacity 0.2s; }
        .btn-gold:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-back { background: none; border: none; color: #888; margin-top: 12px; padding: 8px 16px; cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }

        .input-field { background-color: var(--gray); border: 1px solid var(--border); color: #fff; padding: 16px; border-radius: 8px; font-size: 15px; margin-bottom: 16px; width: 100%; font-family: -apple-system, sans-serif; }
        .input-field:focus { border-color: var(--gold); outline: none; }


        .legal-disclaimer { font-size: 12px; color: #a1a5b5; margin-top: 20px; line-height: 1.6; text-align: center; border-top: 1px solid var(--border); padding-top: 15px; font-family: -apple-system, sans-serif; }
        .legal-disclaimer strong { color: var(--gold); font-weight: 600; }

        .spinner { border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; width: 45px; height: 45px; animation: spin 1.2s linear infinite; margin: 60px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .legal-footer { text-align: center; padding: 20px; margin-top: auto; border-top: 1px solid var(--border); font-size: 11px; padding-bottom: 120px; font-family: -apple-system, sans-serif;}
        .legal-footer a { color: #888; text-decoration: none; margin: 0 8px; transition: color 0.2s; }
        .legal-footer a:hover { color: var(--gold); }
/* ===================== TRUST LANDING (vor dem Quiz) ===================== */
        #landing { display: none; }
        body.landing-active > .app-header,
        body.landing-active > main,
        body.landing-active > .legal-footer,
        body.landing-active > .bottom-bar,
        body.landing-active > .progress-container { display: none !important; }
        body.landing-active #landing { display: block; }

        #landing .lp-wrap { max-width: 640px; margin: 0 auto; padding: 0 20px 80px; }
        #landing .lp-top { display: flex; justify-content: space-between; align-items: center; padding: 16px 0 0; }
        #landing .lp-logo { height: 52px; width: 52px; border-radius: 50%; display: block; }
        #landing .lp-lang { background: var(--gray); color: var(--text); border: 1px solid var(--border); padding: 7px 11px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; appearance: none; }
        #landing .lp-section { padding: 40px 0; border-top: 1px solid #1c1c1c; }
        #landing .lp-eyebrow { color: var(--gold); font-size: 12px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; margin-bottom: 14px; }
        #landing h2.lp-h1 { font-size: 30px; line-height: 1.18; font-weight: 800; margin: 0 0 16px; }
        #landing .lp-sub { color: #b3b3b3; font-size: 16px; line-height: 1.55; margin: 0 0 26px; }
        #landing .lp-cta { background: var(--gold); color: #000; border: none; border-radius: 12px; padding: 17px 24px; font-size: 16px; font-weight: 800; letter-spacing: .4px; cursor: pointer; width: 100%; max-width: 420px; transition: transform .1s ease, background .15s ease; }
        #landing .lp-cta:hover { background: #c6a233; transform: translateY(-1px); }
        #landing .lp-microtrust { color: #8f8f8f; font-size: 12.5px; margin-top: 12px; letter-spacing: .2px; }
        #landing .lp-rating { display: inline-flex; align-items: center; gap: 10px; margin-top: 18px; padding: 9px 14px; background: #121212; border: 1px solid #2a2a2a; border-radius: 999px; cursor: pointer; transition: border-color .15s ease; }
        #landing .lp-hero .lp-rating { display: flex; width: fit-content; margin: 4px 0 20px; }
        #landing .lp-rating:hover { border-color: var(--gold); }
        #landing .lp-rating .lp-rating-stars { color: var(--gold); font-size: 16px; letter-spacing: 1.5px; }
        #landing .lp-rating .lp-rating-stars .off { color: #3a3a3a; }
        #landing .lp-rating .lp-rating-num { color: #fff; font-weight: 800; font-size: 14px; }
        #landing .lp-rating .lp-rating-count { color: #9a9a9a; font-size: 13px; }
        #landing .lp-hero { padding-top: 26px; border-top: none; text-align: left; }
        #landing .lp-h3 { font-size: 21px; font-weight: 800; margin: 0 0 18px; }
        #landing .lp-video { position: relative; border-radius: 14px; overflow: hidden; border: 1px solid #2a2a2a; background: linear-gradient(135deg, #161616, #0c0c0c); aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
        #landing .lp-video .lp-play { width: 66px; height: 66px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; }
        #landing .lp-video .lp-play::after { content: ''; border-style: solid; border-width: 12px 0 12px 20px; border-color: transparent transparent transparent #000; margin-left: 4px; }
        #landing .lp-video-note { color: #7c7c7c; font-size: 12px; text-align: center; margin-top: 10px; }
        /* Abgrenzung "Das ist kein Coaching" */
        #landing .lp-compare { display: grid; gap: 12px; }
        #landing .lp-compare-row { background: #111; border: 1px solid #262626; border-radius: 12px; padding: 14px 16px; }
        #landing .lp-compare-row .c-old { color: #8f8f8f; font-size: 13.5px; line-height: 1.45; display: flex; gap: 9px; }
        #landing .lp-compare-row .c-old .ic { color: #6a6a6a; font-weight: 800; flex: 0 0 auto; }
        #landing .lp-compare-row .c-new { color: #f2f2f2; font-size: 14.5px; line-height: 1.5; font-weight: 600; display: flex; gap: 9px; margin-top: 9px; padding-top: 9px; border-top: 1px solid #232323; }
        #landing .lp-compare-row .c-new .ic { color: var(--gold); font-weight: 800; flex: 0 0 auto; }
        /* 90-Tage Gehirn-Journey */
        #landing .lp-brain { display: grid; gap: 12px; }
        #landing .lp-brain-phase { background: #111; border: 1px solid #262626; border-radius: 12px; padding: 16px 18px; }
        #landing .lp-brain-phase .bp-days { color: var(--gold); font-weight: 800; font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; }
        #landing .lp-brain-phase .bp-t { font-weight: 700; font-size: 15.5px; margin: 5px 0 6px; color: #f5f5f5; }
        #landing .lp-brain-phase .bp-d { color: #a8a8a8; font-size: 14px; line-height: 1.55; }
        /* Kontakt / Telefon */
        #landing .lp-contact { text-align: center; }
        #landing .lp-phone { display: inline-block; margin-top: 4px; color: var(--gold); font-weight: 800; font-size: 20px; letter-spacing: .02em; text-decoration: none; }
        #landing .lp-phone:hover { text-decoration: underline; }
        #landing .lp-pain { list-style: none; padding: 0; margin: 0; }
        #landing .lp-pain li { position: relative; padding: 14px 16px 14px 44px; background: #121212; border: 1px solid #262626; border-radius: 10px; margin-bottom: 10px; color: #d6d6d6; font-size: 15px; line-height: 1.45; }
        #landing .lp-pain li::before { content: '✓'; position: absolute; left: 16px; top: 14px; color: var(--gold); font-weight: 800; }
        #landing .lp-steps { display: grid; gap: 14px; }
        #landing .lp-step { display: flex; gap: 14px; align-items: flex-start; background: #111; border: 1px solid #262626; border-radius: 12px; padding: 16px 18px; }
        #landing .lp-step .lp-num { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 50%; background: var(--gray-active); border: 1px solid var(--gold); color: var(--gold); font-weight: 800; display: flex; align-items: center; justify-content: center; }
        #landing .lp-step-t { font-weight: 700; font-size: 15px; margin: 2px 0 4px; }
        #landing .lp-step-d { color: #a5a5a5; font-size: 14px; line-height: 1.5; }
        #landing .lp-founder { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
        #landing .lp-avatar { flex: 0 0 92px; width: 92px; height: 92px; border-radius: 50%; background: linear-gradient(135deg, #2a2a2a, #141414); border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; color: var(--gold); font-weight: 800; font-size: 30px; }
        .lp-founder-photo { flex: 0 0 132px; width: 132px; height: 172px; object-fit: cover; object-position: 50% 20%; border-radius: 14px; border: 2px solid var(--gold); box-shadow: 0 6px 18px rgba(0,0,0,.35); }
        #landing .lp-founder-body { flex: 1; min-width: 220px; }
        #landing .lp-reviews { display: grid; gap: 14px; }
        #landing .lp-review { background: #111; border: 1px solid #262626; border-radius: 12px; padding: 18px; }
        #landing .lp-stars { color: var(--gold); font-size: 17px; letter-spacing: 2px; margin-bottom: 8px; }
        #landing .lp-stars .off { color: #3a3a3a; }
        #landing .lp-review-txt { color: #dcdcdc; font-size: 14.5px; line-height: 1.55; margin: 0 0 10px; }
        #landing .lp-review-name { color: #9c9c9c; font-size: 13px; font-weight: 600; }
        #landing .lp-review-badge { color: var(--success); font-size: 11px; font-weight: 700; margin-left: 8px; }
        #landing .lp-guarantee { background: #101510; border: 1px solid #24401f; border-left: 4px solid var(--success); border-radius: 12px; padding: 20px; }
        #landing .lp-faq-item { border-bottom: 1px solid #222; padding: 16px 0; }
        #landing .lp-faq-q { font-weight: 700; font-size: 15.5px; margin: 0 0 8px; color: #f0f0f0; }
        #landing .lp-faq-a { color: #a8a8a8; font-size: 14px; line-height: 1.55; margin: 0; }
        #landing .lp-final { text-align: center; }
        #landing .lp-final .lp-sub { max-width: 480px; margin: 0 auto 22px; }
        @media (min-width: 600px) { #landing h2.lp-h1 { font-size: 36px; } #landing .lp-hero { padding-top: 40px; } }
    </style>
</head>

        function handleNext() {
            if(step === 1 && !answers.root_problem) return;
            if(step === 2 && answers.pain_point.length === 0) return;
            if(step === 3 && !answers.connection) return;
            if(step === 4 && !answers.boundaries) return;

            document.getElementById(`step-${step}`).classList.remove('active'); step++;
            document.querySelector('.progress-container').style.display = (step < 7 && step !== 5 && step !== 6) ? 'block' : 'none';
            pBar.style.width = `${((step - 1) / 6) * 100}%`;

            bBar.style.display = (step === 6) ? 'flex' : 'none';
            if(step === 6) bNext.innerText = t[currentLang].btn.next;
            checkNextState();

            document.getElementById(`step-${step}`).classList.add('active'); window.scrollTo(0,0);
            if(step === 5) setTimeout(() => { handleNext(); renderResult(); }, 2000);
        }

        function handleBack() {
            document.getElementById(`step-${step}`).classList.remove('active');
            step = Math.max(1, step === 6 ? 4 : step - 1);
            document.getElementById(`step-${step}`).classList.add('active');
            document.querySelector('.progress-container').style.display = 'block';
            pBar.style.width = `${((step - 1) / 6) * 100}%`;
            bBar.style.display = 'none';
            checkNextState(); window.scrollTo(0,0);
        }

        }

                const accessLabel = accessLabels[currentLang] || accessLabels['de'];

                console.error("Fehler beim Speichern:", e);

        function lpGetFlowKey() {

            if (pp && L.flows[pp]) return pp;
            return 'default';

        function lpStars(rating) {
            var full = Math.floor(rating);
            var half = (rating - full) >= 0.5;
            var html = '';
            for (var i = 1; i <= 5; i++) {
                if (i <= full) html += '★';
                else if (i === full + 1 && half) html += '⯪';
                else html += '<span class="off">★</span>';
            }
            return html;
        }

        function lpRenderRating(rows) {
            var el = document.getElementById('lp-rating');
            if (!el) return;
            if (!rows || !rows.length) { el.hidden = true; return; }
            var sum = rows.reduce(function(a, r){ return a + Number(r.rating || 0); }, 0);
            var avg = sum / rows.length;
            var avgStr = (currentLang === 'en') ? avg.toFixed(1) : avg.toFixed(1).replace('.', ',');
            // Nur der Schnitt — keine (irrefuehrende) Anzahl
            el.innerHTML = '<span class="lp-rating-stars">' + lpStars(avg) + '</span>' +
                           '<span class="lp-rating-num">' + avgStr + ' / 5</span>';
            el.hidden = false;
        }

        function lpRenderReviews(rows) {
            var box = document.getElementById('lp-reviews');
            var L = LANDING[currentLang] || LANDING.de;
            if (!rows || !rows.length) { box.innerHTML = '<p class="lp-sub" style="margin:0;">' + L.reviewsEmpty + '</p>'; return; }
            box.innerHTML = rows.map(function(r){
                var badge = r.verified_purchase ? '<span class="lp-review-badge">✓ Verifiziert</span>' : '';
                var safe = (r.comment || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                var name = (r.first_name || '').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                return '<div class="lp-review"><div class="lp-stars">' + lpStars(Number(r.rating)) + '</div>' +
                       '<p class="lp-review-txt">„' + safe + '"</p>' +
                       '<div class="lp-review-name">' + name + badge + '</div></div>';
            }).join('');
        }

        async function lpLoadReviews() {
            try {
                if (!supabaseClient) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                var flowKey = lpGetFlowKey();
                var q = supabaseClient.from('v_reviews_public').select('first_name,comment,rating,verified_purchase,topic,created_at');
                var res = await q;
                var allRows = (res && res.data) ? res.data : [];
                lpRenderRating(allRows); // Aggregat-Badge bleibt ueber ALLE Reviews
                // Einzel-Stimmen NUR zum passenden Flow-Topic; Uebersichtsseite (default) zeigt alle
                var rows = (flowKey === 'default') ? allRows.slice()
                         : allRows.filter(function(r){ return r.topic === flowKey; });
                lpRenderReviews(rows.slice(0, 6));
            } catch (e) { console.warn('reviews load failed', e); lpRenderRating([]); lpRenderReviews([]); }
        }
